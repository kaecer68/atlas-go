  - id: WA-806
    symbol: "internal/dailyreport/report.go::Generator.HandleLatest"
    description: |
      每日市場報告 API。Generator 從 macro/capitalflow/eventdriven 組合當日完整報告
      （資金流向 + 事件日曆 + 策略訊號 + 風險提示），提供 JSON + Markdown 雙格式輸出。
      archive 提供歷史查詢，subscribe 提供郵件訂閱。
    triggers:
      - http: "GET /api/reports/latest", "GET /api/reports/archive", "POST /api/reports/subscribe"
    depends_on:
      - WA-800
      - WA-803
    produces: "JSON { date, macro, capital_flow, events, strategies, risk, summary }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"
