  # 9. Wave 11 v0.0.0.31 新增端點（4 個）
  - id: WA-800
    symbol: "internal/capitalflow/handler.go::HandleDaily"
    description: |
      資金流向日報 API。從 MacroDataSnapshot 提取 7 個資金勢力 Z-score + 共振係數 + 品質分數。
      v0.0.0.31 新增，搭配 Phase B tier-gated home dashboard 渲染。
    triggers:
      - http: "GET /api/capital-flow/daily"
    depends_on:
      - WA-001
    produces: "JSON { forces, resonance, quality_score, summary }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"

  - id: WA-801
    symbol: "internal/capitalflow/handler.go::HandleSummary"
    description: |
      資金流向摘要 API。回傳當前主力方向、共振強度、品質分數標籤，給予 Phase B tier-gated dashboard 使用。
    triggers:
      - http: "GET /api/capital-flow/summary"
    depends_on:
      - WA-800
    produces: "JSON { summary, quality_score, quality_label, resonance, forces }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"

  - id: WA-802
    symbol: "internal/eventdriven/handler.go::HandleCalendar"
    description: |
      事件日曆 API。從 industry.EventCalendar 取出未來 14 天事件列表，並預估每個事件的資金流方向。
      Phase B tier-gated home dashboard 渲染「近期事件」區塊使用。
    triggers:
      - http: "GET /api/events/calendar"
    depends_on:
      - WA-001
    produces: "JSON { events, total }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"

  - id: WA-803
    symbol: "internal/eventdriven/handler.go::HandlePrediction"
    description: |
      5 日事件驅動資金流預測 API。結合事件日曆 + 當前資本品質分數，預測未來 5 天資金移動方向 + ETF 規模×權重預估。
    triggers:
      - http: "GET /api/events/prediction"
    depends_on:
      - WA-802
    produces: "JSON { predictions, active_events, etf_estimates, summary }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"

  - id: WA-804
