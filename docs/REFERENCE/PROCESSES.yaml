      即時體制偵測。透過 websocket 推播接收即時市場訊號，
      需 `-allow-realtime` flag 啟用。
    triggers:
      - cli: "-allow-realtime"
      - event: websocket push
    depends_on: [WA-100]
    produces: "real-time regime signal"
    criticality: P1
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-102
    symbol: "internal/apigateway/us_market_refresh.go::NewUSMarketRefreshTask"
