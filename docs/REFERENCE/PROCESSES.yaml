      - cron: daily
      - event: gateway channel adapter startup
    depends_on: []
    produces: "channel snapshots"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-101
    symbol: "internal/marketdata/realtime/"
