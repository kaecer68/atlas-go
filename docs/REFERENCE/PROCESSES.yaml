    description: |
      投資推薦分層 API。JWT 或 X-User-Email header 解析 user tier，回傳對應層級的策略推薦 + 市場燈號。
      Tier 順序: public < registered < premium，premium 用戶取得完整策略訊號 + 進出場點位。
    triggers:
