  # 3.3 決策與執行層
  - id: WA-300
    symbol: "internal/orchestrator/sector_agent_llm.go::SemiconductorLLMAgent.Supports"
    description: |
      確定性產業執行器（以半導體為例）。依 per-symbol 排程執行，
      產出 Recommendation。可切換為 LLM 模式。
