    depends_on:
      - WA-805
    produces: "JSON { tier, market, strategies }"
    criticality: P1
    test_coverage: tested
    last_verified: "2026-07-07"
    verified_by: "PR #972"

  - id: WA-805
    symbol: "internal/subscription/handler.go::RegisterRoutes"
    description: |
      使用者訂閱與認證。3-tier (public/registered/premium) + 7 天免費試用 + JWT (HS256)。
      SQLite store 儲存 users / subscription_events，支援 register / login / profile / subscription 端點。
    triggers:
      - http: "POST /api/auth/register", "POST /api/auth/login", "GET /api/user/profile", "GET /api/user/subscription"
