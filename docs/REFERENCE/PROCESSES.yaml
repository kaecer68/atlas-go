      LLM 產業 Agent Loop。對單一標的執行 Plan → ToolCall → Reflect loop，
      直到產出最終 conviction。
    triggers:
      - event: per-symbol LLM schedule
      - cli: "-use-llm-sector-agents"
    depends_on: [WA-200, WA-201, WA-302]
    produces: "final conviction"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-302
