workflows:
  # 2. 入口 Run Mode（5 個）
  - id: WA-001
    symbol: "cmd/atlas/main.go::runAPIServer"
    description: |
      API 服務入口。啟動 Dashboard API server、Gateway、Plugin chain 與 Fubon-proxy，
      預設 listen :18080，是 atlas-go 主要長生命週期入口（見 internal/constants/port.go）。
    triggers:
      - cli: "--api"
    depends_on: []
    produces: "HTTP API server"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-002
    symbol: "cmd/atlas/main.go::runLiveTrading"
    description: |
      Live Trading 入口。啟動 broker-aware live trading orchestrator，
      支援 dry-run / paper / live 模式。
    triggers:
      - cli: "--live"
    depends_on: [WA-001]
    produces: "live trading session"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-003
    symbol: "cmd/atlas/main.go::runSimulation"
    description: |
      模擬入口。執行一次性 daily simulation，完成後 exit。
    triggers:
      - cli: "--simulate"
    depends_on: []
    produces: "simulation report"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-004
    symbol: "cmd/atlas/main.go::runBuildUniverse"
    description: |
      建構 Universe 入口。執行 SmartUniverseBuilder pipeline（run/map/scrape/status），
      完成後 exit。
    triggers:
      - cli: "--build-universe"
    depends_on: []
    produces: "universe build result"
    criticality: P0
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  - id: WA-005
    symbol: "cmd/atlas/main.go::runPrismWorker"
    description: |
      PRISM Worker 入口。輕量 daemon，執行 PRISM cohort 訓練子任務。
    triggers:
      - cli: "prism worker"
    depends_on: []
    produces: "cohort training result"
    criticality: P1
    test_coverage: unknown
    last_verified: "2026-07-01"
    verified_by: "agent-interface-audit"

  # 3.1 資料與市場層
  - id: WA-100
    symbol: "internal/marketdata/provider.go::Provider"
