# Mac Mini production — atlas cron services (C-pg1)（2026-09-22 起 production = Mac Mini；iMac 已退役）
# 使用: docker compose -f docker-compose.prod.yml -f docker-compose.crons.yml up -d
# 注意: crons 連 host.docker.internal 的 atlas-postgres (:55432) 和 atlas-go (:18080)

services:
  cron-geo-ingest:
    image: atlas-cron:latest
    container_name: atlas-cron-geo-ingest
    restart: unless-stopped
    # 注入 shared secrets（ATLAS_LIVENESS_TOKEN 等）——compose interpolation
    # 不讀 ~/.config/atlas-go/.env，故用 env_file（同 alertmanager 模式）。
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/geo-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in the shell env or the repo-root .env (gitignored); never hardcode it here}@host.docker.internal:55432/atlas?sslmode=disable
      - CRON_TASK_NAME=cron_geo_ingest
      - ATLAS_LIVENESS_URL=http://host.docker.internal:18080/api/internal/task-liveness
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

  cron-macro-ingest:
    image: atlas-cron:latest
    container_name: atlas-cron-macro-ingest
    restart: unless-stopped
    # 注入 shared secrets（ATLAS_LIVENESS_TOKEN 等）——compose interpolation
    # 不讀 ~/.config/atlas-go/.env，故用 env_file（同 alertmanager 模式）。
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/macro-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in the shell env or the repo-root .env (gitignored); never hardcode it here}@host.docker.internal:55432/atlas?sslmode=disable
      - CRON_TASK_NAME=cron_macro_ingest
      - ATLAS_LIVENESS_URL=http://host.docker.internal:18080/api/internal/task-liveness
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

  cron-replay-sync:
    image: atlas-cron:latest
    container_name: atlas-cron-replay-sync
    restart: unless-stopped
    # 注入 shared secrets（ATLAS_LIVENESS_TOKEN 等）——compose interpolation
    # 不讀 ~/.config/atlas-go/.env，故用 env_file（同 alertmanager 模式）。
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      - CRON_SCHEDULE=30 15 * * *
      - CRON_COMMAND=/app/daily-replay-sync -csv /app/data/replay/tw_extended_90days.csv
      - DATABASE_URL=postgres://atlas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in the shell env or the repo-root .env (gitignored); never hardcode it here}@host.docker.internal:55432/atlas?sslmode=disable
      - CRON_TASK_NAME=cron_replay_sync
      - ATLAS_LIVENESS_URL=http://host.docker.internal:18080/api/internal/task-liveness
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

  # D1 決策退役 2026-08-17 / E17 實體移除 2026-09-26:
  # cron-darwinian 服務與其退役的 shell stub 已一併刪除（`Makefile` 的
  # CRON_IMAGE_TAGS 與 rebuild-cron 的 compose up 清單同步移除；守門
  # tests/scripts/test-binary-freshness-guard.sh 要求兩邊數量相等）。
  # 真實 Darwinian 演化由 Go BTM `auto_daily_simulation` 承載，見
  # internal/portfolio/darwinian_weights.go。請勿再於本檔或 repo 根
  # docker-compose.yml 復活此服務。
  # 生產注意：`docker compose up -d`（不帶 --remove-orphans）不會移除既有容器，
  # 舊的 atlas-cron-darwinian 會繼續以 restart: unless-stopped 跑舊 image，
  # 需 `docker compose up -d --remove-orphans` 或 `docker rm -f atlas-cron-darwinian`。

  cron-quote-backfill:
    image: atlas-cron:latest
    container_name: atlas-cron-quote-backfill
    restart: unless-stopped
    # 注入 shared secrets（ATLAS_LIVENESS_TOKEN 等）——compose interpolation
    # 不讀 ~/.config/atlas-go/.env，故用 env_file（同 alertmanager 模式）。
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      - CRON_SCHEDULE=0 3 * * *
      - CRON_COMMAND=/app/cron-quote-backfill
      - CRON_TASK_NAME=cron_quote_backfill
      - ATLAS_LIVENESS_URL=http://host.docker.internal:18080/api/internal/task-liveness
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

