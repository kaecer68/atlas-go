services:
  # Main Atlas application
  atlas:
    build:
      context: .
      # Use Dockerfile.atlas.local by default (host pre-built binary).
      # Switch to Dockerfile for pure-Docker CI builds.
      dockerfile: Dockerfile.atlas.local
      args:
        # Local and CI builds must provide the source commit explicitly. An image
        # with `Commit=unknown` cannot pass the binary freshness gate.
        VERSION: ${ATLAS_VERSION:-dev}
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:-unknown}
        # Pass through ATLAS_WARMUP; unset = default enabled.
        WARMUP: ${ATLAS_WARMUP:-}
    container_name: atlas-go
    restart: unless-stopped
    command: ["-api", "-live", "-addr", ":18080", "-fubon-port", "18081"]  
    ports:
      - "18080:18080"
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      - ATLAS_ENV=production
      - ATLAS_LOG_LEVEL=info
      - ATLAS_DATA_DIR=/app/data
      - ATLAS_CONFIG_DIR=/app/configs
      # ATLAS_API_KEY intentionally NOT set in environment — it would
      - ATLAS_WARMUP=${ATLAS_WARMUP:-}
      # shadow env_file with shell-expanded ${ATLAS_API_KEY} (empty
      # in local dev). The .env file is the canonical source, and
      # the AuthMiddleware reads it from the env_file pass-through.
      # CI/CD should set ATLAS_API_KEY in the .env file rather than
      # rely on shell env (which contradicts env_file semantics).
      # Regression: PR #79 originally added `ATLAS_API_KEY=${...}`
      # here, which silently broke all local dev since the shell
      # var is unset. Removed in favor of env_file-only path.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - ATLAS_WARMUP=${ATLAS_WARMUP:-}
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]  
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 啟動順序依賴:atlas 啟動時若 postgres/redis 還沒 ready 就 ping,
    # 會撞 SQLSTATE 57P03("database system is starting up")。docker
    # compose 預設平行啟動,所以必須用 condition: service_healthy
    # 等依賴服務 healthcheck 通過才啟動 atlas,避免 race condition。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fubon MarketData Proxy (Python microservice)
  fubon-proxy:
    build:
      context: ./services/fubon-proxy
      dockerfile: Dockerfile
      # 升版 fubon-neo 时只动 FUBON_NEO_VERSION,Dockerfile 会根据
      # TARGETARCH(arm64 -> aarch64, amd64 -> x86_64)自动从官方 CDN
      # 选对应 manylinux_2_17 wheel 下来。URL 模式见
      # https://www.fbs.com.tw/TradeAPI/docs/download/download-sdk
      args:
        FUBON_NEO_VERSION: "2.2.8"
    container_name: atlas-fubon-proxy
    restart: unless-stopped
    ports:
      - "18081:18081"
    # env_file loads FUBON_PERSONAL_ID / FUBON_PASSWORD / FUBON_API_KEY /
    # FUBON_CERT_PATH / FUBON_CERT_PASSWORD from ~/.config/atlas-go/.env.
    # Earlier the values used `${...}` shell expansion, which silently
    # produced empty strings inside the container when the host shell
    # did not have them set — main.py's /health check then returned 503
    # with "FUBON_PERSONAL_ID and FUBON_PASSWORD must be set".
    # env_file mirrors the pattern already used by the atlas service
    # so the .env file is the single source of truth.
    env_file:
      - ${HOME}/.config/atlas-go/.env
    environment:
      # FUBON_PROXY_PORT stays in environment (not env_file) because
      # it is a service-port constant owned by this compose file.
      - FUBON_PROXY_PORT=18081
      # .p12 凭证书放在 ~/.config/atlas-go/.fubon-env/,挂进容器对应路径
      # 让 main.py:_find_cert() 的 glob 搜尋(默认 ~/.config/atlas-go/.fubon-env)
      # 可以找到。SDK 本身由 Dockerfile 从官方下載 manylinux wheel install,
      # 不靠这个 mount。
    volumes:
      - ~/.config/atlas-go/.fubon-env:/home/appuser/.config/atlas-go/.fubon-env:ro
    networks:
      - atlas-network
    healthcheck:
      # fubon-proxy 容器自身的健康檢查 (本機 loopback)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health')"]  
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and message queue
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - atlas-network
    command: redis-server --appendonly yes
    # atlas service depends_on redis:condition: service_healthy,所以 redis
    # 必須有 healthcheck 才能等 atlas 啟動順序。PING 是 redis 健康檢查
    # 標準做法,回 PONG 表示 redis server 已接受 connection。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # TimescaleDB for persistent storage and time-series data
  postgres:
    image: timescale/timescaledb:2.14.2-pg15
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=atlas
      - POSTGRES_PASSWORD=${DB_PASSWORD:-atlas}
      - POSTGRES_DB=atlas
      - TS_TUNE_MEMORY=2GB
      - TS_TUNE_NUM_CPUS=4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - atlas-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # OpenTelemetry collector — receives OTLP HTTP from atlas, writes
  # traces to TimescaleDB via postgresql exporter.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: atlas-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otel-collector/config.yaml:ro
    networks:
      - atlas-network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  # Alertmanager for routing alerts (Wave 7.1)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: atlas-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - atlas-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: atlas-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - atlas-network
    depends_on:
      - prometheus

  # Daily cron job for geopolitical risk data ingestion
  cron-geo-ingest:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-geo-ingest
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/geo-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres
    healthcheck:
      disable: true

  # Daily cron job for macro data ingestion (after US market close, Taiwan time)
  cron-macro-ingest:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-macro-ingest
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/macro-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres
    healthcheck:
      disable: true

  # Daily cron job for replay data sync (Taiwan market close + 30 min)
  cron-replay-sync:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-replay-sync
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=30 15 * * *
      - CRON_COMMAND=/app/daily-replay-sync -csv /app/data/replay/tw_extended_90days.csv
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres
    healthcheck:
      disable: true

  # Daily cron job for Darwinian weights adjustment
  cron-darwinian:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-darwinian
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 9 * * *
      - CRON_COMMAND=/app/scripts/darwinian_adjust.sh --apply
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres
    healthcheck:
      disable: true

  # C07 sector prediction observation — daily collector (weekdays 15:30).
  # Runs scripts/c07-collect.sh: pulls /api/events/prediction, computes JSD /
  # latency / confidence / sector count, appends a row to the obs log, and
  # fires alerts to monitoring.AlertStore on threshold breach.
  # Obs log is stored on the shared ./docs bind; alert dir on shared
  # ./data/state/alerts so it joins the main atlas-go process's store.
  atlas-cron-c07-collect:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-c07-collect
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=30 15 * * 1-5
      - CRON_COMMAND=/app/scripts/c07-collect.sh
      - ATLAS_BASE_URL=http://atlas:18080
      - C07_OBS_LOG=/app/docs/archive/sector-prediction-observation-log.md
      - C07_ALERT_DIR=/app/data/state/alerts
      - C07_TZ=Asia/Taipei
    volumes:
      - ./docs:/app/docs
      - ./data/state/alerts:/app/data/state/alerts
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
    healthcheck:
      disable: true

  # C07 sector prediction observation — Day 7 / Day 14 evaluator.
  # Runs daily 09:00 weekdays; scripts/c07-evaluate.sh self-detects Day 7 / 14
  # from the earliest record date in the obs log and only fires the formal
  # acceptance report on those days (no-op otherwise). Exit code 1 on
  # MUST-criterion failure → alert/notify path via atlas AlertStore + audit log.
  atlas-cron-c07-evaluate:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-c07-evaluate
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 9 * * 1-5
      - CRON_COMMAND=/app/scripts/c07-evaluate.sh
      - C07_OBS_LOG=/app/docs/archive/sector-prediction-observation-log.md
      - C07_REPORT_DIR=/app/reports/c07-evaluation
      - C07_TZ=Asia/Taipei
    volumes:
      - ./docs:/app/docs
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
    healthcheck:
      disable: true

  # Monthly cron job for month revenue backfill (1st of each month)

  # Monthly cron job for financial statements backfill (1st of each month)

  # Daily cron job for institutional investors backfill (nightly 2am)

  # Daily cron job for stock quote backfill (nightly 3am)
  cron-quote-backfill:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-cron-quote-backfill
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 3 * * *
      - CRON_COMMAND=/app/cron-quote-backfill
      - FINMIND_API_KEY=${FINMIND_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
    healthcheck:
      disable: true

  # PRISM training queue processor
  prism-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${ATLAS_GIT_COMMIT:?ATLAS_GIT_COMMIT must be set to the source commit}
    container_name: atlas-prism-worker
    restart: unless-stopped
    # Command is args-only — the Dockerfile ENTRYPOINT already provides
    # the binary path. Writing the full path here would prepend it again
    # and produce `/app/atlas-go /app/atlas-go prism worker`, which
    # confuses the subcommand router in run() and makes the container
    # fall through to runSimulation() (one-shot → 60s restart loop).
    command: ["prism", "worker"]
    environment:
      - ATLAS_ENV=production
      - ATLAS_WORKER_TYPE=prism
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - atlas-network
    depends_on:
      - redis
      - postgres
    # Override Dockerfile HEALTHCHECK — it targets localhost:18080 which
    # only the atlas API service exposes. The prism-worker container
    # does not serve HTTP, so the inherited healthcheck always fails.
    # A real readiness probe for the worker would query PRISM queue
    # stats; for now we disable and rely on process liveness.
    healthcheck:
      disable: true

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  atlas-network:
    driver: bridge
