version: '3.8'

services:
  # Main Atlas application
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-go
    restart: unless-stopped
    command: ["-api"]
    ports:
      - "8080:8080"
    environment:
      - ATLAS_ENV=production
      - ATLAS_LOG_LEVEL=info
      - ATLAS_DATA_DIR=/app/data
      - ATLAS_CONFIG_DIR=/app/configs
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Fubon MarketData Proxy (Python microservice)
  fubon-proxy:
    build:
      context: ./services/fubon-proxy
      dockerfile: Dockerfile
    container_name: atlas-fubon-proxy
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - FUBON_PERSONAL_ID=${FUBON_PERSONAL_ID}
      - FUBON_API_KEY=${FUBON_API_KEY}
      - FUBON_PROXY_PORT=8081
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and message queue
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - atlas-network
    command: redis-server --appendonly yes

  # TimescaleDB for persistent storage and time-series data
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=atlas
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=atlas
      - TS_TUNE_MEMORY=2GB
      - TS_TUNE_NUM_CPUS=4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - atlas-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: atlas-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - atlas-network
    depends_on:
      - prometheus

  # Daily cron job for geopolitical risk data ingestion
  cron-geo-ingest:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-geo-ingest
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/geo-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Daily cron job for macro data ingestion (after US market close, Taiwan time)
  cron-macro-ingest:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-macro-ingest
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 8 * * *
      - CRON_COMMAND=/app/macro-ingest -work-dir /app
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Daily cron job for replay data sync (Taiwan market close + 30 min)
  cron-replay-sync:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-replay-sync
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=30 15 * * *
      - CRON_COMMAND=/app/daily-replay-sync -csv /app/data/replay/tw_extended_90days.csv
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Daily cron job for Darwinian weights adjustment
  cron-darwinian:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-darwinian
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 9 * * *
      - CRON_COMMAND=/app/scripts/darwinian_adjust.sh --apply
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Monthly cron job for month revenue backfill (1st of each month)
  cron-backfill-month-revenue:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-backfill-month-revenue
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 0 1 * *
      - CRON_COMMAND=/app/backfill-month-revenue -start $$(date -d '2 months ago' +%Y-%m-01) -end $$(date -d 'last month' +%Y-%m-%d)
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Monthly cron job for financial statements backfill (1st of each month)
  cron-backfill-financial-statements:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-backfill-financial-statements
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 0 1 * *
      - CRON_COMMAND=/app/backfill-financial-statements -start $$(date -d '2 months ago' +%Y-%m-01) -end $$(date -d 'last month' +%Y-%m-%d)
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # Monthly cron job for institutional investors backfill (1st of each month)
  cron-backfill-institutional-investors:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: atlas-cron-backfill-institutional-investors
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=0 0 1 * *
      - CRON_COMMAND=/app/backfill-institutional-investors -date $$(date -d 'yesterday' +%Y-%m-%d)
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - atlas-network
    depends_on:
      - atlas
      - postgres

  # PRISM training queue processor
  prism-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-prism-worker
    restart: unless-stopped
    command: ["/app/atlas-go", "prism", "worker"]
    environment:
      - ATLAS_ENV=production
      - ATLAS_WORKER_TYPE=prism
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - atlas-network
    depends_on:
      - redis
      - postgres

  # MiroFish swarm simulation runner
  swarm-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-swarm-runner
    restart: "no"
    command: ["/app/atlas-go", "swarm", "run"]
    environment:
      - ATLAS_ENV=production
      - DATABASE_URL=postgres://atlas:${DB_PASSWORD}@postgres:5432/atlas?sslmode=prefer
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - atlas-network
    profiles:
      - swarm

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  atlas-network:
    driver: bridge
