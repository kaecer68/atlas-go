run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck      # unchecked errors
    - gosimple      # code simplifications
    - govet         # go vet
    - ineffassign   # ineffective assignments
    - staticcheck   # static analysis
    - unused        # unused code/variables
    - gosec         # security checks
    - gofmt         # formatting
    - goimports     # import ordering
    - misspell      # spelling in comments
    - unconvert     # unnecessary type conversions
    - unparam       # unused function parameters

linters-settings:
  gosec:
    excludes:
      - G104     # allow unchecked errors in defer Close() — project convention
      - G204     # allow os/exec for broker/staging CLI tools
  goimports:
    local-prefixes: github.com/kaecer68/atlas-go
  misspell:
    locale: US
  errcheck:
    check-blank: true

issues:
  exclude-files:
    - ".*_test\\.go"
    - "internal/experiment/data/.*"
    - "data/.*"
  exclude-dirs:
    - .worktrees
    - .gocache
    - graphify-out
  max-issues-per-linter: 0
  max-same-issues: 0
