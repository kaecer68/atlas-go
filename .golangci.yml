version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - ineffassign   # ineffective assignments
    - staticcheck   # static analysis
    - unused        # unused code/variables
    - gosec         # security checks
    - misspell      # spelling in comments
    - unconvert     # unnecessary type conversions
    - unparam       # unused function parameters

  settings:
    gosec:
      excludes:
        - G104     # allow unchecked errors in defer Close() — project convention
        - G204     # allow os/exec for broker/staging CLI tools
        - G301     # directory permissions: MkdirAll(0755) is standard for data dirs
        - G302     # file permissions: OpenFile(0644) is standard for data files
        - G304     # file inclusion via variable: CLI tools read paths from args/config
        - G306     # WriteFile permissions: 0644 is standard for data files
        - G404     # math/rand is appropriate for simulations, not security-sensitive
        - G703     # path traversal taint: same as G304 but via taint analysis
    misspell:
      locale: US
      ignore-rules:
        - strat       # intentional abbreviation for "strategy layer"
        - cancelled   # domain enum values (would break JSON serialization)
    errcheck:
      # check-blank: false — `_ = f.Close()` 是專案約定的唯讀資源釋放慣例
      # 參見 .github/instructions/go-core.instructions.md「唯讀 Close 錯誤處理」
      check-blank: false

  exclusions:
    paths:
      - ".*_test\\.go"
      - "internal/experiment/data/.*"
      - "data/.*"
      - ".worktrees"
      - ".gocache"
      - "graphify-out"
      # Legacy CLI tools with pre-existing unchecked errors (not part of this PR)
      - "cmd/calibrate-seasonal/.*"
      - "cmd/fetch-historical/.*"
      - "cmd/calibrate-stress-index/.*"
      - "internal/industry/correlation_loader.go"
      - "internal/monitoring/alert_store.go"
      - "internal/monitoring/api/events/sse_handler.go"
      # Legacy industry module files with pre-existing G304 issues (not part of this PR)
      - "internal/industry/seasonal_calibrator.go"
      - "internal/industry/linkage.go"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/kaecer68/atlas-go)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
