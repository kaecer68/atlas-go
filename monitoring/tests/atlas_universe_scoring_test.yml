                生產目前沒有任何 ranked 消費者,所以下游不會壞 —— **只有外部監看抓得到**。
              - 已知生產根因(2026-06-22 起,連續 3 個月):UniverseBuilderDeps.Quotes 是常數 nil
                ⇒ BuildUniverse Step 3 走 else 分支(空 quoteMap)⇒ 每個 symbol 在
                「quotes 查不到就 continue」短路 ⇒ survivors=0 → passed=0 → ranked=0。
              - 與 #1971 gate 的觀察窗不變量 `symbols_ranked > 0` 直接相關:本條 firing 就是
                那個不變量被違反。rollback 政策寫在 configs/parameters.json 的 todo(業主裁決)。

              先查什麼(依序):
              1. 評分階段日誌:docker logs atlas-go --since 48h 2>&1 | grep -E "scoring_ok|daily_refresh_ok"
                 看 input=.. ranked=..。（scoring_ok 只是 INFO、沒有門檻,要看數字）
              2. Quotes provider 是否被接上:grep -n "Quotes:" cmd/atlas/bootstrap_helpers.go
                 wiring 若是 nil(bootstrap_helpers.go:217)就是這個症狀的根因。
              3. 交叉證據:curl -s localhost:18080/metrics | grep -c universe_quotes_fetched_total
                 回 0(series 根本不存在)⇒ Step 3 的 quotes 分支從未執行(走的是 else)。
              4. ⚠️ 不要看 counter 絕對值:atlas_universe_* 目前被自身累積值灌爆
                 (輸出 = x·N(N+1)/2;實測只跑 2 輪就顯示 4797),任何數字門檻都會隨天數失效。
                 本規則只看 increase() 是否為 0,與這個缺陷無關。
              5. 若本指標 family 整體消失(被改名/移除),ranked 側計為 0 ⇒ 一樣會 firing
                 (刻意如此:指標消失也是零偵測的一種)。
            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"
      - eval_time: 60m
        alertname: AtlasUniverseScreeningAllRejected
        exp_alerts:
        - exp_labels:
            alertname: "AtlasUniverseScreeningAllRejected"
            component: "universe-screening"
            incident_ref: "universe-scoring-gap-20260925"
            service: "atlas"
            severity: "warning"
            wave: "9.2"
          exp_annotations:
            summary: "universe 篩選全滅:4 天內全部 symbol 被判 failed(passed 增量為 0)"
            description: |
              篩選階段在過去 4 天內把所有 symbol 都判為 failed,沒有任何一個進入 passed
              (failed 側有增量 ⇒ pipeline 確實跑過,不是「今天還沒跑」)。

              這代表什麼:
              - passed=0 是 ranked=0 的**相鄰上游**:survivors 空 → ScreenUniverse 沒有東西可評分。
              - 常見成因兩個:
                (a) quotes 是空的 —— 查不到 quote 就 continue,等同「全部不合格」
                    (生產 2026-06-22 起的實例,見 AtlasUniverseRankedZero 的說明);
                (b) 門檻真的把所有 symbol 濾掉 —— VolumeFloorTWD / PriceMin 設定或
                    Volume/Last 單位語意有問題(approxTWD = Volume * Last)。
              - 兩條告警一起 firing ⇒ 優先懷疑 (a);只有本條 firing 而 ranked 仍有增量 ⇒ 查 (b)。
              - 標籤註記:本條同時接受 result= 與 daily= 兩種標籤名(生產目前因 onInc 的
                name/value 配對缺陷輸出 daily=,來源碼語意是 stage/daily + result/…)。

