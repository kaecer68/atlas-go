              6. 若本指標 family 整體消失(被改名/移除),ranked 側計為 0 ⇒ 一樣會 firing
                 (刻意如此:指標消失也是零偵測的一種)。
            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"
      - eval_time: 60m
        alertname: AtlasUniverseScreeningAllRejected
        exp_alerts:
        - exp_labels:
            alertname: "AtlasUniverseScreeningAllRejected"
            component: "universe-screening"
