                    (生產 2026-06-22 起的實例,見 AtlasUniverseRankedZero 的說明);
                (b) 門檻真的把所有 symbol 濾掉 —— VolumeFloorTWD / PriceMin 設定或
                    Volume/Last 單位語意有問題(approxTWD = Volume * Last)。
              - 三條一起看:本條 + AtlasUniverseQuotesMissing 同時 firing ⇒ 優先懷疑 (a);
                只有本條 firing 而 ranked 仍有增量 ⇒ 查 (b)。

              先查什麼(依序):
              1. 篩選/評分日誌:docker logs atlas-go --since 48h 2>&1 | grep -E "scoring_ok|daily_refresh_ok|empty_filtered"
              2. 門檻現值:SmartUniverse 的 VolumeFloorTWD / PriceMin(configs/parameters.json)
              3. quotes 是否為空:curl -s localhost:18080/metrics | grep universe_quotes_fetched_total
                 (series 不存在 = quotes 分支沒執行 = quoteMap 空)
              4. ⚠️ 同上,不要用 counter 絕對值當門檻(x·N(N+1)/2 灌爆缺陷)。
            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"
      - eval_time: 48h
        alertname: AtlasUniverseQuotesMissing
        exp_alerts:
        - exp_labels:
            alertname: "AtlasUniverseQuotesMissing"
            component: "universe-quotes"
            incident_ref: "universe-scoring-gap-20260925"
            service: "atlas"
            severity: "warning"
            wave: "9.2"
          exp_annotations:
            summary: "universe pipeline 跑了但沒有任何報價資料(provider 缺失或回空)"
            description: |
              SmartUniverseBuilder 在過去 6 天內至少完成過一次執行(screening 有增量),
              但同一段期間 `atlas_universe_quotes_fetched_total` 完全沒有增量
              —— 也就是 Step 3 拿到的 quoteMap 不是空的、就是整個 quotes 分支沒被執行。

              這代表什麼:
              - quotes 是評分階段唯一的 Volume/Last 來源;沒有它,`applyVolumeAndPriceFilters`
                對每個 symbol 都在「quotes 查不到就 continue」短路 ⇒ survivors=0 ⇒ passed=0
                ⇒ ranked=0。**這是 ranked=0 的直接原因**,不是間接推論。
              - 兩個分支要分辨(這是本條的重點):
                (a) **provider 沒接上**:`cmd/atlas/bootstrap_helpers.go:217` 的 `Quotes: nil`
                    ⇒ 指標 series 根本不存在(生產現況:實查 /metrics 沒有這個 family)。
                (b) **provider 有接但回空或回錯**:series 存在但值為 0,且通常伴隨
                    `quotes_fetch_error` WARN 與 `atlas_universe_quotes_errors_total{daily="fetch_error"}`。
                兩者對下游的後果完全相同(空 quoteMap ⇒ ranked=0),所以都該 firing。

              先查什麼(依序):
              1. 有沒有 fetch error:docker logs atlas-go --since 48h 2>&1 | grep -E "quotes_fetch|quotes_provider|quotes_status"
              2. 指標在不在:curl -s localhost:18080/metrics | grep -E "universe_quotes_(fetched|errors)"
                 完全沒有輸出 ⇒ 走的是 (a),去看 wiring:
                 grep -n "Quotes:" cmd/atlas/bootstrap_helpers.go
              3. 有 series 但值為 0 ⇒ 走的是 (b):查 provider 額度/憑證(FinMind 日配額 14400)
                 與代號正規化(normalizeSymbol 後鍵不匹配也會回空)。
              4. 若部署已含 #1979:快照 data/state/universe_snapshot.json 的
                 result.quotes_status 會直接寫 `provider_unavailable` / `fetch_error` / `empty`
                 —— 這是最快的一步(不用猜)。
              5. 修好之後本條會自動 resolve(下一次執行增加 quotes_fetched series)。
            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

  - name: "I 殘留 result= series 恆 0 且 daily= 真實通過（F-3 回歸）:第 2 條不得 firing（必須相加,不是先 match 到誰就用誰）"
    interval: 1h
    input_series:
      - series: 'atlas_universe_symbols_screened_total{daily="failed"}'
        values: '0x2 1599x120'
      - series: 'atlas_universe_symbols_screened_total{daily="passed"}'
        values: '0x2 800x120'
      - series: 'atlas_universe_symbols_screened_total{result="passed"}'
        values: '0x122'
      - series: 'atlas_universe_symbols_ranked_total'
        values: '0x2 500x120'
      - series: 'atlas_universe_quotes_fetched_total'
        values: '0x2 1599x120'
    alert_rule_test:
      - eval_time: 10h
        alertname: AtlasUniverseRankedZero
        exp_alerts: []
      - eval_time: 10h
        alertname: AtlasUniverseScreeningAllRejected
        exp_alerts: []
      - eval_time: 10h
        alertname: AtlasUniverseQuotesMissing
        exp_alerts: []
