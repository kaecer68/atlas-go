                  below_price_floor 各濾掉幾檔 —— 直接指出是哪個濾網把母體吃光)
              4. 若 last_run_outcome 是 other:這是新的 RankedFallbackReason 尚未映射,
                 見 internal/monitoring/universe_run_verdict.go 的 RunOutcome()。

