# monitoring/tests/atlas_universe_scoring_test.yml
#
# promtool unit tests(`promtool test rules`)for
# monitoring/rules/atlas_universe_scoring_alerts.yml 的第 1/2/3/5/7 條
# (last_run_* 輸出族的三個判定 bucket:評分空轉 / 篩選全滅 / 報價不可用,以及母體空 /
#  filter 全滅)。
#
# 為什麼需要這個檔案:`promtool check rules` 只驗語法 —— 它驗不到「這條規則在真實序列上
# **會不會** firing」。本檔的存在理由就是那一類缺陷:生產實例是「母體評分連續 3 個月空轉、
# 四道防線全部沉默」。
#
# ⚠️ 本檔於 2026-09-27 隨規則的證據模型改寫(舊版以 counter 增量為輸入;新版的第 1/2/3/5 條
#    讀 last_run_* 輸出族)。case 的**意圖**與舊版對應關係:
#      舊 A(生產形狀)/新 D、M/E 覆蓋報價不可用
#      舊 B(健康)/新 A(負向對照 1)
#      舊 C(修好標籤)/新 B、C(per-stage;舊缺口 (e) 的遮蔽已不可能)
#      舊 D(完全沒活動)/新 H(剛重啟、還沒跑過;負向對照 2)
#      舊 E(ranked family 消失)/新 gaps 檔的 P/Q
#      舊 G(休市衰減)/**已移除**:新版不再用視窗算術判斷「有沒有跑」,那個維度改由
#        gaps 檔的 J/K/L(heartbeat)覆蓋
#      舊 H/I/J(weekly 別名/加總順序)/**已移除**:per-stage 的 verdict 讓那些別名問題消失
#
# expectation 是**完整比對**(labels + annotations 逐字)。因此:
#   ⚠️ 改規則檔的 expr/文案/labels 時,本檔必須在同一個 commit 同步(逐字)——
#      本檔的 expectation 區塊是從規則檔產生的,落後就會紅在「文字差異」而不是語意差異。
#   ⚠️ 每個 case 都對**全部 11 條**規則下斷言(不只是一條),所以「意外 firing」也會被抓到。
#     2026-09-27 起第 10 條(產物 snapshot)與第 11 條(產物 registry)也在每個 case 的斷言清單裡;
#     兩個產物訊號的 series 在 fixture 中一律成對出現(見該檔的註解),除非那個 case 刻意讓它們分歧。
#
# 時間基準:promtool 的測試時間從 **Unix epoch 開始**(`time()` 在 eval_time=5m 時等於 300),
# 所以 last_run_finished_timestamp_seconds 的測試值是 0(= 測試時間軸的原點),它與 `time()`
# 的距離才是被測的語意(第 9 條的 6 天新鮮度)。
#
# 執行方式(CI: quality.yml 的 monitoring-config job;本機同指令可跑):
#   promtool test rules monitoring/tests/*.yml
# 版本必須與生產一致: prom/prometheus:v3.14.0(見 quality.yml 的釘版註解)。

rule_files:
  - ../rules/atlas_universe_scoring_alerts.yml

evaluation_interval: 1m

tests:
  - name: "A 健康(兩個 stage 都跑過且 ranked>0,計數器與 verdict 一致、兩個產物都落地):11 條都不得 firing(負向對照 1)"
    # daily 與 weekly 都有可信 verdict(ranked=150、quotes_returned=1581),counter 也有增量。
    # 這是 09-29 之後的預期生產狀態:第 1/2/3/5/7/9 條都必須沉默。
    # 第 10/11 條的負向對照 1:這個 case 的 snapshot_persisted 與 registry_persisted 都是 1
    # (series 都存在,不是缺席)⇒ 兩條產物規則都必須沉默。
    # counter 面刻意與 verdict 一致(舊規則的輸入也在),這樣同一組假資料才能前後對照。
    interval: 1m
    input_series:
