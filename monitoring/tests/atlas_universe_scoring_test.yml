                 看 input=.. ranked=..。（scoring_ok 只是 INFO、沒有門檻,要看數字）
              2. Quotes provider 是否被接上:grep -n "Quotes:" cmd/atlas/bootstrap_helpers.go
                 wiring 若是 nil(bootstrap_helpers.go:217)就是這個症狀的根因（#1979 已修,確認部署版本是否含它）。
              3. 交叉證據:curl -s localhost:18080/metrics | grep -c universe_quotes_fetched_total
                 回 0(series 根本不存在)⇒ Step 3 的 quotes 分支從未執行(走的是 else)。
              4. 若部署已含 #1979:直接看快照 data/state/universe_snapshot.json 的
                 result.quotes_status / result.ranked_trustworthy / result.ranked_fallback_reason
                 —— 這三個欄位就是為本案加的機器可讀判定。
