                (b) **provider 有接但回空或回錯**:series 存在但值為 0,且通常伴隨
                    `quotes_fetch_error` WARN 與 `atlas_universe_quotes_errors_total{daily="fetch_error"}`。

              先查什麼(依序):
              1. 有沒有 fetch error:docker logs atlas-go --since 48h 2>&1 | grep -E "quotes_fetch|quotes_provider"
              2. 指標在不在:curl -s localhost:18080/metrics | grep -E "universe_quotes_(fetched|errors)"
                 完全沒有輸出 ⇒ 走的是 (a),去看 wiring:
