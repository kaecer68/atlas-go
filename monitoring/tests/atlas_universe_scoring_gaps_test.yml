        values: '0x2900'
      - series: 'atlas_universe_last_run_symbols_filtered{stage="weekly"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_screened_passed{stage="weekly"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_screened_failed{stage="weekly"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_symbols_ranked{stage="weekly"}'
