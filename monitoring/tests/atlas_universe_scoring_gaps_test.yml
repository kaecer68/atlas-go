          這代表什麼:
          - ranked 是 sector allocation / stockpicker 等下游的母體來源;ranked 空 = 母體空。
            生產目前沒有任何 ranked 消費者,所以下游不會壞 —— **只有外部監看抓得到**。
          - 歷史根因(2026-06-22 起,連續 3 個月;**已由 #1979 修復並於 2026-09-25 部署**):UniverseBuilderDeps.Quotes 是常數 nil
            ⇒ BuildUniverse Step 3 走 else 分支(空 quoteMap)⇒ 每個 symbol 在
            「quotes 查不到就 continue」短路 ⇒ survivors=0 → passed=0 → ranked=0。
          - 與 #1971 gate 的觀察窗不變量 `symbols_ranked > 0` 直接相關:本條 firing 就是
            那個不變量被違反。rollback 政策寫在 configs/parameters.json 的 todo(業主裁決)。
          - 遮蔽注意(歷史缺口 (e),**已由 #1989 於 2026-09-25 修復**):修復前 ranked series
            因標籤配對缺陷而沒有標籤 ⇒ 兩個 stage 共用同一個 counter,weekly 只要成功產出過
            ranked 就會遮蔽「daily 評分死亡」最多 6 天。修復後 `symbols_ranked_total` 帶
            `stage` 標籤;但過渡期(≤ 6 天 = 本檔的視窗長度)Prometheus 仍同時保有舊的
            **無標籤** series ⇒ 那段期間聚合值仍可能被 weekly 遮蔽,判讀時要看 `stage`。
            三條一起看:只有本條沉默而第 2/3 條 firing 時,優先懷疑報價(quotes)階段。

          先查什麼(依序):
          1. 評分階段日誌:docker logs atlas-go --since 48h 2>&1 | grep -E "scoring_ok|daily_refresh_ok|weekly_rebuild_ok"
             看 input=.. ranked=..。（scoring_ok 只是 INFO、沒有門檻,要看數字）
          2. Quotes provider 是否被接上:grep -n "Quotes:" cmd/atlas/bootstrap_helpers.go
             正確值是 `Quotes: quotes`;若又變回 nil(歷史上的 bootstrap_helpers.go:217)
             就是回歸 —— 2026-06-22~09-25 的實例就是這個形狀。
          3. 交叉證據(⚠️ 2026-09-26 起語意已變,見檔頭「部署後的預期行為」):
             curl -s localhost:18080/metrics | grep '^atlas_universe_quotes_fetched_total'
             · 有 series 但 increment 為 0 ⇒ Step 3 的 quotes 分支沒貢獻任何報價
               (可能是走 else(provider 沒接上),也可能是接了但回空 —— 看第 3 條)。
             · **沒有 series** ⇒ 這是「指標族缺失」,不是 Step 3 的判定:
               修復前 series 只在第一次增量才建立(重啟後會整族消失),
               修復後由 `UniverseMetrics.WarmUp()` 在啟動時就建立 ⇒ 缺席即指向
               第 6 條(改名/移除或服務沒在跑),不要拿它推論 quotes 分支。
          4. 若部署已含 #1979:直接看快照 data/state/universe_snapshot.json 的
             result.quotes_status / result.ranked_trustworthy / result.ranked_fallback_reason
             —— 這三個欄位就是為本案加的機器可讀判定。
          5. ⚠️ 不要用 counter 絕對值當門檻(累積 counter 沒有上界 ⇒ 固定數字會隨天數失效)。
             歷史上的灌爆缺陷(x·N(N+1)/2;實測只跑 2 輪顯示 4797)已由 #1989 於 2026-09-25
             修復,但禁令不變。本規則只看 increase() 是否為 0,與這件事無關。
          6. 若本指標 family 整體消失(被改名/移除),本條**不會** firing —— 判定側沒有
             `or vector(0)`,沒有資料就不宣稱「量測到 0」(#1995)。缺席由第 6 條
             `AtlasUniverseMetricsFamilyMissing` 負責,照那一條的 triage 查指標名字,不要查 pipeline。
        runbook_url: https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md
  - eval_time: 60m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseMetricsFamilyMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        service: atlas
        component: universe-monitoring
        wave: '9.2'
        incident_ref: universe-scoring-gap-20260925
        alertname: AtlasUniverseMetricsFamilyMissing
      exp_annotations:
        summary: universe 評分輸入指標族缺失:ranked / quotes_fetched series 不存在(服務仍在跑)
        description: |
          `atlas_universe_symbols_ranked_total` 或 `atlas_universe_quotes_fetched_total`
          在過去 30 分鐘內**完全不存在**(不是值為 0),而同一個 job 的
          `up{job="atlas-go"}` 仍為 1 ⇒ atlas-go 還活著、/metrics 還回得出東西,
          但本檔第 1/2/3 條的判定輸入不見了。

          這代表什麼 —— 這是「零偵測」的另一種形狀,而且**與 pipeline 是否空轉無關**:
          - 第 1/2/3 條的判定側現在沒有 `or vector(0)`(見檔頭「部署後的預期行為」),
            沒有資料時它們沉默 ⇒ 這個缺席由本條單獨負責,不會出現兩份互相矛盾的 triage。
          - 修復前(#1995)這個狀態**每一次容器重啟後都會出現**,因為 series 是「第一次增量」
            才建立的,而 pipeline 一天只跑一次(06:00Z)。當時的規則是靠 `or vector(0)` 把它
            誤判成「ranked=0 / 篩選全滅 / 報價缺失」,把值班的人送去查沒有問題的 pipeline。
            修復後 `UniverseMetrics.WarmUp()` 在啟動時就把整族以 0 建立 ⇒ 缺席只剩下面三個原因。

          先查什麼(依序):
          1. 指標是不是換了名字:
             curl -s localhost:18080/metrics | grep -E '^atlas_universe_' | sort
           跟五個核心名字對一下:
             atlas_universe_symbols_gathered_total / symbols_filtered_total /
             symbols_screened_total / symbols_ranked_total / quotes_fetched_total
           有同義的新名字 ⇒ 把 `monitoring/rules/` 與 `monitoring/tests/` **所有**引用舊名的
           地方一起改(只改一條會讓規則之間互相矛盾),並同步更新本檔的 triage 文案。
          2. 服務是不是其實沒在跑(閘門的邊界):
             本條 firing 時 `up{job="atlas-go"}` 必須是 1。若它同時是 0,那是 scrape 的問題,
             先看 AtlasGoTargetDown,不要查母體 pipeline。
          3. `WarmUp()` 是否還在接線上(回歸檢查):
             grep -rn "WarmUp()" cmd/atlas/main.go internal/monitoring/metrics/universe.go
           正確位置:`cmd/atlas/main.go` 緊接在 `um.SetOnInc(...)` 之後呼叫 `um.WarmUp()`。
           少了它,本條會在**每一次部署後**誤報(直到下一次 pipeline 執行)。
          4. 程式碼是否仍會寫這兩個名字:
             grep -rn "symbols_ranked_total\|quotes_fetched_total" internal/monitoring/
           (正確位置:`internal/monitoring/metrics/universe.go` 的 name 欄位 +
            `internal/monitoring/universe_scheduler.go` 的 `rankedCounter.Add` 與
            `quotesFetchedCounter.Add`)。
          5. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界;歷史上的灌爆缺陷已由
            #1989 於 2026-09-25 修復,見檔頭 (1))。本條與數值無關,只看 series 在不在。
        runbook_url: https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md

- name: "整族缺席且服務沒在跑(up==0)—— 第 6 條必須沉默(這是 up 閘門的牙齒:把閘門拿掉,這一格會紅燈)"
  interval: 1m
