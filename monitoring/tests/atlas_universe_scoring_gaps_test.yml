# monitoring/tests/atlas_universe_scoring_gaps_test.yml
#
# promtool unit tests（`promtool test rules`）for the rules added by 任務 O（2026-09-25）and
# 任務 P / issue #1995（2026-09-26）in monitoring/rules/atlas_universe_scoring_alerts.yml:
#   · 第 4 條 AtlasUniverseScreenedFamilyMissing（缺口 (c):篩選訊號 family 被改名/移除）
#   · 第 5 條 AtlasUniverseEmptyFiltered     （缺口 (d)-empty_filtered:Step 2 early-return）
#   · 第 6 條 AtlasUniverseMetricsFamilyMissing（#1995:ranked / quotes_fetched family 缺失,
#     以 `up{job="atlas-go"} == 1` 為閘門）
#
# 為什麼另開一個檔案（而不是把 case 塞進 atlas_universe_scoring_test.yml）:
#   那個檔案是任務 M 的「三條規則」的驗證網，expectation 是**逐字比對**；把新規則的長文案
#   塞進去會讓它膨脹一倍而看不出主題。兩個檔案讀同一份 rules 檔（rule_files 指向同一路徑），
#   CI（.github/workflows/quality.yml 的 monitoring-config job）用 `monitoring/tests/*.yml`
#   一次跑完 ⇒ 沒有「新檔沒被跑到」的風險。
#
# ⚠️ 與 M 的檔案相同的紀律：expectation 是**完整比對**（labels + annotations 逐字）。
#    改規則檔的文案時本檔必須在同一個 commit 同步更新，否則 gate 會紅在「逐字差異」。
#
# 十個 case 各自對應一個「真實可能發生」的世界：
#   K 缺口 (c)：screened family 消失，但 filtered / ranked / quotes 都還在
#       ── 第 4 條必須 firing，**舊三條與第 6 條必須全部沉默**（ranked/quotes 還在 ⇒ 不是指標缺失）
#   L 缺口 (d)-empty_filtered：screened 存在但零增量，filtered 的 dropped 桶有活動
#       ── 第 5 條必須 firing，第 4/6 條必須沉默（三條的分工），舊三條必須全部沉默
#   M #1995 修復後的真實部署狀態（**本檔的核心 regression**）：
#       `UniverseMetrics.WarmUp()` 已把整族以 0 建立、pipeline 還沒跑過
#       ── 六條規則都必須沉默。修復前這個狀態長得像 O（整族缺席），會讓三條舊規則誤報。
#   N 負向對照 1：健康形狀 ── 三條都必須不 firing
#   O #1995 的語意修正：整族缺席 **且服務在跑**（修復前每一次部署/重啟的形狀）
#       ── 第 1-5 條必須沉默（缺資料不再被算成 0），第 6 條必須以「指標缺失」的文案 firing。
#       **這是第 6 條的牙齒**：把第 1 條的判定側改回 `or vector(0)`，這一格會在 60m 紅燈。
#   P 負向對照 3：Step 1 early-return（empty_universe；整族以 0 存在、只有 coverage 有活動）
#       ── 六條都必須不 firing。**刻意留下的缺口**（需要 Go 端心跳指標才覆蓋得動）；
#          這一格的作用是把缺口寫成可執行的規格：哪天有人在規則層硬做，它會紅，
#          強迫他回去面對「這條路徑真的沒有增量訊號」。
#   Q 負向對照 4：6 天休市衰減（增量落在 [6d] 之外、family 都還在）── 第 1-6 條都必須不 firing
#       （檔頭 (2) 的「兩側同視窗」約束）
#   R ranked family 單獨缺席（quotes_fetched 還在）= 「Step 3 走 else 分支」的形狀
#       ── 第 6 條必須 firing（ranked 這個運算元），第 1 條必須沉默（沒有樣本就不宣稱 0），
#          第 2/3 條仍 firing（它們的輸入有樣本且量測為 0）。
#   S quotes_fetched 單獨缺席（ranked 還在）── 第 6 條必須 firing（quotes 這個運算元），
#       第 3 條必須沉默，第 1/2 條仍 firing。
#   T 整族缺席 **且服務沒在跑**（`up{job="atlas-go"} == 0`）── 第 6 條必須沉默。
#       **這是閘門的牙齒**：把 `up == 1` 拿掉，這一格會紅燈（否則服務掛掉時
#       第 6 條會與 AtlasGoTargetDown 重複 paging）。
#
# ⚠️ 關於「負向對照要真的有牙齒」：in-file 的 must-not-fire case（N/O/P/Q）只能在「規則過寬」
#    時紅燈；它無法證明「規則變成永不 firing」這一類變異。因此另有**變異測試**（mutation test），
#    原始輸出留在 PR 說明：
#      (m1) 第 4 條改成裸 `absent(atlas_universe_symbols_screened_total)`（拿掉 peer gate）
#           ⇒ case O 必須 FAILED（證明 O 真的在管 gate）;
#      (m2) 第 5 條左側改成只看 `{reason="industry_filter"}`（結構上永不成立）
#           ⇒ case L 必須 FAILED;
#      (m3) 第 5 條右側補回 `or vector(0)`（與第 4 條重疊）
#           ⇒ case M 必須 FAILED（證明「兩條的分工」是被釘住的）;
#      (m4) 第 1 條的判定側補回 `or vector(0)`（#1995 的原始寫法）
#           ⇒ case O 必須 FAILED（證明「缺資料 ≠ 值為 0」是被釘住的）;
#      (m5) 第 6 條拿掉 `up{job="atlas-go"} == 1` 閘門
#           ⇒ case T 必須 FAILED;
#      (m6) 第 6 條拿掉 `absent(atlas_universe_quotes_fetched_total)` 這個運算元
#           ⇒ case S 必須 FAILED。
#    （m4-m6 是本檔在任務 P / #1995 新增的三格;原始輸出見該 PR 說明。）
#
# 執行方式（CI 與本機同指令）:
#   promtool test rules monitoring/tests/*.yml
#
# 版本必須與生產一致: prom/prometheus:v3.14.0（見 quality.yml 的釘版註解）。
# 視窗說明:兩條新規則的判定不同——第 4 條是「狀態」（family 在不在，沒有視窗參數），
# 第 5 條是「6 天內有沒有增量」（`[6d]`）。case K-M 用 1m 間隔餵 2 小時:第 5 條的
# `increase([6d])` 只需要視窗內有樣本就能判定「是否為 0」;case Q 用 1h 間隔跑 200h，
# 才跑得出「增量離開 6d 視窗」的那一刻。

rule_files:
- ../rules/atlas_universe_scoring_alerts.yml
evaluation_interval: 1m
tests:
- name: K 缺口 (c):symbols_screened_total 被改名/移除(filtered/ranked/quotes 都還在)—— 第 4 條必須 firing,舊三條必須全部沉默(這正是缺口 (c))
  interval: 1m
  input_series:
  - series: atlas_universe_symbols_filtered_total{daily="industry_filter"}
    values: 0x5 1500x115
  - series: atlas_universe_symbols_filtered_total{daily="dropped"}
    values: 0x5 200x115
  - series: atlas_universe_symbols_ranked_total
    values: 0x5 100x115
  - series: atlas_universe_quotes_fetched_total
    values: 0x5 1301x115
  alert_rule_test:
  - eval_time: 25m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        service: atlas
        component: universe-monitoring
        wave: '9.2'
        incident_ref: universe-scoring-gap-20260925
        alertname: AtlasUniverseScreenedFamilyMissing
      exp_annotations:
        summary: universe 篩選訊號 family 消失:symbols_screened_total 不存在(filtered_total 仍有 series)
        description: |
          `atlas_universe_symbols_screened_total` 這個 metric family 在過去 30 分鐘內
          **完全不存在**(不是值為 0),而同族的 `atlas_universe_symbols_filtered_total`
          仍有 series ⇒ atlas-go 的 /metrics 還活著、母體組建的 Step 2 也確實執行過,
          但「篩選階段」這條訊號整個不見了。

          這代表什麼 —— 這是本檔前三條規則的**單點失能**:
          第 1/2/3 條的「活動側」全部是 `increase(atlas_universe_symbols_screened_total[...])`,
          這個 family 一消失,三條的活動側恆為 0 ⇒ **三條同時沉默**。而 up{job=...} /
          AtlasGoTargetDown / AtlasScrapeJobMissing 全部照不到(服務活著、pipeline 有跑,
          只是訊號的名字不見了)。2026-09-25 監控缺口調查把這列為缺口 (c)。

          兩個可能原因(照下面順序查,**不要**一開始就假設是改名):
          (a) **metric family 被改名或移除**(本條的主要目標):程式碼把 `symbols_screened_total`
              改名、或整段 Add 被刪掉。
          (b) **服務/遙測中斷** ⇒ 整個 `atlas_universe_*` 都不會被回報,此時同族的
              `filtered_total` 也會一起消失 ⇒ peer gate 不成立、本條**不會** firing
              (那是 AtlasGoTargetDown / 第 6 條的轄區)。
          ⚠️ 2026-09-26(#1995)起還有一個已被移除的舊可能原因:過去 `symbols_screened_total`
          是 Step 4 才第一次被 Add 的,所以「容器重啟後從未走到 Step 4」或
          「每次都停在 Step 2(`empty_filtered`)」會讓它**從未存在** ⇒ 舊版本會在這裡 firing。
          `UniverseMetrics.WarmUp()` 現在在每次啟動就把 passed/failed 兩個桶以 0 建立,
          因此那種形狀不再產生缺席;它會以「存在但零增量」出現在**第 5 條**,不是本條。

          先查什麼(依序):
          0. **確認服務在跑**:`up{job="atlas-go"}` 是否為 1(或直接
             `curl -s localhost:18080/metrics | grep -c '^atlas_'` 是否有輸出)。
             服務掛掉時本條的 peer gate 就不成立(不會 firing),若它是 firing 就代表
             /metrics 還活著 ⇒ 進入下一步。
          1. **先看 Step 2 有沒有跑過,再懷疑改名** —— 最快的一步是看快照:
             data/state/universe_snapshot.json 的 result.quotes_status
               not_attempted        ⇒ 在 Step 1/2 就 early-return;
                                      接著看 result.ranked_fallback_reason:
                                        empty_universe ⇒ 母體 0 檔(分類樹/映射面整批失效)
                                        empty_filtered ⇒ industry filter 把整個母體濾掉
                                      (#1995 之後這種形狀改由第 5 條報告,不是本條)
               provider_unavailable / fetch_error / empty / ok ⇒ 有走到 Step 3,
                                      那 screened 缺席就高度指向 (a)
             (若部署還沒含 #1979,這幾個欄位可能不存在,改用第 3 步的日誌。)
          2. family 是不是只是換了名字(只在第 1 步指向 (a) 之後才做):
             curl -s localhost:18080/metrics | grep -E '^atlas_universe_' | sort
             跟下面四個名字對一下:
               atlas_universe_symbols_gathered_total / symbols_filtered_total /
               symbols_screened_total / symbols_ranked_total
             有同義的新名字 ⇒ 把 monitoring/rules/ 裡**所有**用到舊名字的地方一起改
             (只改一條會讓規則之間互相矛盾)。
          3. 日誌(確認有沒有走到 Step 4):
             docker logs atlas-go --since 48h 2>&1 | grep -E 'symbols_gathered|industry_filter_ok|scoring_ok'
             缺 `scoring_ok` ⇒ 沒走到 Step 4(Step 1/2 early-return 或 Step 3 之後就結束)。
          4. 程式碼是否仍會 Add 這個名字:
             grep -rn "symbols_screened_total" internal/monitoring/
             (正確位置:`internal/monitoring/metrics/universe.go` 的 name 欄位 +
              `internal/monitoring/universe_scheduler.go` 的 `um.SymbolsScreened...Add`)。
          5. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界;歷史上的灌爆缺陷已由
            #1989 於 2026-09-25 修復,見檔頭 (1))。本條與數值無關,只看 family 在不在。
        runbook_url: https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseRankedZero
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreeningAllRejected
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseMetricsFamilyMissing
    exp_alerts: []
- name: L 缺口 (d)-empty_filtered:screened 存在但凍結、filtered 的 dropped 桶有活動 —— 第 5 條必須 firing,第 4 條必須沉默(分工),舊三條必須全部沉默
  interval: 1m
  input_series:
  - series: atlas_universe_symbols_filtered_total{daily="industry_filter"}
    values: '0x120'
  - series: atlas_universe_symbols_filtered_total{daily="dropped"}
    values: 0x5 1500x115
  - series: atlas_universe_symbols_screened_total{daily="passed"}
    values: '0x120'
  - series: atlas_universe_symbols_screened_total{daily="failed"}
    values: '0x120'
  alert_rule_test:
  - eval_time: 25m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts:
    - exp_labels:
        severity: warning
        service: atlas
        component: universe-screening
        wave: '9.2'
        incident_ref: universe-scoring-gap-20260925
        alertname: AtlasUniverseEmptyFiltered
      exp_annotations:
        summary: universe 篩選從未被執行:6 天內 filtered 有活動,但 symbols_screened 零增量
        description: |
          過去 6 天內 `atlas_universe_symbols_filtered_total` 有增量(母體組建確實跑過、
          Step 2 的 industry filter 確實被呼叫),但同一視窗內
          `atlas_universe_symbols_screened_total` **一次都沒有增加**
          ⇒ pipeline 每次都停在 Step 2 的 early-return,永遠沒有走到篩選/評分階段。

          這代表什麼:
          - 這是 `empty_filtered` 形狀:`IndustryFilter.Filter` 把整個母體濾成 0 檔 ⇒
            `if len(filtered) == 0 { ... return }` ⇒ Step 3/4/5 全部不會執行。
          - 對下游的後果與 `ranked=0` 相同(母體空),但**前三條規則看不到**,因為它們的
            活動側是 `increase(symbols_screened_total)`,而這個 counter 在這條路徑上
            永遠不會被 Add ⇒ 三條同時沉默。2026-09-25 監控缺口調查把這列為缺口 (d)。

          先查什麼(依序):
          1. 快照 data/state/universe_snapshot.json 的 result.ranked_fallback_reason
             = `empty_filtered` 就是本條的形狀(此時 result.quotes_status 是 `not_attempted`,
             因為 Step 3 根本沒跑)。
          2. 看 `filtered_total` 的**兩個桶**對不對:
             curl -s localhost:18080/metrics | grep '^atlas_universe_symbols_filtered_total'
             industry_filter 桶應該在 0 附近 —— 在 empty_filtered 期間它**真的是 0**
             (每次被 Add 的都是 len(filtered) = 0;#1989 之後該桶反映真值,
             所以它為 0 是事實、不是缺陷),
             dropped 桶應該 ≈ 母體大小(例:1599)。對照日誌:
             docker logs atlas-go --since 48h 2>&1 | grep -E 'symbols_gathered|industry_filter_ok'
             (`industry_filter_ok` 會印 input=1599 output=0)
          3. 為什麼每一檔都被濾掉 —— `IndustryFilter.Filter` 對**每一檔**都
             `Mapper.GetClassification()` 失敗就會走到這裡(`internal/monitoring/universe_builder.go`),
             而 Step 1 的母體可以來自別的來源(substrate 有 population 時不走 mapper)
             ⇒ 會出現「gathered 非 0 但 filtered = 0」的組合。要查的是**映射面**:
             分類樹/映射器/substrate 是否整批失效(例如 substrate 沒載入、gate 被關掉、
             或代號正規化後鍵不匹配)。查快照的 result.symbols_built 與
             `symbols_gathered_total` 是否非 0 來確認 Step 1 是好的。
          4. 確認兩個「整批濾掉」的開關沒被誤開(生產目前皆為預設關閉):
             `IndustryFilter.TargetLevel1`(空 = 關)與 `ExcludeCyclicalityLow`(預設 false);
             見 `NewIndustryFilter` 的預設值註解。若有人把它們打開而值配置錯誤,
             就會一次濾掉整個母體。
          5. 若容器重啟後**每一次**執行都停在 Step 2,本條**仍然成立**:
             #1995 之後 `UniverseMetrics.WarmUp()` 在啟動時就把 `screened` 的
             passed/failed 兩個桶以 0 建立 ⇒ 這個形狀以「存在但零增量」出現,
             正是本條要抓的 empty_filtered(第 4 條只在 `screened` 真的被移除時 firing)。
          6. ⚠️ 不要用 counter 絕對值當門檻(累積 counter 沒有上界;灌爆缺陷已由 #1989 於
             2026-09-25 修復,見檔頭 (1))。
        runbook_url: https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseRankedZero
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreeningAllRejected
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseMetricsFamilyMissing
    exp_alerts: []
- name: "#1995 修復後的真實部署狀態:WarmUp 已建立整族(全部 0)、pipeline 還沒跑過 —— 六條規則都必須沉默"
  interval: 1m
  input_series:
  - series: atlas_universe_symbols_gathered_total{stage="daily"}
    values: 0x120
  - series: atlas_universe_symbols_filtered_total{stage="daily",reason="industry_filter"}
    values: 0x120
  - series: atlas_universe_symbols_filtered_total{stage="daily",reason="dropped"}
    values: 0x120
  - series: atlas_universe_symbols_screened_total{stage="daily",result="passed"}
    values: 0x120
  - series: atlas_universe_symbols_screened_total{stage="daily",result="failed"}
    values: 0x120
  - series: atlas_universe_symbols_ranked_total{stage="daily"}
    values: 0x120
  - series: atlas_universe_quotes_fetched_total{stage="daily"}
    values: 0x120
  - series: up{job="atlas-go"}
    values: 1x120
  alert_rule_test:
  - eval_time: 25m
    alertname: AtlasUniverseRankedZero
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseScreeningAllRejected
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseMetricsFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseRankedZero
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreeningAllRejected
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseMetricsFamilyMissing
    exp_alerts: []

- name: N 負向對照 1:健康(四個 family 都有活動)—— 兩條新規則都必須不 firing
  interval: 1m
  input_series:
