# monitoring/tests/atlas_universe_scoring_gaps_test.yml
#
# promtool unit tests(`promtool test rules`)for
# monitoring/rules/atlas_universe_scoring_alerts.yml 的**排程面、記帳面與存在性**規則:
#   第 4 條 AtlasUniverseScreenedFamilyMissing
#   第 6 條 AtlasUniverseMetricsFamilyMissing
#   第 8 條 AtlasUniverseRunOverdue            (2026-09-27 新增:排程心跳,取代視窗算術)
#   第 9 條 AtlasUniverseCounterEmissionMissing(2026-09-27 新增:2026-09-25 的真實形狀)
#   第 10 條 AtlasUniverseSnapshotNotPersisted (2026-09-27 新增:跑了、有產出,但產物沒落地)
#
# 為什麼前一個檔案不夠:第 1/2/3/5/7 條只看「最近一次完成的執行」的 verdict。那個 verdict
# **不會自己過期**(週一的 weekly 會留到下一輪),所以三件事需要獨立的規則:
#   (a)「根本沒跑」                          ⇒ 第 8 條(Go 端以台灣交易日曆算出的下一次預期時刻)
#   (b)「跑了、輸出健康,但 counter 沒發射」  ⇒ 第 9 條(2026-09-25 生產的實況)
#   (c)「規則的輸入族被改名/移除」            ⇒ 第 4/6 條
#
# ⚠️ 時間基準(重要):promtool 的測試時間從 **Unix epoch** 開始(`time()` 在 eval_time=72h 時
#    等於 259200)。因此:
#      · heartbeat 的測試值刻意用「相對原點」的小數字(例 100000 = 原點後約 27.8 小時),
#        才能構造「已逾時」與「還在未來」兩種情形;生產值是 1.79e9 等級的 unix 時間戳,
#        規則只做加減比較,與絕對值無關。
#      · last_run_finished_timestamp_seconds 的測試值用 0(= 原點),讓 `time() - finished`
#        等於 eval_time,才能精確測第 9 條的 6 天新鮮度閘門。
#
# expectation 是完整比對(labels + annotations 逐字);每個 case 對全部 **10 條**規則下斷言,
# 因此「意外 firing」也會被抓到。改規則檔時本檔必須在同一個 commit 同步(逐字)。

rule_files:
  - ../rules/atlas_universe_scoring_alerts.yml

evaluation_interval: 1m

tests:
  - name: "J 排程逾時(沒跑):第 8 條 firing;24h 時尚未逾時 ⇒ 沉默"
    # heartbeat = 100000(測試時間軸原點後約 27.8h),eval 24h 時 100000+7200 > 86400 ⇒ 未逾時;
    # eval 48h 時 107200 < 172800 ⇒ 逾時 18h ⇒ 第 8 條 firing。
    # 此時 verdict 族全是 WarmUp 的值(valid=0,這個 process 沒跑過)⇒ 第 1/2/3/5/7/9 條沉默,
    # 且第 6 條也不得 firing(它的四個輸入族都在)。
    interval: 1m
    input_series:
      - series: 'atlas_universe_last_run_valid{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_snapshot_persisted{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_finished_timestamp_seconds{stage="daily"}'
