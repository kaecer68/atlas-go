  - series: atlas_universe_symbols_ranked_total
    values: 0x5 100x115
  - series: atlas_universe_quotes_fetched_total
    values: 0x5 1301x115
  alert_rule_test:
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
- name: O 負向對照 2:容器剛重啟、pipeline 還沒跑過(/metrics 還沒有任何 atlas_universe_* series)—— 兩條新規則都必須不 firing(這是 peer gate 的牙齒:拿掉 gate 第 4 條會在這裡紅燈)
  interval: 1m
  input_series:
  - series: up{job="atlas-go"}
    values: 1x120
  alert_rule_test:
  - eval_time: 25m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
- name: P 負向對照 3:Step 1 early-return(empty_universe,只有 coverage 有活動,filtered/screened 都不存在)—— 刻意留下的缺口:兩條新規則與舊三條都必須不 firing
  interval: 1m
  input_series:
  - series: atlas_universe_coverage_mapped_total{daily="all"}
    values: 0x5 27x115
  - series: atlas_universe_coverage_total{daily="all"}
    values: 0x5 27x115
  alert_rule_test:
  - eval_time: 25m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 25m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseRankedZero
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseScreeningAllRejected
    exp_alerts: []
  - eval_time: 60m
    alertname: AtlasUniverseQuotesMissing
    exp_alerts: []
- name: Q 負向對照 4:6 天休市衰減(兩側增量都落在 [6d] 視窗之外,但 family 都還在)—— 兩條新規則都必須不 firing(檔頭 (2) 的同視窗約束)
  interval: 1h
  input_series:
  - series: atlas_universe_symbols_filtered_total{daily="dropped"}
    values: 0x5 1500x198
  - series: atlas_universe_symbols_screened_total{daily="passed"}
    values: 0x5 100x198
  - series: atlas_universe_symbols_screened_total{daily="failed"}
    values: 0x5 500x198
  alert_rule_test:
  - eval_time: 200h
    alertname: AtlasUniverseScreenedFamilyMissing
    exp_alerts: []
  - eval_time: 200h
    alertname: AtlasUniverseEmptyFiltered
    exp_alerts: []
