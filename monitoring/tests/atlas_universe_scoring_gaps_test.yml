                atlas_universe_symbols_ranked_total            (記帳面:第 9 條)
                atlas_universe_quotes_fetched_total            (記帳面)
                atlas_universe_last_run_valid                  (輸出面:第 1/2/3/5/7 條)
                atlas_universe_next_run_timestamp_seconds      (心跳:第 8 條)
                atlas_universe_last_run_snapshot_persisted     (產物面:第 10 條)

              這代表什麼:
              - 這是「零偵測」的一種形狀:規則不會 firing,但**不是因為系統健康**,而是因為
                它看不到東西。缺席必須被明確報出來,不能沉默。
              - 缺席只剩三個原因:(a) 指標被改名/移除;(b) 發佈它的程式碼路徑被刪掉
                (WarmUp / ReportUniverseHeartbeat / BuildUniverse 的 defer);
                (c) 服務其實沒在跑(此時閘門不成立,本條沉默,看 AtlasGoTargetDown)。
              - ⚠️ 若剛合併 monitoring 規則、新 binary 還沒部署,本條會 firing:
                `next_run_timestamp_seconds` 還不存在。部署完成後自動 resolve。

              先查什麼(依序):
              1. 指標是不是換了名字:
                 curl -s localhost:18080/metrics | grep -E '^atlas_universe_' | sort
              2. 發佈路徑是否還在接線上(回歸檢查):
                 grep -rn WarmUp()\|SetRunVerdictSink\|ReportUniverseHeartbeat cmd/atlas/main.go
                 正確位置:SetOnInc → SetRunVerdictSink → WarmUp → ReportUniverseHeartbeat,
                 且 BuildUniverse 內有一個 defer 呼叫 ReportRun。
              3. 服務是不是其實沒在跑(閘門邊界):up{job=atlas-go} 必須是 1。
              4. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。本條只看 series 在不在。
            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"
