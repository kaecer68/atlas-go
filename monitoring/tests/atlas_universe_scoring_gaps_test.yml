      - series: 'atlas_universe_last_run_screened_failed{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_symbols_ranked{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_quotes_requested{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_quotes_returned{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_ranked_trustworthy{stage="daily"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_valid{stage="weekly"}'
        values: '0x2900'
      - series: 'atlas_universe_last_run_snapshot_persisted{stage="weekly"}'
        values: '0x2900'
