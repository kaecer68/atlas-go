            誤判成「ranked=0 / 篩選全滅 / 報價缺失」,把值班的人送去查沒有問題的 pipeline。
            修復後 `UniverseMetrics.WarmUp()` 在啟動時就把整族以 0 建立 ⇒ 缺席只剩下面三個原因。

