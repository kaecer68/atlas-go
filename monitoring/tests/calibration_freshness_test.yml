            artifact: "parameters_overlay"
          exp_annotations:
            summary: "生效參數與 image 內基準的偏離無法由校準迴圈解釋（比值超出單步窗 或 overlay 有套不上的 entry）"
            description: |
              atlas-go 執行的參數不是 `configs/parameters.json`（image 內、受版控、經人工審查
              的**基準**），而是該基準疊上校準 overlay
              （`data/state/parameters.calibrated.json`）的**生效值**。這個偏離本身是
              **intended**（業主定案:runtime 校準採「持久化 overlay ＋ 漂移偵測」）,
              所以這一條**不是**「有偏離就告警」——它只在偏離的樣子**說不通**時 firing:

              1. `atlas_calibration_drift_out_of_window_keys{artifact="parameters_overlay"} > 0`
                 ⇒ 有 key 的 `生效值 / 基準值` 比值落在單步窗 [1/3, 3] 之外。這是
                 `logOverlayApplication` 既有的 WARN 條件（`internal/config/calibration_overlay.go`
                 的 `RatioOutsideSingleStepWindow`）:這個值不是單一輪被接受的校準能解釋的。
              2. `atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="not_applicable"} > 0`
                 ⇒ overlay 裡有不存在的參數名/路徑,或值型別不可套用 ⇒ 那些「已校準」的值
                 **永遠不會生效**。loader 會在下次載入時把它們從 overlay 移除（日誌 WARN
                 `overlay_entry_unknown_parameter` / `_unknown_path` / `_non_numeric_parameter`）,
                 在那之前本條持續 firing。

              先查什麼（依序）:
              1. 目前偏離的全貌（多少 key、哪些、比值多少）:
                 docker exec atlas-go curl -s localhost:18080/metrics | grep -E "atlas_calibration_drift_(keys|out_of_window|dropped|run_ok)"
              2. 逐筆看 overlay 的宣告與基準（生產 image 沒有 jq,用 grep）:
                 docker exec atlas-go grep -o '"path": *"[^"]*"' /app/data/state/parameters.calibrated.json | sort
                 docker exec atlas-go grep -o '"method": *"[^"]*"' /app/data/state/parameters.calibrated.json | sort | uniq -c
              3. 誰寫的（方法名 + 時間）與「這是不是一次野蠻的單步」:
                 docker logs atlas-go --since 72h 2>&1 | grep -E "overlay_entry_applied|overlay_entry_outside_single_step_window"
                 同一個 key 的 ratio 若長期停在窗外,通常是**多輪累積**而不是單步暴走
                 （窗是**相對於憲章**的累積比值）⇒ 下一步是判斷目的是否正當,而不是先回滾。
