      - eval_time: 2h
        alertname: CalibrationFreshnessUnverifiable
        exp_alerts: []
      - eval_time: 2h
        alertname: CalibrationFreshnessExporterDown
        exp_alerts: []
      - eval_time: 2h
        alertname: CalibrationEffectiveDriftUnexplained
        exp_alerts: []

  - name: "D overlay 讀不到(run_ok=0)⇒ 第 2 條 firing;**第 1 條必須沉默**;第 4 條也沉默(drift 序列缺席)"
    interval: 1m
    input_series:
      - series: 'atlas_calibration_freshness_ok{artifact="parameters"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters"}'
        values: '1x300'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters"}'
        values: '7206752x300'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters"}'
        values: '1783273381x300'
      - series: 'atlas_calibration_freshness_ok{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_checked_timestamp_seconds{artifact="parameters"}'
        values: '0+60x300'
      - series: 'up{job="atlas-go"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: CalibrationArtifactStale
        exp_alerts: []
      - eval_time: 2h
        alertname: CalibrationFreshnessUnverifiable
        exp_alerts:
        - exp_labels:
            alertname: "CalibrationFreshnessUnverifiable"
            severity: "error"
            service: "atlas"
            component: "calibration-freshness"
            incident_ref: "issue-1944-i31"
            artifact: "parameters_overlay"
          exp_annotations:
            summary: "有效校準產物（overlay）的新鮮度無法判定（檢查讀不到/解不開 parameters.calibrated.json）"
            description: |
              背景任務 `calibration_freshness_metrics_export` 連續 15 分鐘無法評估
              `data/state/parameters.calibrated.json`（overlay；stat 失敗 / 讀取失敗 /
              JSON 不合法）。
              此時 freshness 是**未知**,不是「新鮮」也不是「不新鮮」——
              `atlas_calibration_freshness_ok{artifact="parameters_overlay"}` 是 0（fail-closed）,
              且 `atlas_calibration_freshness_age_seconds` /
              `atlas_calibration_last_calibrated_timestamp_seconds` 是**凍結的舊值**。

              先查什麼（依序）:
              1. 檔案在不在、權限對不對:
                 docker exec atlas-go ls -l /app/data/state/parameters.calibrated.json
              2. 日誌上有一則結構化 WARN 直接說明原因（code=OVERLAY_STAT_FAILED /
                 OVERLAY_READ_FAILED / OVERLAY_INVALID_DOCUMENT）:
                 docker logs atlas-go --since 2h 2>&1 | grep overlay_unverifiable
              3. JSON 是否不合法（通常是半寫入;寫入是 tmp→rename,所以更可能是人為編輯。
