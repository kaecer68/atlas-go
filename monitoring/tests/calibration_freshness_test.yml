              2. 「沒有 overlay」先確認寫入路由有沒有被註冊（#2013 的 writeback=overlay）:
                 docker logs atlas-go --since 24h 2>&1 | grep -E "calibration_writeback|overlay_written"
                 完全沒有這類日誌 ⇒ 校準沒有把結果持久化到 overlay（此時 risk gate 等
                 自適應值不會跨重建存活）。
              3. ⚠️ 假陽性第一順位:校準是「有變更才寫」⇒ 已收斂的系統會合法地不寫檔。
