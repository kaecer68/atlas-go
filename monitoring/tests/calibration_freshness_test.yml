              `data/state/parameters.calibrated.json`（校準 overlay,artifact=`parameters_overlay`）
              出現了 freshness finding（`atlas_calibration_freshness_ok{artifact="parameters_overlay"}` = 0）,
              三種子狀態:**超過契約**（`updated_at` 比 48h 舊）、**從未記錄校準時間**
              （`updated_at` 為零，沒有值可供判定）、或**檔案不存在**
              （`OVERLAY_ABSENT`：沒有任何 runtime 校準被持久化）。
              契約 = `monitoring.CalibrationFreshnessContract` = `config.DefaultCalibrationMaxAge`
              = production 命令的 `--max-age=48h`。檢查本身可以評估
              （`atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}` = 1）
