# monitoring/tests/calibration_freshness_test.yml
# promtool unit tests（`promtool test rules`）for monitoring/rules/calibration_freshness_alerts.yml
# （2026-09-26,#1944 I31 production 半邊;2026-09-27,#2007 的兩個 bounded 子項）。
#
# 為什麼需要（而不是只跑 `promtool check rules`）:check rules 只看 YAML/expr 語法,
# 驗不到「該 firing 的真的會 firing」「同一個根因不會有兩條規則各自 paging」
# 以及「缺席不得被讀成 0」這三件事 —— 那個檔頭的假陽性/假陰性紀律必須有可執行的規格。
#
# ⚠️ 紀律（與 monitoring/tests/ 其他檔案相同）:expectation 是**完整比對**
#    （labels + annotations 逐字）。改規則檔的文案時本檔必須在同一個 commit 同步,
#   否則 gate 會紅在「逐字差異」。下面的 exp_labels / exp_annotations 是規則檔的**逐字副本**
#   （不是從規則檔生成的）——所以它仍然咬得住「規則改了、測試沒改」。
#
# ⚠️ #2007 改版重點（讀這個才知道為什麼案例長這樣）
# -----------------------------------------------
# 第 1、2 條規則的標的從 `artifact="parameters"`（image 內基準）改成
# `artifact="parameters_overlay"`（權威的 effective 產物）。因此**每一個**案例都同時餵兩組序列:
#   · `artifact="parameters"`        —— image 內基準。在生產它是**長期不新鮮**的（83 天）:
#                                       這是**預期**狀態,任何規則都不該因此 firing(A 就是這條規格)。
#   · `artifact="parameters_overlay"`—— overlay。第 1/2 條看它。
#   · `atlas_calibration_drift_*`    —— image 基準 vs 生效值的差異。第 4 條只看其中的
#                                       **異常**計數(out_of_window / not_applicable),
#                                       不是看「有沒有 drift」。
#
# 十六個案例各自對應一個「真實可能發生」的世界:
#   A 生產實況（2026-09-27 實測形狀:基準 83 天不新鮮、overlay 新鮮、drift 6 筆全可解釋）
#                                —— 四條必須全部沉默（**本次改版的核心規格**:不再永久誤報）
#   B overlay 過期（可評估）      —— 第 1 條 firing,第 2/3/4 條沉默
#   C overlay 從未記錄校準時間（updated_at=0,沒有 age 序列）
#                                —— 第 1 條必須 firing（0 是明確哨兵,不是「沒資料」）
#   D overlay 讀不到（run_ok=0）  —— 第 2 條 firing;**第 1 條必須沉默**
#                                    （這是 `and run_ok==1` 的牙齒:拿掉它,D 會用
#                                    「產物已不新鮮」的文案誤導值班去查校準任務）
#   E 心跳停了但序列還在          —— 第 3 條 firing（`time() - ts > 1800` 這個 arm）
#   F 整族缺席 + 服務在跑         —— 第 3 條 firing（absent() 這個 arm）
#   G 整族缺席 + 服務沒在跑       —— 四條全部沉默（避免與 AtlasGoTargetDown 重複 paging）
#   H 心跳停了 25 分鐘（未達門檻）—— 第 3 條必須沉默（門檻的負向對照）
#   I overlay 過期但只持續 30 分鐘 —— 第 1 條必須沉默（for 1h 的負向對照）
#   J 無法評估但只持續 10 分鐘     —— 第 2 條必須沉默（for 15m 的負向對照）
#   K **交接窗（已知且刻意）**:第 1 條 firing 中 run_ok 翻 0 ⇒ 第 1 條立刻 resolve、
#     第 2 條要累積 15m 才 firing ⇒ 中間有一段「兩條都不 firing」。
#     這一格把取捨寫成可執行的規格:若有人想「順手」讓第 1 條在 run_ok=0 時也 firing
#     （消除空白）,D 會紅;若有人把第 2 條的 for 改得更長,K 會紅。
#   L **20 筆 drift 但全部可解釋** —— 第 4 條必須沉默。這一格是**政策**的可執行版本:
#     drift 本身是 intended（業主定案）,告警門檻不是「多少筆偏離」;若有人把第 4 條
#     改成 `atlas_calibration_drift_keys > 0`,L（以及 A）會紅。
#   M 有 1 筆比值落在單步窗外  —— 第 4 條 firing（`out_of_window_keys` arm,alert 只帶 artifact）
#   N 有 1 筆套不上的 entry      —— 第 4 條 firing（`dropped_keys{reason="not_applicable"}` arm,
#                                 alert 帶 reason ⇒ 值班一眼看出是哪一種「宣告與事實不符」）
#   O drift 無法比較（run_ok=0,數值凍結在窗外）—— 第 4 條**必須沉默**（閘門的牙齒:
#     沒有它,比較沒做完時會用舊的異常值持續 paging,而那是第 2 條的職責）
#   P 窗外偏離只持續 30 分鐘     —— 第 4 條必須沉默（for 1h 的負向對照）

rule_files:
  - ../rules/calibration_freshness_alerts.yml

evaluation_interval: 1m

tests:
  - name: "A 生產實況(2026-09-27 實測):基準 83 天不新鮮(**預期**)、overlay 新鮮、drift 6 筆全可解釋 ⇒ 四條規則全部沉默"
    interval: 1m
    input_series:
      - series: 'atlas_calibration_freshness_ok{artifact="parameters"}'
        values: '0x700'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters"}'
        values: '1x700'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters"}'
        values: '7206752x700'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters"}'
        values: '1783273381x700'
      - series: 'atlas_calibration_freshness_ok{artifact="parameters_overlay"}'
        values: '1x700'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}'
        values: '1x700'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters_overlay"}'
        values: '3900x700'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters_overlay"}'
        values: '1790479627x700'
      - series: 'atlas_calibration_drift_run_ok{artifact="parameters_overlay"}'
        values: '1x700'
      - series: 'atlas_calibration_drift_keys{artifact="parameters_overlay"}'
        values: '6x700'
      - series: 'atlas_calibration_drift_out_of_window_keys{artifact="parameters_overlay"}'
        values: '0x700'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="not_applicable"}'
        values: '0x700'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="ssot_moved"}'
        values: '0x700'
      - series: 'atlas_calibration_freshness_checked_timestamp_seconds{artifact="parameters"}'
        values: '0+60x700'
      - series: 'up{job="atlas-go"}'
        values: '1x700'
    alert_rule_test:
      - eval_time: 11h
        alertname: CalibrationArtifactStale
        exp_alerts: []
      - eval_time: 11h
        alertname: CalibrationFreshnessUnverifiable
        exp_alerts: []
      - eval_time: 11h
        alertname: CalibrationFreshnessExporterDown
        exp_alerts: []
      - eval_time: 11h
        alertname: CalibrationEffectiveDriftUnexplained
        exp_alerts: []

  - name: "B overlay 超過 48h(259200s)⇒ 第 1 條 firing(artifact=parameters_overlay);第 2/3/4 條沉默"
    interval: 1m
    input_series:
      - series: 'atlas_calibration_freshness_ok{artifact="parameters"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters"}'
        values: '1x300'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters"}'
        values: '7206752x300'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters"}'
        values: '1783273381x300'
      - series: 'atlas_calibration_freshness_ok{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}'
        values: '1x300'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters_overlay"}'
        values: '259200x300'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters_overlay"}'
        values: '1789994880x300'
      - series: 'atlas_calibration_drift_run_ok{artifact="parameters_overlay"}'
        values: '1x300'
      - series: 'atlas_calibration_drift_keys{artifact="parameters_overlay"}'
        values: '6x300'
      - series: 'atlas_calibration_drift_out_of_window_keys{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="not_applicable"}'
        values: '0x300'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="ssot_moved"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_checked_timestamp_seconds{artifact="parameters"}'
        values: '0+60x300'
      - series: 'up{job="atlas-go"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: CalibrationArtifactStale
        exp_alerts:
        - exp_labels:
            alertname: "CalibrationArtifactStale"
            severity: "warning"
            service: "atlas"
            component: "calibration-freshness"
            incident_ref: "issue-1944-i31"
            artifact: "parameters_overlay"
          exp_annotations:
            summary: "有效校準產物 parameters.calibrated.json（overlay）已不新鮮（超過 48h 契約 或 從未記錄校準時間；值仍可評估）"
            description: |
              `data/state/parameters.calibrated.json`（校準 overlay,artifact=`parameters_overlay`）
              出現了 freshness finding（`atlas_calibration_freshness_ok{artifact="parameters_overlay"}` = 0）,
              三種子狀態:**超過契約**（`updated_at` 比 48h 舊）、**從未記錄校準時間**
              （`updated_at` 為零，沒有值可供判定）、或**檔案不存在**
              （`OVERLAY_ABSENT`：沒有任何 runtime 校準被持久化）。
              契約 = `monitoring.CalibrationFreshnessContract` = `config.DefaultCalibrationMaxAge`
              = production 命令的 `--max-age=48h`。檢查本身可以評估
              （`atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}` = 1）
              ⇒ 這**不是**讀取/解析失敗;是哪一種子狀態看下面的第 1 步。

              ⚠️ 這一條**不再**監控 `configs/parameters.json`（image 內基準）:那個檔在
              #2013 之後只有重新部署才會變,它的「超過 48h」是預期狀態（永久誤報）。

              先查什麼（依序,不要跳到資料源）:
              0. 確認不是「無法評估」:run_ok 必須是 1。若它是 0,age 是凍結樣本,
                 請走 CalibrationFreshnessUnverifiable 的 triage。
              1. 三種子狀態怎麼分（生產 image 沒有 python/jq,用 grep/stat）:
                 docker exec atlas-go grep -o '"updated_at": *"[^"]*"' /app/data/state/parameters.calibrated.json | head -1
                 有值 ⇒ 是「舊」;值為 null/空 ⇒ 是「從未記錄」;檔案不存在 ⇒ 是「沒有 overlay」。
              2. 「沒有 overlay」先確認寫入路由有沒有被註冊（#2013 的 writeback=overlay）:
                 docker logs atlas-go --since 24h 2>&1 | grep -E "calibration_writeback|overlay_written"
                 完全沒有這類日誌 ⇒ 校準沒有把結果持久化到 overlay（此時 risk gate 等
                 自適應值不會跨重建存活）。
              3. ⚠️ 假陽性第一順位:校準是「有變更才寫」⇒ 已收斂的系統會合法地不寫檔。
                 docker logs atlas-go --since 72h 2>&1 | grep -E "self_calibrate|verdict"
                 連續多輪 verdict=stable / "no adjustments needed" ⇒ 產物沒有變舊的理由,
                 要查的是「校準到底有沒有在跑」而不是資料源。
              4. 檢查任務本身是否照常執行（心跳,與產物無關）:
                 docker exec atlas-go curl -s localhost:18080/metrics | grep atlas_calibration_freshness_checked_timestamp_seconds
                 落後遠大於 300s ⇒ 先看 CalibrationFreshnessExporterDown 的 triage。
              5. 真的偏離了多少（overlay 有幾筆、離憲章多遠）:
                 docker exec atlas-go curl -s localhost:18080/metrics | grep atlas_calibration_drift_
                 仍可評估時 drift 那一族是可信的;`drift_run_ok` = 0 時它是凍結值。

            runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/calibration-freshness-runbook.md"
      - eval_time: 2h
        alertname: CalibrationFreshnessUnverifiable
        exp_alerts: []
      - eval_time: 2h
        alertname: CalibrationFreshnessExporterDown
        exp_alerts: []
      - eval_time: 2h
        alertname: CalibrationEffectiveDriftUnexplained
        exp_alerts: []

  - name: "C overlay 從未記錄 updated_at(last_calibrated=0,沒有 age 序列,檔案存在)⇒ 第 1 條必須 firing(0 是明確哨兵)"
    interval: 1m
    input_series:
      - series: 'atlas_calibration_freshness_ok{artifact="parameters"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters"}'
        values: '1x300'
      - series: 'atlas_calibration_freshness_age_seconds{artifact="parameters"}'
        values: '7206752x300'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters"}'
        values: '1783273381x300'
      - series: 'atlas_calibration_freshness_ok{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}'
        values: '1x300'
      - series: 'atlas_calibration_last_calibrated_timestamp_seconds{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_drift_run_ok{artifact="parameters_overlay"}'
        values: '1x300'
      - series: 'atlas_calibration_drift_keys{artifact="parameters_overlay"}'
        values: '6x300'
      - series: 'atlas_calibration_drift_out_of_window_keys{artifact="parameters_overlay"}'
        values: '0x300'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="not_applicable"}'
        values: '0x300'
      - series: 'atlas_calibration_drift_dropped_keys{artifact="parameters_overlay",reason="ssot_moved"}'
        values: '0x300'
      - series: 'atlas_calibration_freshness_checked_timestamp_seconds{artifact="parameters"}'
        values: '0+60x300'
      - series: 'up{job="atlas-go"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: CalibrationArtifactStale
        exp_alerts:
        - exp_labels:
            alertname: "CalibrationArtifactStale"
            severity: "warning"
            service: "atlas"
            component: "calibration-freshness"
            incident_ref: "issue-1944-i31"
            artifact: "parameters_overlay"
          exp_annotations:
            summary: "有效校準產物 parameters.calibrated.json（overlay）已不新鮮（超過 48h 契約 或 從未記錄校準時間；值仍可評估）"
            description: |
              `data/state/parameters.calibrated.json`（校準 overlay,artifact=`parameters_overlay`）
              出現了 freshness finding（`atlas_calibration_freshness_ok{artifact="parameters_overlay"}` = 0）,
              三種子狀態:**超過契約**（`updated_at` 比 48h 舊）、**從未記錄校準時間**
              （`updated_at` 為零，沒有值可供判定）、或**檔案不存在**
              （`OVERLAY_ABSENT`：沒有任何 runtime 校準被持久化）。
              契約 = `monitoring.CalibrationFreshnessContract` = `config.DefaultCalibrationMaxAge`
              = production 命令的 `--max-age=48h`。檢查本身可以評估
              （`atlas_calibration_freshness_run_ok{artifact="parameters_overlay"}` = 1）
              ⇒ 這**不是**讀取/解析失敗;是哪一種子狀態看下面的第 1 步。

              ⚠️ 這一條**不再**監控 `configs/parameters.json`（image 內基準）:那個檔在
              #2013 之後只有重新部署才會變,它的「超過 48h」是預期狀態（永久誤報）。

              先查什麼（依序,不要跳到資料源）:
              0. 確認不是「無法評估」:run_ok 必須是 1。若它是 0,age 是凍結樣本,
                 請走 CalibrationFreshnessUnverifiable 的 triage。
              1. 三種子狀態怎麼分（生產 image 沒有 python/jq,用 grep/stat）:
                 docker exec atlas-go grep -o '"updated_at": *"[^"]*"' /app/data/state/parameters.calibrated.json | head -1
                 有值 ⇒ 是「舊」;值為 null/空 ⇒ 是「從未記錄」;檔案不存在 ⇒ 是「沒有 overlay」。
              2. 「沒有 overlay」先確認寫入路由有沒有被註冊（#2013 的 writeback=overlay）:
                 docker logs atlas-go --since 24h 2>&1 | grep -E "calibration_writeback|overlay_written"
                 完全沒有這類日誌 ⇒ 校準沒有把結果持久化到 overlay（此時 risk gate 等
                 自適應值不會跨重建存活）。
              3. ⚠️ 假陽性第一順位:校準是「有變更才寫」⇒ 已收斂的系統會合法地不寫檔。
                 docker logs atlas-go --since 72h 2>&1 | grep -E "self_calibrate|verdict"
                 連續多輪 verdict=stable / "no adjustments needed" ⇒ 產物沒有變舊的理由,
                 要查的是「校準到底有沒有在跑」而不是資料源。
              4. 檢查任務本身是否照常執行（心跳,與產物無關）:
                 docker exec atlas-go curl -s localhost:18080/metrics | grep atlas_calibration_freshness_checked_timestamp_seconds
                 落後遠大於 300s ⇒ 先看 CalibrationFreshnessExporterDown 的 triage。
              5. 真的偏離了多少（overlay 有幾筆、離憲章多遠）:
                 docker exec atlas-go curl -s localhost:18080/metrics | grep atlas_calibration_drift_
                 仍可評估時 drift 那一族是可信的;`drift_run_ok` = 0 時它是凍結值。

