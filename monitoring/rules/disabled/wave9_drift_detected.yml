groups:
  - name: wave9_drift_detected
    rules:
      - alert: PortfolioConcentrationDrift
        expr: portfolio_max_concentration > 0.25
        for: 5m
        labels:
          severity: warning
          service: atlas-portfolio
          wave: "9.4"
          enabled: "false"  # Wave 9.0a placeholder，預設不啟用（PD-W9-1）
        annotations:
          summary: "單一持倉集中度超過 25%"
          description: |
            Top symbol {{ $labels.top_symbol }} 集中度: {{ $value | humanizePercentage }}.
            建議檢查 portfolio rebalance 邏輯或手動介入。
          runbook_url: "https://wiki.internal/runbooks/wave9-drift-detected"

      - alert: PortfolioTurnoverDrift
        expr: portfolio_turnover_5m > 0.15
        for: 5m
        labels:
          severity: info
          service: atlas-portfolio
          wave: "9.4"
          enabled: "false"
        annotations:
          summary: "5 分鐘 portfolio 週轉率超過 15%"
          description: |
            5m turnover: {{ $value | humanizePercentage }}.
            高週轉可能為正常 rebalance 或異常交易行為。
          runbook_url: "https://wiki.internal/runbooks/wave9-drift-detected"

# Wave 9.4 實作 DriftDetector concentration drift v1（EventPositionUpdate aggregation）後啟用