groups:
  - name: wave9_factor_weight_regression
    rules:
      - alert: FactorWeightRegressionHigh
        expr: factor_weight_regression_score > 0.5
        for: 1m
        labels:
          severity: warning
          service: atlas-portfolio
          wave: "9.3"
          enabled: "false"  # Wave 9.0a placeholder，預設不啟用（PD-W9-1）
        annotations:
          summary: "因子權重回歸 score 超過閾值 0.5"
          description: |
            Factor weight regression score: {{ $value }}。
            Regime 變化後因子權重位移過大，建議檢查 factor engine 校準狀態。
          runbook_url: "https://wiki.internal/runbooks/wave9-factor-weight-regression"

# Wave 9.3 實作 FactorWeightRegression + WeightProvider DI 後啟用