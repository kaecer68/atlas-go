      # 用 `filtered` 當 gate 則與第 5 條形成**互斥分工**:
      #   · screened 不存在(gate 成立)⇒ 本條;  · screened 存在但零增量 ⇒ 第 5 條。
      # 副作用(刻意、已評估):容器重啟後若「每一次」執行都停在 Step 2,`screened` 從未存在,
      # 本條會以「family 消失」的文案 firing —— 所以下面的 triage **第 2 步就是先分辨
      # 「是不是根本沒走到篩選階段」**,不要求值班的人先假設是改名。
      #
      # ── 2026-09-26(#1995 修復後)這個副作用的形狀消失了,但 gate 保留 ───────────────
