      # 導致 screened 從未存在」兩種形狀**都不再產生缺席**,缺席只剩一個意思:
      # 服務沒在跑、或這個 metric 真的被改名/移除。gate 因此仍然有意義 ——
      # 它把「app 沒在跑 / 整族被移除」排除在外(那由第 6 條與 AtlasGoTargetDown 負責),
