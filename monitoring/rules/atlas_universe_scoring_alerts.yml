      #   `newPersistedMetricsCollector` 只在 collector == nil 時才走)。
      #   `/metrics` 由 `cmd/atlas/api_routes.go:157 PrometheusHandler(collector)` 提供,
      #   而 series 是**第一次 Add 才建立**(`CounterVec.WithLabelValues` 只建內部物件,
      #   真正讓 family 出現在 /metrics 的是 OnInc → RecordCounter)。
      # ⇒ 容器一重啟,整個 `atlas_universe_*` 命名空間會消失,直到**下一次 pipeline 執行**
      #   才回來;daily 是每個交易日 06:00Z,所以空窗可長達 24h(週五跑完才重啟 ⇒ 到下週二 = 95h;
      #   連假更久)。裸 absent() 會在每一次部署/重啟後誤報一次,是最糟的那種新規則。
      #
      # ⇒ 因此加了一個 **peer gate**:只有「母體組建的 Step 2 確實跑過(filtered_total 有 series)」
      #   才判定 screened 的缺席。重啟後兩者一起不存在 ⇒ 不 fire;只有 screened 單獨消失 ⇒ fire。
      #
