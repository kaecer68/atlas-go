# monitoring/rules/atlas_universe_scoring_alerts.yml
#
# 母體(universe)評分鏈的可觀測性:11 條規則,全部以「pipeline 的輸出」為主要訊號。
# (第 10 / 11 條於 2026-09-27 新增:兩個產物各自的落地訊號。第 1~9 條見下方歷史。)
#
# ── 這份檔案的歷史(改動前必讀)───────────────────────────────────────────────
# 建立 2026-09-25(任務 M):「母體評分失效會響」這一維在生產是零偵測 —— 生產實例
#   2026-06-22 起連續 3 個月 ranked=0 而無人得知。當初的四道防線全部沉默:
#     (1) universe_coverage_check 用 symbols_built 當分子 ⇒ 數學上不可能因 ranked=0 觸發;
#     (2) 生產 35 條規則裡 0 條引用 atlas_universe_*(實查 /api/v1/rules);
#     (3) `scoring_ok` 只有 INFO,沒有「input>0 但 ranked==0」門檻;
#     (4) ranked 清單沒有消費者 ⇒ 空的也不壞任何下游(只能靠外部監看)。
# 2026-09-25 起追加/修正的規則對應的缺口(c)-(g)在下方「已知限制」逐條列出。
#
# ── 2026-09-27:證據模型改變(本檔最重要的一次修正)─────────────────────────────
# 舊版第 1/2/3/5 條全部靠 **counter 增量** 推論(sum(increase(atlas_universe_*_total[6d]))),
# 因此無法區分三個世界:
#   (i)   管線根本沒跑(排程壞掉、長假)          —— 舊版靠 [6d] 視窗餘裕硬撐,連假更長就假 recovery
#   (ii)  跑了但產出沒有用(母體空 / 報價死 / 門檻全滅) —— 舊版會 firing,文案大致正確
#   (iii) 跑了、產出**健康**,但 counter 沒發射      —— 舊版照樣 firing,並把值班的人送去查
#                                                       沒有問題的 pipeline(2026-09-25 實況)
# 2026-09-27 的修法(Go + 規則兩邊一起,缺一不可):
#   · Go 端新增 `atlas_universe_last_run_*` 輸出族(internal/monitoring/metrics/universe_run.go):
#     由 BuildUniverse 的**單一 defer** 發佈(每一條退出路徑都經過),且走獨立 sink
#     (monitoring.GaugeSink → RecordGauge),**不共用** counter 的 wiring ⇒ counter 那條路
#     壞掉時 verdict 仍然活著。這就是世界 (iii) 的專屬偵測器(第 9 條)。
#   · Go 端新增心跳 `atlas_universe_next_run_timestamp_seconds`:以台灣交易日曆算出
#     「下一次預期執行時刻」,啟動時與每輪結束時各發佈一次 ⇒ 世界 (i) 不再需要視窗算術
#     (第 8 條),而且**結構上不可能**因長假誤報。
#   · 規則端第 1/2/3/5 條改讀輸出族;新增第 7(empty_universe)/8(heartbeat)/9(counter 斷線);
#     第 4/6 條仍是紀律規則(metric family 存在性),但角色改為「記帳面」的守門:
#     輸出面的規則不再依賴 counter 增量,所以 counter family 消失不再造成三條同時沉默。
#   ⚠️ 舊的長註解與 triage 文案大量引用「increase() 為 0」的推理,已被本版取代;
#      2026-09-25 的歷史缺陷(x·N(N+1)/2 灌爆、標籤值當標籤名、單標籤 series 被丟)
#      仍是第 9 條的設計動機,細節見 internal/monitoring/metrics_bridge.go 的檔頭。
#
# ── 判定空間是完整的(一個狀態只會有一條規則 firing)──────────────────────────
# 以 per-stage 的 last_run_* 為座標(valid == 1,即「這個 process 內完成過一輪」):
#   gathered == 0                              ⇒ 第 7 條 EmptyUniverse
#   gathered > 0, filtered == 0                ⇒ 第 5 條 EmptyFiltered
#   gathered > 0, filtered > 0, trustworthy=0  ⇒ 第 3 條 QuotesMissing
#   ... trustworthy = 1, ranked == 0            ⇒ 第 1/2 條(同一個訊號,見該條說明)
#   ... trustworthy = 1, ranked > 0, snapshot 沒落地 ⇒ 第 10 條 SnapshotNotPersisted
#   ... snapshot 落地,但 registry 沒落地         ⇒ 第 11 條 RegistryNotPersisted
#   ... trustworthy = 1, ranked > 0, 兩個產物都落地  ⇒ 健康,不 firing
#   ⚠️ 第 10 與第 11 條**互斥**:第 11 條要求 snapshot_persisted == 1 ⇒「兩個產物都失敗」
#      只由第 10 條講一次(一個根因不發兩張 page)。改動任一條的閘門時必須維持這個分割。
# 另有兩條與 verdict 平行的規則:
#   記帳面沒動(輸出說有產出、counter 6 天沒增量)⇒ 第 9 條 CounterEmissionMissing
#   預告的下一輪逾時(沒跑)                       ⇒ 第 8 條 RunOverdue
# 產物沒落地(跑了、有產出,但那張 artifact 沒更新)⇒ 第 10/11 條 —— 這兩條是**第一組**由
#   「產物本身」回答的規則:verdict 與心跳都在記憶體發佈,第 1~9 條沒有一條看得到這個形狀。
# 存在性(系列/族被改名或移除)⇒ 第 4 條(記帳面 screened)、第 6 條(本檔其餘輸入族,
#   含兩個產物訊號)。
#
# ── 共同約束(改動前必讀)──────────────────────────────────────────────────────
# (1) **不得用 counter 的絕對值當門檻**。這一族是累積 counter、沒有上界 ⇒ 任何「大於某個
#     具體數字」的門檻都會隨天數自然失效。2026-09-27 起只有第 9 條還會讀 counter,而且只讀
#     `increase()` 的零/非零。同樣地,**不得**把 verdict gauge 當成「累積量」比較具體數字:
#     它描述的是「最後一輪」,不是總和。
# (2) **verdict 不會自己過期**。last_run_* 描述的是「最近一次完成的執行」,週一跑完的 weekly
#     verdict 會留到下一輪。所以「壞的 verdict」在下一輪產出好的 verdict 之前一直成立 —— 這是
#     刻意的(修好之前持續提醒),而「有沒有在跑」由第 8 條單獨負責。
#     ⇒ 任何新規則若要用 verdict,必須自己想清楚「沒跑」要由誰講,不要讓兩條規則搶同一句話。
# (3) **per-stage**:verdict 族帶 `stage`(daily / weekly)。規則用 `sum by (stage)` 聚合掉
#     instance/job(避免舊的 host.docker.internal target 之類的殘留造成重複 alert instance)。
#     舊缺口 (e)「weekly 成功遮蔽 daily 死亡」在 per-stage 的 verdict 下結構上不可能發生。
# (4) **排程事實**(2026-09-27 實況;檔頭 (2) 的視窗算術已被第 8 條取代,但 triage 仍需要):
#     · 觸發時刻 = **14:00 Asia/Taipei = 06:00 UTC**(alignToTarget 以瞬間比較,不隨 host TZ 漂移)
#     · daily(auto_universe_refresh)週二~週五;weekly(auto_universe_full_rebuild)只有週一;
#       兩者都經 marketdata.IsTaiwanTradingDay(→ internal/taiwanholidays)跳過休市日
#       ⇒ 市場有開的日子恰好跑一輪(週一 = weekly、其餘 = daily)
#     · 因此「相鄰兩輪」的正常間隔最長可到 4~6 天(連假),這正是第 8 條用交易日曆而不是
#       固定視窗的原因。
# (5) **不要為同一個根因發兩條會各自 paging 的規則**。第 1/2 條是唯一的例外,而且是刻意
#     documented 的例外(條件今天等價;要降噪可刪第 2 條)。新增規則時請先確認它與既有規則
#     的判定空間互斥(見上方「判定空間是完整的」)。
#
# ── 已知限制(刻意不覆蓋;不要誤以為它們會響)──────────────────────────────────
#   (a) 服務完全沒在跑 ⇒ 全部沉默:那是 atlas_container_liveness_alerts.yml 的轄區
#       (up / AtlasGoTargetDown)。本檔的缺席型規則(第 4/6 條)都以活著為前提。
#   (b) heartbeat 的計算依賴交易日曆。日曆讀不到(極端情形)時 NextUniverseRun 回零值、
#       ReportNextRun 直接丟棄 ⇒ 序列缺席 ⇒ 第 8 條沉默(而非亂報)。第 6 條會接著報告缺席。
#   (c) counter 面斷線的偵測有視窗下限:若既有增量還在 [6d] 視窗內,最壞要等它離開視窗
#       第 9 條才會 firing(見該條的「已知限制」)。2026-09-25 的形狀(重啟後 counters 全 0)
#       在下一輪結束時立刻 firing。
#   (d) verdict 族只覆蓋「BuildUniverse 這一條路」。若未來有第二條母體產生路徑(CLI 以外的
#       新服務),它必須自己發佈 verdict,否則會落進 (a) 的同類盲區。

groups:
  - name: atlas_universe_scoring
    # 視窗以「最後一輪」為語意,1 分鐘評估一次遠超過所需解析度(生產 scrape_interval=10s)。
    # 只有第 9 條還會讀 counter 視窗([6d])。
    interval: 1m
    rules:
      # ══ 1. 評分空轉:這一輪「可信但 ranked = 0」══════════════════════════════════
      # 語意:最近一次完成的執行(stage 標籤指出是哪一輪)母體非空、排名的輸入可用
      # (ranked_trustworthy = 1),但 ranked = 0 ⇒ 沒有任何 symbol 通過篩選/評分。
      # 這是**市場判定**(可信的 0),不是量測失敗。
      #
      # 為什麼不再用 increase(counter)(2026-09-27 改;issue #1995 的後續):
      # counter 增量回答的是「有沒有記帳」,不是「產出什麼」。2026-09-25 的生產實例正好相反
      # —— 管線健康、snapshot 有 ranked=150、quotes_returned=1581,而
      # symbols_ranked_total / quotes_fetched_total 從未發射 ⇒ 舊版以增量推論的規則在
      # **健康**系統上 firing。現在的證據全部來自 last_run_* 輸出族
      # (internal/monitoring/metrics/universe_run.go,由 BuildUniverse 的單一 defer 發佈)。
      #
      # 為什麼要有 trustworthy 閘門:輸入不可用(provider 沒接 / 回空 / partial / mock)時
      # ranked 也必然是 0,那是第 3 條的職責 ⇒ 同一根因只會有一條規則 firing。
      # 為什麼要有 gathered 閘門:母體空是第 7 條的職責。
      # 為什麼是 per-stage:舊缺口 (e)「weekly 成功會遮蔽 daily 死亡」在這裡結構上不可能 ——
      # 兩條 stage 各自是獨立 series、獨立 alert instance。
      - alert: AtlasUniverseRankedZero
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_ranked_trustworthy{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_gathered{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_ranked{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-scoring"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 評分空轉:最近一次完成的執行可信,但 ranked = 0"
          description: |
            <stage> 這一輪跑完了、報價輸入可用(ranked_trustworthy=1)、母體非空,
            但 ranked = 0 —— 沒有任何 symbol 通過篩選/評分。這是被可信評估過的「空母體」。

            證據(全部來自輸出,不依賴任何計數器增量):
              atlas_universe_last_run_valid{stage}              == 1  這一輪完成過
              atlas_universe_last_run_ranked_trustworthy{stage} == 1  輸入是真實報價
              atlas_universe_last_run_symbols_gathered{stage}   > 0  母體非空
              atlas_universe_last_run_symbols_ranked{stage}     == 0  產出為空
            ⚠️ 「最近一次完成的執行」可能已經是幾天前(週一跑 weekly 的 verdict 會留到週六)——
            這是刻意的:壞的 verdict 在下一輪產出好的 verdict 之前一直成立。本條不負責判斷
            「有沒有在跑」,那是第 8 條(AtlasUniverseRunOverdue)的職責。

            先查什麼(依序):
            1. verdict 全貌(一個指令看完):
               curl -s localhost:18080/metrics | grep -E '^atlas_universe_last_run_|^atlas_universe_next_run_'
               · last_run_outcome 應為 ok;不是 ok ⇒ 走的是第 3/5/7 條,不要查門檻。
            2. 門檻(「可信但 0」唯一合理的技術成因):SmartUniverse 的 VolumeFloorTWD /
               PriceMin / TopN / MaxIndustryConcentration(configs/parameters.json)。
            3. 篩選分佈:docker logs atlas --since 48h 2>&1 | grep -E 'scoring_filters|scoring_ok'
               (scoring_filters 會印 no_quote / zero_volume / below_turnover_floor /
                below_price_floor 各濾掉幾檔 —— 直接指出是哪個濾網把母體吃光)
            4. 若 last_run_outcome 是 other:這是新的 RankedFallbackReason 尚未映射,
               見 internal/monitoring/universe_run_verdict.go 的 RunOutcome()。

            與第 2 條的關係:screened passed := len(ranked)(universe_scheduler.go Step 4 的
            `SymbolsScreened{...passed}.Add(len(ranked))`)⇒ 兩條的條件今天等價、會同時
            firing/resolve。保留兩條是為了文案與未來分家(篩選與評分若拆開,兩條就會分開),
            不是兩次獨立告警;要降低噪音可以刪掉第 2 條,偵測能力不變。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 2. 篩選全滅:這一輪「可信但 passed = 0」═════════════════════════════════
      # 語意:母體與 industry filter 都非空、輸入可用,但篩選階段沒有任何 symbol 通過
      # (`passed` 桶為 0)⇒ 沒有東西可以交給配置/風控。
      #
      # ⚠️ 條件與第 1 條等價(今天 `passed := len(ranked)`,見 universe_scheduler.go Step 4)。
      # 保留的理由是文案與未來分家(篩選 vs 評分),不是兩次獨立告警;要降低噪音刪掉本條
      # 不會降低偵測能力。這件事舊版沒有寫出來(舊版兩條同樣等價,但文案讓人以為是兩個根因)。
      - alert: AtlasUniverseScreeningAllRejected
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_ranked_trustworthy{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_filtered{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_screened_passed{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-screening"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 篩選全滅:最近一次完成的執行可信,但沒有任何 symbol 通過篩選"
          description: |
            <stage> 這一輪跑完了、輸入可用,但篩選階段把所有候選都判為 failed
            (last_run_screened_passed = 0),沒有 symbol 進入下一階段。

            證據(全部來自輸出):
              atlas_universe_last_run_valid{stage}           == 1
              atlas_universe_last_run_ranked_trustworthy{stage} == 1  報價輸入可用
              atlas_universe_last_run_symbols_filtered{stage}   > 0  母體經過 industry filter 後非空
              atlas_universe_last_run_screened_passed{stage}    == 0
            ⚠️ 與第 1 條等價:`passed` 就是 `len(ranked)`(universe_scheduler.go Step 4)。
            兩條同時 firing 是同一個根因,不是兩個;要降低噪音可刪本條。

            先查什麼(依序):
            1. verdict 全貌:curl -s localhost:18080/metrics | grep '^atlas_universe_last_run_'
               · last_run_screened_failed 會告訴你被判 failed 的檔數(= filtered − passed)
            2. 篩選分佈(指出是哪個濾網把全部候選吃光):
               docker logs atlas --since 48h 2>&1 | grep scoring_filters
            3. 門檻現值:SmartUniverse 的 VolumeFloorTWD / PriceMin(configs/parameters.json)
               —— 常見是 Volume/Last 的單位語意(approxTWD = Volume × Last)或門檻被改大。
            4. last_run_quotes_returned 若為 0 或遠低於 requested ⇒ 其實是第 3 條(報價)的根因,
               照第 3 條查 provider。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 3. 報價輸入不可用(本案的決定性訊號)══════════════════════════════════════
      # 語意:母體與 industry filter 都非空,但這一輪的 ranked **不是市場判定**
      # (ranked_trustworthy = 0)⇒ ranked 的 0 或 150 都不能拿來當市場結論。
      # 涵蓋的 fallback reason(映射見 universe_run_verdict.go 的 RunOutcome()):
      #   quote_provider_unavailable / quote_fetch_error / quote_fetch_empty /
      #   quote_fetch_partial / quote_provider_mock(以上是 outcome 的 quotes_*),
      #   以及任何未來新增但尚未映射的 reason(落成 outcome=other)。
      #
      # ⚠️ 判定刻意用**布林**(ranked_trustworthy),不是 outcome 標籤:新 reason 忘了映射
      # 也會落在 other 並仍然 firing ⇒ 不會變成靜默缺口。outcome 只負責 triage。
      # ⚠️ gathered>0 且 filtered>0 是「母體空(第 7 條)/ filter 全滅(第 5 條)」的排除條件,
      # 讓三個 bucket 互斥 ⇒ 一個根因只 firing 一條。
      # ⚠️ 2026-09-27 起本條的證據是「輸出不可用」,不再是「counter 增量為 0」。舊版在
      # 2026-09-25 的健康管線上 firing(那時 provider 正常、increment 卻沒發射)。
      - alert: AtlasUniverseQuotesMissing
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_ranked_trustworthy{stage=~"daily|weekly"}) == 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_gathered{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_filtered{stage=~"daily|weekly"}) > 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-quotes"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 報價輸入不可用:最近一次完成的執行 ranked 不是市場判定"
          description: |
            <stage> 這一輪完成了,母體(gathered)與 industry filter(filtered)都非空,
            但排名輸入不可用(ranked_trustworthy = 0)⇒ ranked 的數字不是市場判定。

            證據(全部來自輸出):
              atlas_universe_last_run_valid{stage}               == 1
              atlas_universe_last_run_ranked_trustworthy{stage}  == 0
              atlas_universe_last_run_symbols_gathered{stage}     > 0
              atlas_universe_last_run_symbols_filtered{stage}     > 0
            ⚠️ 「母體空」與「filter 全滅」也被標為不可信,但它們由第 7/5 條負責
            (本條的 gathered>0 / filtered>0 閘門就是為此)⇒ 一次只會有一條 firing。

            先查什麼(依序):
            0. 原因(一個指令):
               curl -s localhost:18080/metrics | grep -E '^atlas_universe_last_run_(outcome|quotes|ranked)'
               outcome 對照:
                 quotes_unavailable ⇒ provider 沒接上或不可用。歷史回歸點(2026-06-22~09-25)是
                    wiring 的 `Quotes: nil`;正確值:
                    grep -n Quotes: cmd/atlas/bootstrap_helpers.go  → 應為 Quotes: quotes
                 quotes_fetch_error ⇒ 傳輸/額度失敗(例如 FinMind 日配額)。
                 quotes_empty       ⇒ provider 有回應但 0 筆(代號正規化 / 來源範圍問題)。
                 quotes_partial     ⇒ 至少一個 chunk 失敗;ranked 不完整,D6 過期判定不得使用。
                 quotes_mock        ⇒ 接到 mock provider;模擬報價永遠不是市場判定。
                 other              ⇒ 新的 RankedFallbackReason 未映射(見 universe_run_verdict.go)。
            1. 數字對照:last_run_quotes_requested vs last_run_quotes_returned
               (例:1599 requested / 1581 returned = 部分未取得,屬 partial 之外的正常落差:
                未取得的 18 檔須由 snapshot 的 quotes_missing_no_data / not_covered 分類)
            2. 日誌:docker logs atlas --since 48h 2>&1 | grep -E 'quotes_fetch|quotes_status|quotes_provider'
            3. snapshot:data/state/universe_snapshot.json 的 result.quotes_status /
               result.quotes_missing_* / result.ranked_trustworthy 是同一份判定的檔案版。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 4.（2026-09-25 任務 O;2026-09-27 角色更新）篩選計數器 family 消失 ═══════════
      # 語意:`atlas_universe_symbols_screened_total` 在過去 30 分鐘完全不存在(不是值為 0),
      # 而同族 `atlas_universe_symbols_filtered_total` 仍有 series ⇒ atlas-go 活著、Step 2 跑過,
      # 但這個計數器整個不見了(被改名/移除)。
      #
      # ── 2026-09-27 的角色改變(必讀)───────────────────────────────────────────
      # 第 1/2/3/5/7 條自 2026-09-27 起改讀 last_run_* **輸出族**,不再依賴任何 counter 增量 ⇒
      # 「screened 消失會讓三條同時沉默」的舊理由**已不成立**。本條現在是**記帳面**的存在性
      # 檢查:counter 被改名/移除時仍然要有人知道(否則 counter 面的規則會靜默失效)。
      # 輸出面的缺席由第 6 條(AtlasUniverseMetricsFamilyMissing)負責。
      #
      # peer gate 的理由(不變):容器重啟後整個命名空間會暫時消失(WarmUp 之前),裸 absent()
      # 會在每次部署/重啟後誤報一次。gate 用 `filtered` 把「服務/遙測中斷」排除在外 ——
      # 那種情形 filtered 也一起不見 ⇒ 本條沉默(那是 AtlasGoTargetDown 與第 6 條的轄區)。
      - alert: AtlasUniverseScreenedFamilyMissing
        expr: |
          absent(atlas_universe_symbols_screened_total)
          and on()
          count(atlas_universe_symbols_filtered_total) > 0
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-monitoring"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 記帳面訊號消失:symbols_screened_total 不存在(filtered_total 仍有 series)"
          description: |
            `atlas_universe_symbols_screened_total` 這個 family 在過去 30 分鐘完全不存在
            (不是值為 0),而 `atlas_universe_symbols_filtered_total` 仍有 series ⇒
            /metrics 還活著、母體組建的 Step 2 也執行過,但「篩選階段」這條計數器不見了。

            這代表什麼(2026-09-27 後的角色):
            - 第 1/2/3/5/7 條改讀 last_run_* 輸出族後,**不再**因為這個 family 消失而沉默
              (它們的輸入是 verdict gauges)。本條偵測的是「**記帳面**被改名/移除」——
              counter 面的規則(第 9 條)與儀表板會靜默失效,必須有人知道。
            - 缺席也可能是「服務/遙測中斷」,但那會讓 filtered 一起消失 ⇒ peer gate 不成立,
              本條不 firing(AtlasGoTargetDown / 第 6 條負責)。

            先查什麼(依序):
            0. 確認服務在跑:up{job=atlas-go} == 1,或
               curl -s localhost:18080/metrics | grep -c '^atlas_'
            1. 是不是只是換了名字:
               curl -s localhost:18080/metrics | grep -E '^atlas_universe_' | sort
               對照核心名字:gathered_total / filtered_total / screened_total / ranked_total /
               quotes_fetched_total。改名的話,把 monitoring/rules/ 與 monitoring/tests/ 所有
               引用舊名的地方一起改(只改一條會讓規則之間互相矛盾)。
            2. 程式碼是否仍會 Add 這個名字:
               grep -rn symbols_screened_total internal/monitoring/
               (正確位置:metrics/universe.go 的 name 欄位 + universe_scheduler.go Step 4 的 Add)
            3. pipeline 是否走到 Step 4(區分「沒跑」與「沒走到」):
               curl -s localhost:18080/metrics | grep '^atlas_universe_last_run_'
               · last_run_valid=1 且 last_run_outcome=ok ⇒ 走到 Step 4 了 ⇒ 高度指向改名;
               · last_run_valid=0 ⇒ 這個 process 還沒跑過 ⇒ 等下一輪(或看第 8 條)。
            4. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。本條與數值無關,只看在不在。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 5.（2026-09-25 任務 O;2026-09-27 改讀輸出）Step 2 early-return:filtered = 0 ══
      # 語意:這一輪 gathered > 0(Step 1 有母體)但 filtered == 0(industry filter 把整個母體
      # 濾掉)⇒ `if len(filtered) == 0 { markRankedUntrustworthy(empty_filtered); return }` ⇒
      # Step 3/4/5 全部不執行。counter 面因此只有 filtered_total 會動(gathered 的 Add 在
      # Step 1 之後、screened/ranked 完全不會動),舊版得靠 dropped 桶的算術才偵測得到。
      #
      # 為什麼改用 last_run_* 輸出:condition 變成 pipeline 自己說的結論(outcome=filtered_empty
      # 的可觀測形式),不再依賴「哪個 counter 動了」的推論 —— 後者正是 2026-09-25 誤報的來源。
      # 與第 7 條(EmptyUniverse)的分工:gathered==0 是第 7 條,gathered>0 && filtered==0 是本條,
      # 兩者互斥。
      - alert: AtlasUniverseEmptyFiltered
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_gathered{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_filtered{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-screening"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 母體被 industry filter 整批濾掉:這一輪 filtered = 0"
          description: |
            <stage> 這一輪 gathered > 0(Step 1 從分類樹/映射面/母體取得 symbols),
            但 industry filter 把它們全部濾掉(filtered = 0)⇒ Step 3/4/5 全部不執行,
            ranked 必然是 0 且**不是**市場判定。

            證據(全部來自輸出):
              atlas_universe_last_run_valid{stage}               == 1
              atlas_universe_last_run_symbols_gathered{stage}     > 0
              atlas_universe_last_run_symbols_filtered{stage}    == 0
            (對應的 last_run_outcome 是 filtered_empty)

            這代表什麼:
            - `IndustryFilter.Filter` 對每一檔都失敗就會走到這裡(internal/monitoring/
              universe_builder.go):映射面整批失效 ⇒ 「gathered 非 0 但 filtered = 0」的組合。
            - 下游後果與 ranked=0 相同(母體空),但成因完全不同 ⇒ 不要照第 1 條查門檻。

            先查什麼(依序):
            1. verdict:curl -s localhost:18080/metrics | grep '^atlas_universe_last_run_'
               · outcome=filtered_empty 就是本條的形狀
            2. 映射面:分類樹 / Mapper / industry substrate 是否整批失效(substrate 沒載入、
               gate 被關掉、代號正規化後鍵不匹配)。對照日誌:
               docker logs atlas --since 48h 2>&1 | grep -E 'symbols_gathered|industry_filter_ok'
               (industry_filter_ok 會印 input=1599 output=0)
            3. 兩個「整批濾掉」的開關(生產預設皆關):
               IndustryFilter.TargetLevel1(空 = 關)與 ExcludeCyclicalityLow(預設 false)。
            4. 若每一輪都停在 Step 2,本條會持續 firing —— 這是刻意的,不是「等下一輪」。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 6.（2026-09-26 任務 P;2026-09-27 擴大涵蓋）本檔所有規則的輸入族缺失 ═════════
      # 語意:本檔會讀的 metric family 有一個完全不存在(不是值為 0),而同一個 job 的
      # `up{job="atlas-go"}` 仍為 1 ⇒ 服務活著、/metrics 有回應,但規則的輸入不見了。
      #
      # 2026-09-27 擴大:第 1/2/3/5/7/8 條改讀 last_run_* 輸出族後,那個族也必須被守著
      # (否則整個輸出面的偵測會靜默失效)。因此本條現在同時涵蓋:
      #   symbols_ranked_total / quotes_fetched_total(記帳面)、
      #   last_run_valid / next_run_timestamp_seconds(輸出面與心跳)與
      #   last_run_snapshot_persisted(第 10 條的產物面)。
      #
      # why up 閘門:缺席有兩個來源 ——(i) 指標被改名/移除;(ii) 服務沒在跑(scrape 拿不到)。
      # 閘門把 (ii) 排除(那由 AtlasGoTargetDown 負責),本條只報「服務活著但訊號不見了」。
      #
      # ⚠️ 部署順序:`next_run_timestamp_seconds` 由 cmd/atlas/main.go 在啟動時發佈一次
      # (ReportUniverseHeartbeat)。若規則先上、binary 後上,本條會 firing 直到新 binary 起動 ——
      # 那是正確的訊號(規則此刻確實看不到任何 verdict),會在部署完成後自動 resolve。
      - alert: AtlasUniverseMetricsFamilyMissing
        expr: |
          (
            absent(atlas_universe_symbols_ranked_total)
            or absent(atlas_universe_quotes_fetched_total)
            or absent(atlas_universe_last_run_valid)
            or absent(atlas_universe_next_run_timestamp_seconds)
            or absent(atlas_universe_last_run_snapshot_persisted)
            or absent(atlas_universe_last_run_registry_persisted)
          )
          and on()
          (up{job="atlas-go"} == 1)
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-monitoring"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 告警的輸入族缺失:ranked/quotes counter 或 last_run verdict 不存在(服務仍在跑)"
          description: |
            本檔讀取的 metric family 至少有一個在過去 30 分鐘完全不存在(不是值為 0),
            而 `up{job=atlas-go}` 仍為 1 ⇒ atlas-go 還活著、/metrics 還回得出東西,
            但規則的輸入不見了。六個輸入是:
              atlas_universe_symbols_ranked_total            (記帳面:第 9 條)
              atlas_universe_quotes_fetched_total            (記帳面)
              atlas_universe_last_run_valid                  (輸出面:第 1/2/3/5/7 條)
              atlas_universe_next_run_timestamp_seconds      (心跳:第 8 條)
              atlas_universe_last_run_snapshot_persisted     (產物面:第 10 條)
              atlas_universe_last_run_registry_persisted     (產物面:第 11 條)
            ⚠️ 最後兩個是 2026-09-27 新增的系列(部署與規則同批,排在 09-29 驗收之後)。
            在那之前它們不存在,本條**本來就會**為它們 firing(缺席的事實優先於部署時序);
            這正是本條的用途:缺席不得沉默。

            這代表什麼:
            - 這是「零偵測」的一種形狀:規則不會 firing,但**不是因為系統健康**,而是因為
              它看不到東西。缺席必須被明確報出來,不能沉默。
            - 缺席只剩三個原因:(a) 指標被改名/移除;(b) 發佈它的程式碼路徑被刪掉
              (WarmUp / ReportUniverseHeartbeat / BuildUniverse 的 defer);
              (c) 服務其實沒在跑(此時閘門不成立,本條沉默,看 AtlasGoTargetDown)。
            - ⚠️ 若剛合併 monitoring 規則、新 binary 還沒部署,本條會 firing:
              `next_run_timestamp_seconds` 還不存在。部署完成後自動 resolve。

            先查什麼(依序):
            1. 指標是不是換了名字:
               curl -s localhost:18080/metrics | grep -E '^atlas_universe_' | sort
            2. 發佈路徑是否還在接線上(回歸檢查):
               grep -rn WarmUp()\|SetRunVerdictSink\|ReportUniverseHeartbeat cmd/atlas/main.go
               正確位置:SetOnInc → SetRunVerdictSink → WarmUp → ReportUniverseHeartbeat,
               且 BuildUniverse 內有一個 defer 呼叫 ReportRun。
            3. 服務是不是其實沒在跑(閘門邊界):up{job=atlas-go} 必須是 1。
            4. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。本條只看 series 在不在。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 7.（2026-09-27 新增）empty_universe:Step 1 就 0 檔 ════════════════════════════
      # 語意:這一輪完成了,但 Step 1 `gatherAllSymbols` 一檔都沒取到(gathered = 0)⇒
      # `if result.SymbolsBuilt == 0 { markRankedUntrustworthy(empty_universe); return }`。
      #
      # 為什麼以前沒有這條:counter 面在這條路徑上**真的沒有訊號** —— `gatheredCounter.Add()`
      # 寫在 early-return **之後**,其他 counter 也完全不會動 ⇒ 舊設計(只讀增量)結構上無法
      # 偵測(舊檔的已知缺口 (d)-empty_universe)。last_run_* 輸出族由 defer 發佈、必經每一條
      # 退出路徑 ⇒ 這個缺口在 2026-09-27 關閉。
      #
      # 與第 5 條互斥:gathered == 0 是本條;gathered > 0 && filtered == 0 是第 5 條。
      - alert: AtlasUniverseEmptyUniverse
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_gathered{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-population"
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 母體為空:這一輪 Step 1 一檔 symbol 都沒取到"
          description: |
            <stage> 這一輪完成了,但 Step 1 一檔 symbol 都沒取到(last_run_symbols_gathered = 0)
            ⇒ 整條 pipeline 立刻 early-return,ranked 必然是 0 且不是市場判定。

            證據(全部來自輸出):
              atlas_universe_last_run_valid{stage}            == 1
              atlas_universe_last_run_symbols_gathered{stage} == 0
            (對應的 last_run_outcome 是 universe_empty;ranked_trustworthy = 0)

            這代表什麼:
            - 母體來源整批失效:industry substrate 沒載入 / 分類樹空 / Mapper 沒有映射面
              (gatherAllSymbols 只在這三處取資料)。
            - 這是舊設計**結構上偵測不到**的形狀(舊規則的活動側全部依賴 counter 增量,而這條
              路徑一個 counter 都不會動),現在由 defer 發佈的 verdict 覆蓋。

            先查什麼(依序):
            1. verdict:curl -s localhost:18080/metrics | grep '^atlas_universe_last_run_'
               outcome=universe_empty、gathered=0 就是本條。
            2. 母體來源:
               docker logs atlas --since 48h 2>&1 | grep -E 'symbols_gathered|universe.*population'
               (Step 1 的 `symbols_gathered count=0` 是本條的直接日誌證據)
            3. 分類樹 / substrate / Mapper:substrate 載入失敗(age/load_error)、
               gate 被關、或代號正規化後全部不匹配。
            4. 若每一輪都如此,本條會持續 firing;這不是「等下一輪」的情形。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 8.（2026-09-27 新增）排程心跳:預告的下一次執行已經逾時 ═══════════════════════
      # 這條規則的存在理由,是把「**整條 pipeline 完全沒跑**」與「跑了但產出沒有用」分開。
      # 舊設計的分流全靠 counter 增量的 [6d] 視窗算術,代價是:(i) 偵測延遲以「天」計;
      # (ii) 長假必須靠「餘裕」硬撐(檔頭 (2) 的 flap/盲窗推導),連假更長就會假 recovery。
      #
      # 現在的做法:Go 端用**台灣交易日曆**(marketdata.IsTaiwanTradingDay →
      # internal/taiwanholidays)算出「下一次預期執行時刻」(下一個交易日 14:00 Asia/Taipei
      # = 06:00 UTC;週一是 weekly、週二~五是 daily,兩者都跳過休市日),啟動時與每輪結束時
      # 各發佈一次(`atlas_universe_next_run_timestamp_seconds`,見 universe_run_verdict.go
      # 的 NextUniverseRun / ReportUniverseHeartbeat)。
      # ⇒ 長假**不可能**造成誤報(那個時刻本身就會往後跳),而排程真的壞掉時最慢 2 小時
      #   + 30m(pending)就會 firing,不必等 6 天。
      #
      # 為什麼缺席(series 不存在)不 firing 而是沉默:服務沒在跑時 gauge 也會消失,
      # 那是 AtlasGoTargetDown 的轄區;若 heartbeat 的發佈程式碼被刪掉,由第 6 條
      # (MetricsFamilyMissing,涵蓋 next_run_timestamp_seconds)負責。
      #
      # 為什麼是 2 小時:觸發窗是 ±1 分鐘(排程任務每分鐘檢查),單輪執行時間以分鐘計
      # (2026-09-25 生產:full rebuild ≈ 2 分鐘)⇒ 2 小時留了兩個數量級的餘裕,不會因為
      # 一輪跑得比較久就誤報。
      - alert: AtlasUniverseRunOverdue
        expr: |
          atlas_universe_next_run_timestamp_seconds + 2 * 3600 < time()
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-schedule"
          wave: "9.2"
          incident_ref: "universe-schedule-heartbeat-20260927"
        annotations:
          summary: "universe 排程逾時:預告的下一次執行時間已過 2 小時仍未執行"
          description: |
            排程預告的下一次執行時刻(`atlas_universe_next_run_timestamp_seconds`,由 Go 端以
            台灣交易日曆算出)已經過去超過 2 小時,而服務仍在回報這個 gauge ⇒
            **排程任務沒有執行**,不是「執行失敗」也不是「產出為空」。

            這代表什麼(與其他條的分工):
            - 本條是「**沒跑**」的唯一偵測器:第 1/2/3/5/7 條讀的是「最近一次完成的執行」的
              verdict,那一輪可能已經是幾天前 ⇒ 它們沉默**不代表**管線在跑。長假或排程壞掉時,
              這條才是會響的那一條。
            - 逾時的可能原因:排程任務註冊被移除/改名(taskMgr.Register 的 auto_universe_refresh /
              auto_universe_full_rebuild)、closure 內 panic、容器在 06:00Z 前後不健康、
              或排程器的時鐘/時區設定。假日休市不算(交易日曆會把預告時刻往後推)。

            先查什麼(依序):
            1. heartbeat 現值與預期:
               curl -s localhost:18080/metrics | grep '^atlas_universe_next_run_'
               and time() 對照(date -u +%s)。
            2. 任務是否註冊:docker logs atlas --since 48h 2>&1 | grep -E
               'registered auto_universe|daily_refresh_start|weekly_rebuild_start|daily_skip|weekly_skip'
               · 有 daily_skip_non_trading / weekly_skip_holiday ⇒ 是休市日,預告時刻應已往後跳,
                 若本條仍 firing 就是 heartbeat 沒更新(看 main.go 的 ReportUniverseHeartbeat)。
               · 完全沒有 *_start 也沒有 *_skip ⇒ 任務沒被觸發 ⇒ 往註冊與容器健康查。
            3. 服務是否其實不健康(up{job=atlas-go}、AtlasGoTargetDown)。
            4. 排程任務清單:atlas-go 的 taskMgr 註冊處(cmd/atlas/main.go 的
               auto_universe_refresh / auto_universe_full_rebuild / universe_coverage_check)。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 9.（2026-09-27 新增）記帳面斷線:輸出健康,但 counter 沒有發射 ═══════════════
      # 這是 2026-09-25 生產實例的**真正形狀**,也是舊設計唯一無法表達的狀態:
      #   pipeline 跑過(verdict 說 ranked=150、trustworthy=1)、snapshot 健康,
      #   但 `atlas_universe_symbols_ranked_total` / `quotes_fetched_total` 從未發射
      #   (當時的 wiring 把單標籤 series 整個丟掉)→ 舊規則以「增量為 0」推論,於是在一個
      #   **完全健康**的管線上 firing,並把值班的人送去查沒有問題的 pipeline。
      #
      # 語意:這一輪的**輸出**說它產出了 ranked > 0,而且在 6 天視窗內完成過,但同一個
      # 6 天視窗內 ranked 的 counter 一次都沒有增加 ⇒ 壞掉的是**指標發射(wiring/sink)**,
      # 不是 pipeline。文案必須維持這個方向,否則又會變成 2026-09-25 的誤導。
      #
      # 為什麼四個條件都是 per-stage:一個 stage 的健康 verdict 不該替另一個 stage 背書。
      # 為什麼 freshness 用同一個 [6d]:視窗內「有完成過一輪且 ranked>0」卻「counter 沒動」
      # 才是矛盾;若最後一輪已經離開視窗,本條沉默(那時第 8 條才是對的規則)。
      # 已知限制(刻意):如果斷線發生在**既有增量還在視窗內**的時候(不是重啟後),最壞要等
      # 增量離開 [6d] 才會 firing。2026-09-25 的形狀(WarmUp 後 counters 全 0、verdict 由
      # 新 binary 發佈)在**下一輪結束時立刻** firing。
      # 已知限制(刻意,且已有更強的守門):本條的 counter 選擇器要求**正確的標籤形狀**
      # (`{stage=~"daily|weekly"}`)。若 sink 哪天又把標籤弄壞(2026-06-22~09-25 的形狀:
      # 單標籤 series 被整個丟掉、或變成 `{daily=...}`),本條會沉默(選擇器選不到那些 series)。
      # 那個形狀的守門不在規則層,而在 Go 層:
      #   internal/monitoring/universe_metrics_emission_test.go 的
      #   TestBuildUniverse_EmitsEveryCounterTheAlertsRead 跑**真的 pipeline → 真的 bridge →
      #   真的 /metrics 文字**,並斷言 ranked/quotes_fetched 帶 stage 標籤、且不得出現
      #   `{daily=...}` 這種發明出來的標籤名 ⇒ 標籤形狀回歸會在 CI 紅燈(比告警更早)。
      - alert: AtlasUniverseCounterEmissionMissing
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_ranked{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            (
              time()
              -
              sum by (stage) (atlas_universe_last_run_finished_timestamp_seconds{stage=~"daily|weekly"})
            ) < 6 * 24 * 3600
          )
          and on (stage)
          (
            sum by (stage) (increase(atlas_universe_symbols_ranked_total{stage=~"daily|weekly"}[6d])) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-monitoring"
          wave: "9.2"
          incident_ref: "universe-metrics-emission-20260927"
        annotations:
          summary: "universe 記帳面斷線:管線產出正常,但 symbols_ranked_total 6 天沒有任何增量"
          description: |
            <stage> 的最後一輪完成了,而且它自己的 verdict 說 ranked > 0(輸入可信、有產出),
            但同一個 6 天視窗內 `atlas_universe_symbols_ranked_total{stage}` **一次都沒有增加**
            ⇒ 矛盾點在**指標發射**那一側,不是 pipeline。

            證據(全部來自輸出 + 記帳面的並列比較):
              atlas_universe_last_run_valid{stage}                == 1
              atlas_universe_last_run_symbols_ranked{stage}        > 0   這一輪確實有產出
              time() - atlas_universe_last_run_finished{stage}    < 6d   而且在視窗內完成過
              increase(atlas_universe_symbols_ranked_total{stage}[6d]) == 0  counter 沒有記到
            ⚠️ 不要把它當成「評分空轉」查(那是第 1/2 條):本條 firing 時 pipeline 是健康的,
            壞的是把結果送進 /metrics 的那條路。

            這代表什麼(2026-09-25 的實例):
            - `internal/monitoring/metrics_bridge.go` 的 CollectorOnInc 之前把「標籤值當標籤名」,
              配對並丟掉單標籤 series(symbols_ranked_total / quotes_fetched_total 都是單標籤),
              ⇒ 增量全部消失;雙標籤的 screened / filtered 卻正常 ⇒ 舊規則看到「有活動、但 ranked,
              增量為 0」而誤報。
            - 修法(#1989 / #1995 / 本 PR)把橋接改成傳「標籤 name/value map + 每事件 delta」,
              並用 WarmUp 在啟動時建立整族;本條是那個缺陷的**專門偵測器**。

            先查什麼(依序):
            1. 兩個面向並列(一個指令):
               curl -s localhost:18080/metrics | grep -E '^atlas_universe_(last_run_|symbols_ranked_total)'
               · last_run_* 健康、symbols_ranked_total 恆定 ⇒ 確認記帳面斷線(本條)。
            2. 發射點是否還在:grep -rn rankedCounter.Add internal/monitoring/universe_scheduler.go
               (Step 4:rankedCounter.Add(int64(len(ranked))))
            3. 橋接是否還在接線上:grep -rn SetOnInc\|CollectorOnInc\|GaugeSink cmd/atlas/main.go
               與 internal/monitoring/metrics_bridge.go(標籤 map + 每事件 delta)。
            4. 標籤形狀回歸:curl -s localhost:18080/metrics | grep '^atlas_universe_symbols_ranked_total'
               · 應該只有 {stage=daily} 與 {stage=weekly};出現 `{daily=...}`、
                 或**沒有標籤**的 series ⇒ 標籤配對缺陷回歸。
            5. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。
            已知限制(刻意):本條的 counter 選擇器要求正確的標籤形狀。若 sink 又把標籤弄壞
            (單標籤 series 被丟掉、或變成 {daily=...}),本條會沉默;那個形狀由 Go 層的
            TestBuildUniverse_EmitsEveryCounterTheAlertsRead 守著(pipeline → bridge → /metrics
            的文字斷言),而「整個 name 消失」由第 6 條負責。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 10.（2026-09-27 新增）產物沒落地:這一輪算出市場判定,但那張 artifact 沒有更新 ═════
      # 語意:最近一次完成的執行(valid == 1)這一側說它「可信且有產出」(trustworthy == 1、
      # ranked > 0),但同一次執行留下的**產物訊號**(last_run_snapshot_persisted == 0)說
      # 「我這一輪的輸出沒有寫進 data/state/universe_snapshot.json」。
      #
      # 為什麼需要這條(2026-09-27 的缺口盤查;完整真值階層見
      # docs/operations/universe-run-truth-model.md):
      #   第 1/2 條覆蓋「跑了但 ranked == 0」、第 5/7 條覆蓋「母體/篩選空」、第 8 條覆蓋
      #   「沒跑」、第 9 條覆蓋「counter 沒發射」。**沒有任何一條覆蓋「跑了、有產出、
      #   但產物沒有落地」**:
      #     · verdict 由 BuildUniverse 的單一 defer 在**記憶體**裡發佈,與寫檔無關;
      #     · 心跳(next_run)也由同一個 defer 重新發佈 ⇒ 第 8 條不會 firing;
      #     · atlas_universe_snapshot_persisted_total 在**寫入失敗時仍然 +1**
      #       (universe_scheduler.go Step 7 的 Inc() 不在 err == nil 分支內)⇒ 連記帳面都會說謊。
      #   ⇒ 下游(D6 watchlist 的 loadPreviousRankedSymbols、universe_coverage_check、人工驗收)
      #   讀到的是一份**無聲過期**的母體,而所有訊號都說健康。這是最危險的形狀。
      #
      # Go 端的證據(internal/monitoring/universe_scheduler.go Step 7 的 SnapshotPersistedOnDisk):
      #   寫入嘗試**之後讀回檔案**(os.Stat 比對 mtime 與本輪開始時刻),所以這個 gauge 問的是
      #   「產物在不在、是不是這一輪的」,不是「write 有沒有回 nil」:
      #     · WorkDir 設錯 ⇒ 寫入成功但寫到沒有人讀的路徑 ⇒ 0;
      #     · 前一次(或 CLI / 人工)留下的舊檔 ⇒ mtime 比本輪舊 ⇒ 0;
      #     · 寫入失敗(權限/磁碟/目錄)⇒ 0。
      #   外部可稽核:同一個問題用一次 stat 就能複核(見 triage 第 1 步)。
      #
      # 為什麼早期退出不會誤報:早退路徑(母體空 / 篩選全滅 / 報價不可用)必然
      # ranked_trustworthy == 0,而本條要求 trustworthy == 1 且 ranked > 0 ⇒ 它們各自由
      # 第 7 / 5 / 3 條負責,同一個根因不會有兩條規則 firing。
      # 與第 9 條的關係:第 9 條問「記帳面有沒有斷線」,本條問「產物有沒有落地」——不同層的
      # 失敗,確實可能同時發生(那是兩個根因)。
      #
      # ⚠️ 部署時序:本條的輸入系列 atlas_universe_last_run_snapshot_persisted 由**同一個 PR**
      #    的 Go 端發佈,而該 PR 的部署**排在 2026-09-29 06:00Z 母體驗收之後**(不在驗收前
      #    改變告警行為)。若規則先上、binary 後上,序列不存在 ⇒ 本條沉默(sum by(stage) 取不到
      #    東西 ⇒ 空向量),而那個缺席由第 6 條負責回報。
      - alert: AtlasUniverseSnapshotNotPersisted
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_ranked_trustworthy{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_ranked{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_snapshot_persisted{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-persistence"
          wave: "9.2"
          incident_ref: "universe-snapshot-persistence-20260927"
        annotations:
          summary: "universe 產物沒落地:這一輪算出市場判定,但 snapshot 沒有更新"
          description: |
            <stage> 這一輪完成了(valid == 1),它自己的 verdict 說可信且有產出
            (ranked_trustworthy == 1、ranked > 0),但同一次執行留下的產物訊號
            `atlas_universe_last_run_snapshot_persisted{stage}` == 0 ⇒ **這一輪的輸出沒有寫進
            data/state/universe_snapshot.json**。

            證據(全部來自輸出;「輸出健康」與「產物落地」是兩件事,矛盾才有意義):
              atlas_universe_last_run_valid{stage}                      == 1
              atlas_universe_last_run_ranked_trustworthy{stage}          == 1
              atlas_universe_last_run_symbols_ranked{stage}              > 0
              atlas_universe_last_run_snapshot_persisted{stage}          == 0   ← 本條的判定
            ⚠️ 不要把它當成「評分空轉」查(那是第 1/2 條):本條 firing 時 pipeline 算得出來,
            壞的是「把結果寫到磁碟」那一段。也**不要**用
            atlas_universe_snapshot_persisted_total 判斷:那個 counter 在寫入失敗時仍然 +1。

            這代表什麼:
            - 讀 snapshot 的消費者(D6 watchlist 的 loadPreviousRankedSymbols、universe_coverage_check、
              人工驗收)看到的是一份**無聲過期**的母體:它不會壞、也不會報錯,只會繼續用上一次的
              排名字單。
            - 這是 2026-09-27 之前**完全沒有偵測器**的形狀:verdict 與心跳都由同一個 defer 在記憶體裡
              發佈,所以「跑了」與「產物落地」在舊訊號裡無法區分。

            先查什麼(依序):
            1. 產物本身(與本條的判定同源,一次指令):
               ls -l <repo>/data/state/universe_snapshot.json && date -u
               · mtime 比這一輪的開始時刻舊 ⇒ 確認產物沒落地;
               · 也可以直接跑 scripts/ops/verify-universe-run.sh,它的 L5(產物面)讀同一個事實。
            2. 為什麼寫不進去:docker logs atlas-go --since 48h 2>&1 | grep -E
               'snapshot_save_error|snapshot_not_persisted|universe_registry_write_error'
               · WorkDir 指到沒有人讀的路徑、目錄權限、磁碟滿、或 data 掛載掉了。
               · grep 出來的 universe_registry_write_error 屬於**第二個產物**,由第 11 條負責:
                 若本條與 universe_registry_not_persisted 同時出現,那是兩個寫入路徑的問題,
                 先修 snapshot 這一側(它是下游唯一讀的東西)。
            3. 掛載與路徑:docker inspect atlas-go 的 Mounts 欄位
               · 期望 <repo>/data ↔ /app/data;WorkDir 必須是容器內的 /app。
            4. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-run-truth-model.md"

      # ══ 11.（2026-09-27 新增）registry 沒落地:snapshot 更新了,但 universe.json 沒有 ═════
      # 語意:最近一次完成的執行(valid == 1)這一側說它「可信且有產出」(trustworthy == 1、
      # ranked > 0),而且**主產物落地了**(last_run_snapshot_persisted == 1),但同一次執行留下的
      # **第二個產物**訊號(last_run_registry_persisted == 0)說「data/state/universe.json 不是這一輪的」。
      #
      # 為什麼需要這條(2026-09-27 的缺口盤查;完整真值階層見
      # docs/operations/universe-run-truth-model.md):
      #   Step 7 寫**兩個**檔案 —— universe_snapshot.json(第 10 條守的)與 universe.json
      #   (agents.json 相容的 registry)。後者寫入失敗在 2026-09-27 之前**只有一行 WARN**
      #   (universe_registry_write_error),沒有任何規則會響 ⇒ 症狀是「registry 舊、snapshot 新」:
      #   同一次執行的兩種消費者(讀 snapshot 的 D6 / 覆蓋率檢查 / 人工驗收 vs 讀 registry 的
      #   agents.json 相容視圖)看到**不同的母體**,而所有訊號都說健康。
      #
      # 與第 10 條**互斥**(本條要求 snapshot_persisted == 1):
      #   · 兩個產物都沒落地 ⇒ 只有第 10 條 firing(一個根因不發兩張 page);
      #   · snapshot 落地、registry 沒落地 ⇒ 只有本條 firing;
      #   · 兩者都落地 ⇒ 兩條都沉默。
      #   ⚠️ 這是刻意用 `== 1` 而不是 `!= 0` 的原因:後者會讓「都失敗」同時點亮兩條規則,
      #   值班的人會以為有兩個根因。
      #
      # 為什麼早期退出不會誤報:與第 10 條同一組閘門(valid / trustworthy / ranked > 0)——
      # 早退路徑(母體空 / 篩選全滅 / 報價不可用)各自由第 7 / 5 / 3 條負責,
      # ranked == 0 由第 1/2 條負責。
      #
      # Go 端的證據(internal/monitoring/universe_scheduler.go Step 7 的 RegistryPersistedOnDisk):
      #   與 snapshot 同一個判準(共用 artifactPersistedOnDisk:os.Stat 比對 mtime 與本輪開始時刻),
      #   只是指到不同的檔案 ⇒ 兩個 gauge 的差異只可能來自檔案系統或寫入端,
      #   不可能來自「兩套新鮮度定義」。暖機值是 0(process 啟動時本 process 還沒寫過任何檔)。
      #
      # ⚠️ 部署時序:與第 10 條同一個 PR、同一批部署,且**排在 2026-09-29 06:00Z 母體驗收之後**。
      #    若規則先上、binary 後上,序列不存在 ⇒ 本條沉默(sum by(stage) 取不到東西),
      #    而那個缺席由第 6 條負責回報。
      - alert: AtlasUniverseRegistryNotPersisted
        expr: |
          (
            sum by (stage) (atlas_universe_last_run_valid{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_ranked_trustworthy{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_symbols_ranked{stage=~"daily|weekly"}) > 0
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_snapshot_persisted{stage=~"daily|weekly"}) == 1
          )
          and on (stage)
          (
            sum by (stage) (atlas_universe_last_run_registry_persisted{stage=~"daily|weekly"}) == 0
          )
        for: 30m
        labels:
          severity: "warning"
          service: "atlas"
          component: "universe-persistence"
          wave: "9.2"
          incident_ref: "universe-registry-persistence-20260927"
        annotations:
          summary: "universe registry 沒落地:snapshot 更新了,但 universe.json 沒有(兩個消費者看到不同的母體)"
          description: |
            <stage> 這一輪完成了(valid == 1),它的 verdict 說可信且有產出
            (ranked_trustworthy == 1、ranked > 0),**主產物落地了**
            (`atlas_universe_last_run_snapshot_persisted{stage}` == 1),
            但同一次執行留下的第二個產物訊號
            `atlas_universe_last_run_registry_persisted{stage}` == 0 ⇒
            **data/state/universe.json 不是這一輪的**。

            證據(全部來自輸出;兩個產物是兩個獨立的檔案、兩個獨立的判斷):
              atlas_universe_last_run_valid{stage}                        == 1
              atlas_universe_last_run_ranked_trustworthy{stage}            == 1
              atlas_universe_last_run_symbols_ranked{stage}                > 0
              atlas_universe_last_run_snapshot_persisted{stage}            == 1   主產物在
              atlas_universe_last_run_registry_persisted{stage}            == 0   ← 本條的判定
            ⚠️ 不要把它當成「產物沒落地」查(那是第 10 條):本條 firing 時 snapshot 是好的,
            壞的是**同一步的第二個寫入**。兩條規則互斥,不會同時 firing。

            這代表什麼:
            - 讀 snapshot 的消費者(D6 watchlist、universe_coverage_check、人工驗收)看到的是
              **這一輪**;而讀 registry(agents.json 相容視圖)的消費者看到的是**上一輪**。
              兩者都不會報錯 —— 這正是「兩個母體」的危險處:沒有任何一方會發現自己看的是舊的。
            - 2026-09-27 之前這個狀態的唯一痕跡是一行 WARN(universe_registry_write_error),
              而警告等級的日誌沒有消費者 ⇒ 它是「零偵測」。

            先查什麼(依序):
            1. 兩個產物的 mtime 並列(與本條同源,一次指令):
               ls -l <repo>/data/state/universe_snapshot.json <repo>/data/state/universe.json && date -u
               · snapshot 新、registry 舊 ⇒ 確認本條;也可以跑 scripts/ops/verify-universe-run.sh,
                 它的 L5 會把 registry 的 mtime 與新訊號一起印出來。
            2. 為什麼寫不進去:docker logs atlas-go --since 48h 2>&1 |
               grep -E 'universe_registry_(write_error|not_persisted)'
               · 目錄權限、磁碟滿、data 掛載掉了、或 WorkDir 指到沒有人讀的路徑。
               · 注意 registry 走 .tmp → .bak → rename 的原子寫入;失敗時 .bak 會被還原,
                 所以檔案會**存在但舊**(而不是消失)。
            3. 掛載與路徑:docker inspect atlas-go 的 Mounts 欄位
               · 期望 <repo>/data ↔ /app/data;兩個產物必須在同一個掛載裡。
            4. ⚠️ 不要用 counter 絕對值判斷(累積 counter 沒有上界)。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-run-truth-model.md"
