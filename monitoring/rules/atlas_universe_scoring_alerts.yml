      #   `cmd/atlas/main.go:452` 的 `collector = rt.MetricsCollector`,
      #   而 `internal/bootstrap/bootstrapper.go:33 InitMetrics()` 回的是
      #   `monitoring.NewMetricsCollector()` → `NewMetricsCollectorWithPath("")` ⇒ **in-memory**,
