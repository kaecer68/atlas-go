#
# ── 三個共同的設計約束(改動前必讀)─────────────────────────────────────────────
#
# (1) **不得用 counter 的絕對值當門檻**。理由是**語意**的,不是因為某個歷史 bug:
#     這一族是累積 counter,值沒有上界 ⇒ 任何「大於某個具體數字」的門檻都會**隨天數
#     自然失效**(今天的正常值三個月後必然超標)。
#     歷史缺陷(2026-06-22~09-25,**已由 #1989 於 2026-09-25 修復**):
#     `internal/monitoring/metrics/degraded.go` 的 `Counter.Inc/Add` 回呼當時傳的是
#     **累積值** `c.Value()`,而 `internal/monitoring/metrics.go` 的 `RecordCounter` 是
#     **累加**語意(`existing.Value += value`)⇒ 第 N 輪之後的輸出 = `x·N(N+1)/2`,不是 `x·N`。
#     #1989 起回呼改傳**每事件 delta**(`Inc`→1、`Add(n)`→n,見 `metrics_bridge.go` 的
#     `CollectorOnInc`)⇒ 現在的值 = `x·N`。
#     當時的實測(只跑 2 輪):`symbols_screened_total{daily="failed"}` = 1599+3198 = 4797、
#     `coverage_mapped_total{daily="all"}` = 27+54 = 81、`snapshot_persisted_total` = 1+2 = 3
#     —— 這些數字保留為「歷史上真的發生過」的證據,不是現況。
#     本檔所有規則都用 `increase(...)`,而且只用兩種形式:
#       - `increase(...) > 0` / `== 0`:對單調非負序列而言 ⇔「這段期間有沒有 increment」。
#         這個形式對「灌爆」與「正確 delta」兩種語意**都**成立(灌爆只會放大非零值,
#         不會把非零變成零),所以 #1989 前後都不需要改寫任何 expr。
#       - 沒有任何一條規則用「counter 的當下值」做判斷(第 3 條原本用 `sum(counter) > 0`
#         當「本 process 期間跑過」的存在性判定,已被獨立驗證找出假警報而移除,見下
#         「2026-09-25 獨立驗證修正」)。
#     **禁止**把這裡改寫成「大於某個具體數字」的門檻,也**禁止**把 `increase()` 拿掉改看當下值。
#     ⚠️ #1989 **沒有**讓「絕對值門檻」變成可行:值不再被灌爆,但它仍是**無上界**的累積量,
#        「今天的 1500」放到三個月後一樣是無意義的門檻。
#
# (2) **視窗一律 `[6d]`,且同一條規則的兩側用同一個視窗**。
#     生產排程事實(改動前必讀):
#       - `auto_universe_refresh`(daily,**顯式跳過週一**)
#         每個交易日 06:00 UTC(= 14:00 台北)±1 分觸發 ⇒ 週二~週五。
#       - `auto_universe_full_rebuild`(weekly)只檢查「是不是週一」+ 同一個觸發時刻,
#         **不檢查假日** ⇒ 週一(含休市的週一)會跑。
#       - 兩者共用同一個 pipeline,差別是 `stage` 標籤:`"daily"` / `"weekly"`。
#       - **觸發時刻 = 06:00 UTC = 14:00 台北,且不再隨環境 TZ 漂移**:`alignToTarget`
#         自 #1989 起把目標明確寫成 `14:00 Asia/Taipei` 並以**瞬間**比較
#         (`universeLocation()`),`cmd/atlas` 的註解也同步改成「14:00 TW = 06:00 UTC」。
#         在此之前它用 `now.Location()` 組 06:00 ⇒ 真實時刻跟著 host/container TZ 跑
#         (生產不設 TZ,所以**實務上一直是** 06:00 UTC),而註解卻寫「06:00 TW」。
#         那個註解與行為的矛盾已消除;compose 仍刻意不設 `TZ`(觸發已與它無關)。
#         (本檔的視窗推導本來就是根據「06:00 UTC」這個事實,不受影響。)
#     由上面的事實可得最壞「正常空窗」:
#       - 週五 06:00 → 週一 06:00 = 72h(週一到週五的 daily + 週一的 weekly 都有跑);
#       - 週一休市 ⇒ 週五 → 週二 = 96h;週一+週二連假 ⇒ 週五 → 週三 = 120h。
#     ⇒ `[4d]`(96h)對「週一+週二連假」是**零餘裕**,活動側會先歸零 → 規則先 resolve 再
#       重新 firing(每週/連假固定的假 recovery 通知);`[6d]`(144h)留 24h 餘裕。
#     兩側同視窗是刻意的:兩側的證據必須一起衰減,否則會出現「活動側還沒過期、產出側已過期」
#     的假陽性(2026-09-25 獨立驗證的 F-1:第 3 條原本左側用當下值、右側用視窗,在 >4 天
#     休市期間對**健康**pipeline 誤報 71 小時,且診斷文案是錯的)。
#     已知缺口(需要假日曆或新指標,屬另一張票):見文末清單。門檻的精確說法是
#     **相鄰兩次執行間隔 > 144h(6 天)**:等於 144h 時餘裕為零(會 flap 約 45 分鐘,
#     Alertmanager 會先發 resolve),大於 144h 時盲窗 = 間隔 − 144h(7 天 ⇒ 24h 假 recovery)。
#     實務:5 天連假(週五→週三)安全、6 天(週五→週四)開始 flap、7 天(週五→下週五)24h 假 recovery。
#
# (3) **標籤別名(`daily=` / `weekly=` vs `stage=`+`result=`),且不可用 `or` 串接判斷式**。
#     歷史缺陷(2026-06-22~09-25,**已由 #1989 於 2026-09-25 修復**):`cmd/atlas/main.go`
#     的 `onInc` 回呼把 `orderedLabelValues()` 回傳的**標籤值**清單兩兩配成 name=value
#     ⇒ stage 的值(`"daily"` / `"weekly"`)變成標籤**名**,而 `symbols_ranked_total` 只有
#     一個 labelName ⇒ 配不出對而整個丟掉。當時生產觀測到的是 `{daily="failed"}` /
#     `{daily="passed"}`,而 `symbols_ranked_total` **完全沒有標籤**;來源碼語意一直是
#     `stage="daily"` + `result="passed"`。#1989 起回呼直接傳標籤的 name/value map
#     (`internal/monitoring/metrics_bridge.go` 的 `CollectorOnInc`)⇒ 生產現在曝露的是
#     `{stage="daily",result="failed"}` 與 `{stage="daily"}`(單標籤 series 不再被丟掉)。
#     ⚠️ **但別名一個都不能拿掉,也不能只留新形狀**:Prometheus 的 TSDB 在過渡期
#     (**≤ 6 天,正好等於本檔的 `[6d]` 視窗**)會**同時保有兩種標籤形狀** —— 舊形狀的
#     series 要等最後一個樣本離開視窗才消失。在那之前,只 match 新形狀會把舊 series
#     排除在判定之外(漏報),只 match 舊形狀則會在 6 天後整條規則失效(零偵測)。
#     ⇒ 第 2 條的 union 必須**同時**保留 `{result="passed"}`(新)與
#       `{daily="passed"}` / `{weekly="passed"}`(舊),最早要等「舊形狀最後樣本 + 6 天」
#       (本次部署估 ≈ 2026-10-01 之後)才可評估移除;追蹤在 FOLLOWUPS FU-20260925-11。
#     正確寫法是把兩個候選 matcher 放在**同一個 `sum()` 內的 series 級 `or`**:
#         sum(increase(X{result="passed"}[6d]) or increase(X{daily="passed"}[6d]) or ...)
#     `or` 在 series 級是「兩邊的 series 都保留(標籤集不同,不會互相取代)」⇒ 加總正確;
#     而 `sum(A{...}) or sum(B{...})` 是「**左邊非空就贏、不是 fallback**」⇒ 任一側有殘留
#     series(即使恆 0)就能單方面決定判定,造成永久假警報或永久失能(2026-09-25 獨立驗證
#     的 F-3,已修)。**維護點**:若未來新增第三種 stage(例如 `monthly`),必須把
#     `{monthly="passed"}` 加進第 2 條的 union,否則 passed 側會算成 0 而假警報。
#
