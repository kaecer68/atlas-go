#   F-4/F-5(中,漏報):列入文末缺口清單 —— ranked 的 stage 遮蔽,以及 Step 1/2 early-return。
#   F-6(低,文件事實):補上「daily 跳過週一、週一由 weekly 跑」與容器時區事實(見 (2))。
#
# ── 與本檔互補 / 不重疊 ───────────────────────────────────────────────────────
# - `atlas_container_liveness_alerts.yml`:監看「服務是否活著」(up / job 消失 / scrape 反覆失敗)。
#   本檔相反:服務活得好好的、也知道 pipeline 有跑,但**產出是空的** —— up 類指標看不到這一維。
# - `channel_health_latent_staleness.yml`:監看資料通道的新鮮度,與母體評分無關。
#
# ── 已知缺口(刻意不覆蓋;每項都已用合成序列證實會沉默)────────────────────────
#   (a) 連假 ≥ 6 天(**相鄰兩次執行間隔 > 144h**;農曆年就是這個情形)活動側歸零 ⇒ 本檔不評估
#       (需要假日曆)。(2) 段有精確的 flap/盲窗數字。)
#   (b) 「整條 pipeline 完全沒跑」而不是「跑了但空轉」,需要一條排程心跳/absent() 規則。
#   (c) `atlas_universe_symbols_screened_total` 這個 family 被整體改名/移除 ⇒ 三條都沉默
#       (活動側無法成立)。**已於 2026-09-25(任務 O)落地為第 4 條**:`absent(...)` 型的存在性
#       規則(與 AtlasScrapeJobMissing 同族),但**加了 peer gate**(理由見第 4 條的長註解:
#       容器重啟後整個 `atlas_universe_*` 命名空間會暫時消失,裸 `absent()` 會每次重啟誤報)。
#       殘餘缺口:若 `symbols_filtered_total` 也一起被改名/移除,gate 會跟著關閉,見文末 (g)。
#   (d) pipeline 在 Step 1/2 early-return ⇒ 所有 counter 存在但永不增加 ⇒ 三條都沉默。
#       兩個變體的成本不同(2026-09-25 獨立驗證以合成序列實測):
#         - **empty_filtered**(industry filter 把整個母體濾掉)⇒ **可用純規則覆蓋**:
#           `symbols_filtered_total` 的 Add 在 early-return **之前**(Step 2 先 `Add` 才
#           `if len(filtered) == 0 { return }`),而 `symbols_screened_total` 不會動 ⇒
#             (sum(increase(atlas_universe_symbols_filtered_total[6d])) or vector(0)) > 0
#             and (sum(increase(atlas_universe_symbols_screened_total[6d])) or vector(0)) == 0
#           **已於 2026-09-25(任務 O)落地為第 5 條**(`AtlasUniverseEmptyFiltered`)。
#           ⚠️ 落地版**刻意把右側的 `or vector(0)` 拿掉**(草案有):草案那個寫法會讓
#             「`screened` family 根本不存在」也滿足右側 ⇒ 與第 4 條同時 firing 且給出
#             互相矛盾的 triage。拿掉之後兩條變成互斥分工(family 不存在 vs 存在但零增量),
#             代價是「容器重啟後每一次執行都停在 Step 2」的情形改由第 4 條接手,不是漏洞。
#           注意左側之所以非零,靠的是 `filtered_total` 的 **dropped 桶**
#           (= len(allSymbols) − len(filtered) > 0):`industry_filter` 桶被 Add 的是
#           `len(filtered) = 0` ⇒ 該桶**真的是 0**(「empty_filtered」的字面意思;灌爆缺陷
#           #1989 已修,該桶現在反映真值),單看它規則會**結構上永不 firing**
#           (完整推導見第 5 條的長註解)。
#         - **empty_universe**(Step 1 就 0 檔)⇒ 真的需要 Go:`gatheredCounter.Add` 在
#           `if SymbolsBuilt == 0 { return }` **之後** ⇒ 整個 pipeline 不動任何 counter。
#           現有可用的機器可讀標記是 snapshot 的 `result.quotes_status="not_attempted"`
#           (但沒有曝光成指標)。
#       ⇒ 診斷時**第 0 步**先看 snapshot 的 `quotes_status`:`not_attempted` 就是
#         「Step 1/2 early-return」,不是 quotes 缺失;不要照 quotes 缺失的步驟查。
#   (e) ranked 的 stage 在生產曾**無法區分**(label 配對缺陷使 `symbols_ranked_total` 無標籤,
#       兩個 stage 共用同一個 series)⇒ weekly 只要成功一次,就會遮蔽「daily 評分死亡」。
#       **已由 #1989 修復**(單標籤 series 不再被丟掉,現在有 `stage`)⇒ 缺口本身關閉。
#       ⚠️ 但**規則層的結論不變,只是理由換了**:過渡期(≤ 6 天)內 TSDB 仍同時保有舊的
#       **無標籤** series,所以第 1 條在**期間內仍不可**加 stage matcher(`{stage="daily"}`
#       會讓舊 series 完全不 match = 漏報),也不可用「聚合值」宣稱 daily 死亡。
#       最早可加 stage matcher 的時間 = 舊形狀最後樣本 + 6 天(≈ 2026-10-01 之後);
#       在那之前的追蹤見 FOLLOWUPS FU-20260925-06/-11。
#   (f) 上述 (a)-(e) 的共同後果:本檔是「有產出但產出是空的」的偵測器,**不是**萬能心跳。
#   (g) 2026-09-25(任務 O)新增的第 4/5 條也有各自的殘餘缺口(刻意,不是遺漏):
#       - 第 4 條的 peer gate 用 `atlas_universe_symbols_filtered_total`。若某次改名**同時**
#         動到 `screened` 與 `filtered`,gate 與判定會一起消失 ⇒ 本條沉默。
#         (#1995 之前這種情形沒有規則接手 —— 第 1/3 條的右側靠 `or vector(0)` 把
#          「family 不存在」判成 0 而順帶 firing,代價是同一件事被用錯誤的文案報告。
#          修法之後那兩條不再宣稱 0,改由第 6 條負責:它的判定是 `ranked` / `quotes_fetched`
#          的缺席,與 `screened`/`filtered` 無關 ⇒ 「整族被改名」一定有規則會響,
#          而且文案正確。)
#       - 第 5 條只覆蓋「`screened` 存在但 6 天零增量」的 empty_filtered 形狀。
#         (#1995 之後 `WarmUp()` 在啟動時就建立 `screened`,所以「從未存在」的形狀也自動
#          落進第 5 條 —— 它現在以「存在但零增量」出現;第 4 條只在 `screened` 真的被移除時 firing。)
#       - 全部規則(新舊)都不覆蓋 `empty_universe`(Step 1 就 0 檔):需要 Go 端新增心跳指標
#         (`gathered_total` 的 Add 在 `if SymbolsBuilt == 0 { return }` **之後** ⇒ 真的沒有訊號)。

groups:
  - name: atlas_universe_scoring
    # 視窗以天計,1 分鐘評估一次遠超過所需解析度(生產 scrape_interval=10s)。
    interval: 1m
    rules:
      # ══ 1. 評分空轉:有篩選活動,但 ranked 完全沒有增量 ═════════════════════════════
      # 對應任務 L 報告 §6.2 的草案 (1)。語意:過去 6 天內 screening 階段確實動過
      # (screened 有任何增量、任何 stage),但同 6 天內 ranked **一次都沒有增加**
      # ⇒ 評分階段沒有產出母體。
      # 為什麼兩個條件都要:只看「ranked 增量 = 0」會在週末/連假/服務剛重啟(技術性空窗)時誤報;
      # 加上「同視窗內有 screening 活動」才代表「pipeline 真的跑了,但評分空轉」。
      # ⚠️ 判定側(ranked)自 2026-09-26(#1995)**不再**寫 `or vector(0)`:沒有樣本時
      # `sum(increase(...))` 回空集合 ⇒ 本條沉默,由第 6 條以「指標族缺失」的文案報告。
      # 若把 `or vector(0)` 加回去,「指標族被改名/移除」會被誤判成「ranked=0」而給出
      # 錯誤的 triage(送去查 pipeline),那正是 #1995 的假警報形狀。
      - alert: AtlasUniverseRankedZero
        expr: |
          (
            (sum(increase(atlas_universe_symbols_screened_total[6d])) or vector(0)) > 0
            and
            sum(increase(atlas_universe_symbols_ranked_total[6d])) == 0
          )
        # 30 分鐘純粹是吸收重啟/scrape 抖動的 pending 窗;條件的本質是**持續狀態**
        # (ranked 已 6 天沒動),不需要更長的前置等待。
        for: 30m
        labels:
          severity: warning
          service: atlas
          component: universe-scoring
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 評分空轉:6 天內有篩選活動,但 symbols_ranked 增量為 0"
          description: |
            SmartUniverseBuilder 的評分階段在過去 6 天內沒有產出任何 ranked symbol,
            但同一段期間 screening 階段確實有活動(symbols_screened 有增量)
            —— 意思是:pipeline 有跑,評分卻空轉。

            這代表什麼:
            - ranked 是 sector allocation / stockpicker 等下游的母體來源;ranked 空 = 母體空。
              生產目前沒有任何 ranked 消費者,所以下游不會壞 —— **只有外部監看抓得到**。
            - 歷史根因(2026-06-22 起,連續 3 個月;**已由 #1979 修復並於 2026-09-25 部署**):UniverseBuilderDeps.Quotes 是常數 nil
              ⇒ BuildUniverse Step 3 走 else 分支(空 quoteMap)⇒ 每個 symbol 在
              「quotes 查不到就 continue」短路 ⇒ survivors=0 → passed=0 → ranked=0。
            - 與 #1971 gate 的觀察窗不變量 `symbols_ranked > 0` 直接相關:本條 firing 就是
              那個不變量被違反。rollback 政策寫在 configs/parameters.json 的 todo(業主裁決)。
            - 遮蔽注意(歷史缺口 (e),**已由 #1989 於 2026-09-25 修復**):修復前 ranked series
              因標籤配對缺陷而沒有標籤 ⇒ 兩個 stage 共用同一個 counter,weekly 只要成功產出過
              ranked 就會遮蔽「daily 評分死亡」最多 6 天。修復後 `symbols_ranked_total` 帶
              `stage` 標籤;但過渡期(≤ 6 天 = 本檔的視窗長度)Prometheus 仍同時保有舊的
              **無標籤** series ⇒ 那段期間聚合值仍可能被 weekly 遮蔽,判讀時要看 `stage`。
              三條一起看:只有本條沉默而第 2/3 條 firing 時,優先懷疑報價(quotes)階段。

            先查什麼(依序):
            1. 評分階段日誌:docker logs atlas-go --since 48h 2>&1 | grep -E "scoring_ok|daily_refresh_ok|weekly_rebuild_ok"
               看 input=.. ranked=..。（scoring_ok 只是 INFO、沒有門檻,要看數字）
            2. Quotes provider 是否被接上:grep -n "Quotes:" cmd/atlas/bootstrap_helpers.go
               正確值是 `Quotes: quotes`;若又變回 nil(歷史上的 bootstrap_helpers.go:217)
               就是回歸 —— 2026-06-22~09-25 的實例就是這個形狀。
            3. 交叉證據(⚠️ 2026-09-26 起語意已變,見檔頭「部署後的預期行為」):
               curl -s localhost:18080/metrics | grep '^atlas_universe_quotes_fetched_total'
               · 有 series 但 increment 為 0 ⇒ Step 3 的 quotes 分支沒貢獻任何報價
                 (可能是走 else(provider 沒接上),也可能是接了但回空 —— 看第 3 條)。
               · **沒有 series** ⇒ 這是「指標族缺失」,不是 Step 3 的判定:
                 修復前 series 只在第一次增量才建立(重啟後會整族消失),
                 修復後由 `UniverseMetrics.WarmUp()` 在啟動時就建立 ⇒ 缺席即指向
                 第 6 條(改名/移除或服務沒在跑),不要拿它推論 quotes 分支。
            4. 若部署已含 #1979:直接看快照 data/state/universe_snapshot.json 的
               result.quotes_status / result.ranked_trustworthy / result.ranked_fallback_reason
               —— 這三個欄位就是為本案加的機器可讀判定。
            5. ⚠️ 不要用 counter 絕對值當門檻(累積 counter 沒有上界 ⇒ 固定數字會隨天數失效)。
               歷史上的灌爆缺陷(x·N(N+1)/2;實測只跑 2 輪顯示 4797)已由 #1989 於 2026-09-25
               修復,但禁令不變。本規則只看 increase() 是否為 0,與這件事無關。
            6. 若本指標 family 整體消失(被改名/移除),本條**不會** firing —— 判定側沒有
               `or vector(0)`,沒有資料就不宣稱「量測到 0」(#1995)。缺席由第 6 條
               `AtlasUniverseMetricsFamilyMissing` 負責,照那一條的 triage 查指標名字,不要查 pipeline。
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 2. 篩選全滅:有篩選活動,但 passed 完全沒有增量 ══════════════════════════
      # 本條不在任務 L 的草案裡 —— 它是本案**相鄰上游**的那一段(草案聚焦 ranked 與 quotes,
      # 漏了「每個 symbol 都被判 failed」這個獨立的可觀測症狀;任務規格明確要求這一維)。
      # 語意:過去 6 天內篩選階段確實動過,但 passed **一次都沒有增加**
      # (⇒ 有活動的那些增量全落在 failed;`symbols_screened` 只有 passed/failed 兩種 result bucket)。
      # 為什麼不逐一比 failed/passed 的數量:那需要絕對值門檻,而這族是無上界的累積 counter(見檔頭 (1))。
      # 標籤:同時接受 `result=`(來源碼語意,也是 #1989 修復後生產的實際形狀)與
      # `daily=`/`weekly=`(舊的配對缺陷形狀,過渡期 ≤ 6 天內 TSDB 仍保有;修復後**不可**移除),
      # 見檔頭 (3) —— 兩者放在同一個 sum() 內相加,不是「先 match 到誰就用誰」。
      - alert: AtlasUniverseScreeningAllRejected
        expr: |
          (
            (sum(increase(atlas_universe_symbols_screened_total[6d])) or vector(0)) > 0
            and
            (sum(
               increase(atlas_universe_symbols_screened_total{result="passed"}[6d])
               or increase(atlas_universe_symbols_screened_total{daily="passed"}[6d])
               or increase(atlas_universe_symbols_screened_total{weekly="passed"}[6d])
             )) == 0
          )
        for: 30m
        labels:
          severity: warning
          service: atlas
          component: universe-screening
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe 篩選全滅:6 天內沒有任何 symbol 通過篩選(passed 增量為 0)"
          description: |
            篩選階段在過去 6 天內把所有 symbol 都判為 failed,沒有任何一個進入 passed
            (同一視窗內 screening 有增量 ⇒ pipeline 確實跑過,不是「這幾天沒跑」)。

            這代表什麼:
            - passed=0 是 ranked=0 的**相鄰上游**:survivors 空 → ScreenUniverse 沒有東西可評分。
            - 常見成因兩個:
              (a) quotes 是空的 —— 查不到 quote 就 continue,等同「全部不合格」
                  (生產 2026-06-22 起的實例,見 AtlasUniverseRankedZero 的說明);
              (b) 門檻真的把所有 symbol 濾掉 —— VolumeFloorTWD / PriceMin 設定或
                  Volume/Last 單位語意有問題(approxTWD = Volume * Last)。
            - 三條一起看:本條 + AtlasUniverseQuotesMissing 同時 firing ⇒ 優先懷疑 (a);
              只有本條 firing 而 ranked 仍有增量 ⇒ 查 (b)。

            先查什麼(依序):
            1. 篩選/評分日誌:docker logs atlas-go --since 48h 2>&1 | grep -E "scoring_ok|daily_refresh_ok|empty_filtered"
            2. 門檻現值:SmartUniverse 的 VolumeFloorTWD / PriceMin(configs/parameters.json)
            3. quotes 是否為空:curl -s localhost:18080/metrics | grep universe_quotes_fetched_total
               (series 不存在 = quotes 分支沒執行 = quoteMap 空)
            4. ⚠️ 同上,不要用 counter 絕對值當門檻:累積 counter 沒有上界,固定數字門檻會隨
               天數自然失效。(歷史上的 x·N(N+1)/2 灌爆缺陷已由 #1989 於 2026-09-25 修復。)
          runbook_url: "https://github.com/kaecer68/atlas-go/blob/main/docs/operations/universe-scoring-ranked-zero-20260925.md"

      # ══ 3. 報價來源沒有貢獻任何資料(本案的決定性訊號)═════════════════════════════
      # 對應任務 L 報告 §6.2 的草案 (2),但**改寫**:草案寫的 `atlas_universe_quotes_fetched_last`
      # gauge **不存在**,所以用兩個同視窗的 `increase()` 判定:
      #   左:「同一視窗內 pipeline 跑過」(screened 有任何增量)。
      #   右:「同一視窗內 quotes_fetched 完全沒有增量」⇒ quotes 分支沒執行,或執行了但回 0 筆。
      # 為什麼是決定性訊號:`atlas_universe_quotes_fetched_total` 是 Step 3 的 `if deps.Quotes != nil`
      # 分支內唯一會記錄報價筆數的地方(`universe_scheduler.go` 的 `quotesFetchedCounter.Add(...)`,
      # 即使 0 筆、即使 fetch error 也會 Add)⇒ 在同一視窗內 screening 有活動、而這個 counter
      # **完全沒有增量**,就代表 Step 3 沒有貢獻任何報價(走了 else 分支,或接了但回空)。
      # ⚠️ 2026-09-26(#1995)起 `UniverseMetrics.WarmUp()` 會在**每次啟動**就把這個 series
      # 以 0 建立 ⇒ 「series 不存在」不再等於「走了 else 分支」(那是修復前的推理,見
      # 下方 triage 第 2 步)。判定仍然成立,只是證據從「series 在不在」換成「增量是否為 0」。
      # 修好之後本條會在下一次執行自動 resolve(quotes_fetched 一旦有增量)。
      # ⚠️ 兩側必須同視窗(獨立驗證的 F-1):曾經用「本 process 期間跑過」的當下值當左側,
      #    結果在 > 4 天休市期間對**健康** pipeline 誤報約 71 小時(左側不會衰減、右側會)。
      # 副作用(已評估、可接受):兩側同視窗之後,本條**不再**在容器重啟時自動沉默;而且
      #    「剛部署修好 provider」時會多響 ≤ 24 小時(要等下一次執行增加 quotes_fetched 才
      #    resolve)—— 這是「不在健康系統上假報」換來的代價(獨立驗證以重啟序列實測確認)。
      - alert: AtlasUniverseQuotesMissing
        expr: |
          (
            (sum(increase(atlas_universe_symbols_screened_total[6d])) or vector(0)) > 0
            and
            sum(increase(atlas_universe_quotes_fetched_total[6d])) == 0
          )
        for: 30m
        labels:
          severity: warning
          service: atlas
          component: universe-quotes
          wave: "9.2"
          incident_ref: "universe-scoring-gap-20260925"
        annotations:
          summary: "universe pipeline 跑了但沒有任何報價資料(provider 缺失或回空)"
          description: |
            SmartUniverseBuilder 在過去 6 天內至少完成過一次執行(screening 有增量),
            但同一段期間 `atlas_universe_quotes_fetched_total` 完全沒有增量
            —— 也就是 Step 3 拿到的 quoteMap 不是空的、就是整個 quotes 分支沒被執行。

            這代表什麼:
            - quotes 是評分階段唯一的 Volume/Last 來源;沒有它,`applyVolumeAndPriceFilters`
              對每個 symbol 都在「quotes 查不到就 continue」短路 ⇒ survivors=0 ⇒ passed=0
              ⇒ ranked=0。**這是 ranked=0 的直接原因**,不是間接推論。
            - 兩個分支要分辨(這是本條的重點):
              (a) **provider 沒接上(回歸)**:wiring 是 `Quotes: nil`(2026-06-22~09-25 的歷史值在
                  bootstrap_helpers.go:217;#1979 部署後應為 `Quotes: quotes`)⇒ quotes 分支從未被執行,
                  該 series 只有 0 增量。
                  (⚠️ #1995 修復前這個形狀的旁證是「series 根本不存在」;修復後 series 由
                   `UniverseMetrics.WarmUp()` 在啟動時建立,兩者改用增量區分。)
              (b) **provider 有接但回空或回錯**:series 存在但值為 0,且通常伴隨
                  `quotes_fetch_error` WARN 與
                  `atlas_universe_quotes_errors_total{stage="daily",error_type="fetch_error"}`
                  (#1989 修好標籤配對後的真實形狀;過渡期 ≤ 6 天內舊形狀
                   `{daily="fetch_error"}` 的 series 仍在 TSDB 裡)。
              兩者對下游的後果完全相同(空 quoteMap ⇒ ranked=0),所以都該 firing。

            先查什麼(依序):
