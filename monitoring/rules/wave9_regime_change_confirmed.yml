groups:
  - name: wave9_regime_change_confirmed
    rules:
      - alert: RegimeChangeConfirmedSpike
        expr: increase(regime_change_confirmed_total[10m]) > 3
        for: 10m
        labels:
          severity: info
          service: atlas-monitoring
          wave: "9.2"
          enabled: "false"  # Wave 9.0a placeholder，預設不啟用（PD-W9-1）
        annotations:
          summary: "短時間內多次 regime 穩定確認（可能為市場反覆震盪）"
          description: |
            10m 內 regime_change_confirmed 事件 {{ $value }} 次。
            30 秒穩定窗口可能太短，建議檢查 debouncer window 設定。
          runbook_url: "https://wiki.internal/runbooks/wave9-regime-change-confirmed"

# Wave 9.2 實作 RegimeChangeConfirmed debouncer 後啟用