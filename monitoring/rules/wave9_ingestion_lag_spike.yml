groups:
  - name: wave9_ingestion_lag_spike
    rules:
      - alert: IngestionLagP99High
        expr: histogram_quantile(0.99, rate(ingestion_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: atlas-apigateway
          wave: "9.5"
          enabled: "false"  # Wave 9.0a placeholder，預設不啟用（PD-W9-1）
        annotations:
          summary: "API Gateway ingestion p99 latency 超過 5 秒"
          description: |
            p99 latency: {{ $value }}s.
            建議檢查 BackgroundTaskManager queue 或 data provider 延遲。
          runbook_url: "https://wiki.internal/runbooks/wave9-ingestion-lag-spike"

# Wave 9.5 實作 IngestionLagSpike Prometheus histogram（在 internal/apigateway/background.go 加 struct field）後啟用
# PD-W9-3：採 histogram 而非 gauge，支援 p50/p95/p99 quantile