groups:
  - name: channel_health_latent_staleness
    rules:
      - alert: ChannelDataStale
        # 2026-09-04 告警降噪: 改用契約感知超額量 overage（staleness 超出
        # 該通道 FreshnessWindow 的秒數,由 channel_health_metrics_task 匯出）。
        # raw staleness > 24h 會對「資料時間戳合法落後」的通道日日誤報
        # （實證: us10y/vix data-as-of 落後 ~27h）與週快照通道
        # （tdcc_equity_dispersion 8 天窗口）。
        #
        # 2026-10-04 修（F58，週末假陽性）: overage 的算法移進契約本身
        # （apigateway.ChannelContract.StalenessOverageSeconds），讓「上游只在
        # **交易日**發布」的通道以交易日曆判定而非牆鐘窗口（Go 側重用
        # internal/taiwanholidays；同型於 F54 phase 1 的 ExpectedQuoteDate）。
        # 實證: twse_sbl last_success 10-02T07:20Z / government_broker
        # 10-02T07:18Z ⇒ 週日晚 raw age 55h8m > 48h 窗口而兩個通道完全正常
        # （上游週末無發布機會，過窗 7h 純屬曆法假象）。宣告
        # PublishCalendar=tw_trading_day 的通道改問「資料是否來自最新一個
        # 已過發布窗口的交易日（台北 18:00）」，日曆無關的通道語意不變。
        # ⚠️ 未納入本次變更（已知殘留，已登錄）: atlas_channel_health_status 的
        # stale→warn 判定仍用牆鐘窗口 ⇒ 週末儀表板可能顯示 stale（不 page，
        # 規則只匹配 ==2）。追蹤: a2a-dev docs/FOLLOWUPS.md **F58**（本 repo
        # 的 F-item SSOT 沿例放 a2a-dev，同 F54）。
        expr: atlas_channel_staleness_overage_seconds > 0
        for: 15m
        labels:
          severity: warning
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道數據過於老舊"
          description: |
            Channel {{ $labels.channel }} data staleness exceeds its freshness contract by {{ $value | humanizeDuration }}.
            建議檢查該通道的自動排程是否仍在運行，或資料源是否中斷。
          runbook_url: "https://wiki.internal/runbooks/channel-data-stale"

      - alert: ChannelFetchLatencyHigh
        # 2026-09-03 告警降噪：day_trading / market_volume /
        # geopolitical_taiwan 為多來源外部抓取，30-50s 是常態不是故障——
        # threshold 30s→90s、for 5m→15m（實證：每日重複誤報）。
        expr: atlas_channel_fetch_latency_seconds > 90
        for: 15m
        labels:
          severity: warning
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道抓取延遲過高"
          description: |
            Channel {{ $labels.channel }} last fetch latency was {{ $value }} seconds.
            可能原因：上游 API 回應變慢、rate limit、或網路不穩。
          runbook_url: "https://wiki.internal/runbooks/channel-fetch-latency-high"

      # R4 (#1877): health samples are emitted by tasks with different
      # intervals, so a single generic `for: 5m` is too short for 1h/6h/24h
      # probes. Split by schedule cadence; check-channel-consistency keeps
      # these matchers and `for` values aligned with ScheduledTask intervals.
      - alert: ChannelHealthStatusError
        expr: atlas_channel_health_status{channel!~"^(exchange_rate|finmind|fubon|fugle|geopolitical_taiwan|taiex_index|taifex_daily|tsmc_revenue|twse_insider|twse_replay)$"} == 2
        # Fast 5m probes keep the existing 2026-09-06 5m hysteresis.
        for: 5m
        labels:
          severity: error
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道健康狀態為 error"
          description: |
            Channel {{ $labels.channel }} health status is error.
            請檢查 channel_health.json 中的 last_error 與 AlertStore 中的 data_gap / channel_health 警報。
          runbook_url: "https://wiki.internal/runbooks/channel-health-status-error"

      - alert: ChannelHealthStatusError
        expr: atlas_channel_health_status{channel=~"^(exchange_rate|finmind|fubon|fugle|taiex_index|taifex_daily|twse_insider|twse_replay)$"} == 2
        # 1h probes: one failed sample must not page; wait at least one interval.
        for: 1h
        labels:
          severity: error
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道健康狀態為 error"
          description: |
            Channel {{ $labels.channel }} health status is error.
            請檢查 channel_health.json 中的 last_error 與 AlertStore 中的 data_gap / channel_health 警報。
          runbook_url: "https://wiki.internal/runbooks/channel-health-status-error"

      - alert: ChannelHealthStatusError
        expr: atlas_channel_health_status{channel="geopolitical_taiwan"} == 2
        # 6h probe: wait one full interval before alerting.
        for: 6h
        labels:
          severity: error
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道健康狀態為 error"
          description: |
            Channel {{ $labels.channel }} health status is error.
            請檢查 channel_health.json 中的 last_error 與 AlertStore 中的 data_gap / channel_health 警報。
          runbook_url: "https://wiki.internal/runbooks/channel-health-status-error"

      - alert: ChannelHealthStatusError
        expr: atlas_channel_health_status{channel="tsmc_revenue"} == 2
        # 24h probe: wait one full interval before alerting.
        for: 24h
        labels:
          severity: error
          service: atlas-monitoring
          wave: "9.2"
          enabled: "true"
        annotations:
          summary: "通道健康狀態為 error"
          description: |
            Channel {{ $labels.channel }} health status is error.
            請檢查 channel_health.json 中的 last_error 與 AlertStore 中的 data_gap / channel_health 警報。
          runbook_url: "https://wiki.internal/runbooks/channel-health-status-error"
