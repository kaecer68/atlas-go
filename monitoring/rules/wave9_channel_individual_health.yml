groups:
  - name: wave9_channel_individual_health
    rules:
      - alert: ChannelHighErrorRatePerChannel
        expr: sum by (channel) (rate(atlas_channel_health_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: info
          service: atlas-monitoring
          wave: "9.1"
          enabled: "true"  # Enabled 2026-07-05 per PR #950 Wave 9 audit — metric emit verified by PR #926/#948.
        annotations:
          summary: "個別監控通道錯誤率超過閾值"
          description: |
            Channel {{ $labels.channel }} 5m error rate: {{ $value | humanizePercentage }}.
            建議檢查該 channel 對應的 data provider 狀態。
          runbook_url: "https://wiki.internal/runbooks/wave9-channel-individual-health"

# PD-W9-1：YELLOW 事件預設 severity: info，alert rule 預設 enabled: false
# Wave 9.1 實作 EventChannelIndividualHealth emit 邏輯後，operator 可手動啟用此 alert rule