receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  # postgresql exporter does not exist in OpenTelemetry Collector
  # contrib image (verified via "unknown type" error). Replaced with
  # debug exporter as a no-loss placeholder — traces are still
  # accepted via OTLP and logged to stdout, but not persisted.
  # To restore Postgres-backed trace storage, write a custom
  # exporter (no built-in alternative) or switch the atlas-go env
  # OTEL_EXPORTER_OTLP_ENDPOINT to a collector that supports it.
  debug:
    verbosity: normal

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]