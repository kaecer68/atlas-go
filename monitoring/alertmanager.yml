global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER"

route:
  receiver: default-slack
  group_by: [alertname, service, provider]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical-slack
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    - receiver: warning-slack
      match:
        severity: warning
      repeat_interval: 4h

    - receiver: info-slack
      match:
        severity: info
      repeat_interval: 12h

    - receiver: atlas-webhook
      match_re:
        service: atlas.*
      repeat_interval: 1m

receivers:
  - name: default-slack
    slack_configs:
      - channel: "#atlas-alerts"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: critical-slack
    slack_configs:
      - channel: "#atlas-alerts-critical"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: warning-slack
    slack_configs:
      - channel: "#atlas-alerts"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: info-slack
    slack_configs:
      - channel: "#atlas-alerts-info"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: false

  - name: atlas-webhook
    webhook_configs:
      - url: 'http://atlas:18080/api/v1/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, service, provider]
