global:
  resolve_timeout: 5m
  # Telegram 是備援方案（PR #1707），但 alertmanager 0.27.0/0.28.1 + telebot.v3
  # 對 telegram API sendMessage 持續回 404（root cause 仍待查）。主通知走 webhook
  # 路徑（atlas-webhook-telegram → ~/bin/atlas-alertmanager-webhook-to-telegram.py）。
  # 修好後改回 atlas-telegram 即可。

route:
  receiver: atlas-webhook-telegram
  group_by: [alertname, service, provider]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # atlas.* 所有 severity 都走 webhook
    - receiver: atlas-webhook-telegram
      match_re:
        service: atlas.*
      group_wait: 10s
      repeat_interval: 1h

    # 非 atlas 服務的 critical 也走 webhook（避免 service label 不對齊時漏通知）
    - receiver: atlas-webhook-telegram
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    # 其他走 placeholder slack（目前不會觸發，等正式 slack webhook 設定後再啟用）
    - receiver: default-slack
      match:
        severity: warning
      repeat_interval: 4h

    - receiver: info-slack
      match:
        severity: info
      repeat_interval: 12h

receivers:
  # 主要通知: webhook → python script → Telegram
  # 詳見 ~/bin/atlas-alertmanager-webhook-to-telegram.py
  - name: atlas-webhook-telegram
    webhook_configs:
      - url: 'http://host.docker.internal:9095/alert'
        send_resolved: true

  # Telegram（備援方案，等 alertmanager 修好可切回）
  - name: atlas-telegram
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: 8387647295
        parse_mode: 'Markdown'
        message: |
          *[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}*
          Service: `{{ .CommonLabels.service }}`
          Severity: `{{ .CommonLabels.severity }}`

          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  # Placeholder slack fallback
  - name: default-slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER"
        channel: "#atlas-alerts"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: critical-slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER"
        channel: "#atlas-alerts-critical"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: warning-slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER"
        channel: "#atlas-alerts"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: info-slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER"
        channel: "#atlas-alerts-info"
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, service, provider]
