# LLM Router Configuration
# Defines the per-capability four-tier fallback chain (Primary → Backup1 → Backup2 → LastResort).
# Design source: docs/llm-integration-strategy-framework.md §6.1
#
# Provider values:
#   minimax      — MiniMax M3 (primary capability host; China jurisdiction — gated for DataClassRegulated)
#   deepseek     — DeepSeek V4-Pro (first backup; strong analytical capabilities)
#   opencode_go  — OpenCode-Go (second backup; local/self-host)
#   mock         — Mock provider (last resort; returns empty output)
#   opencode_zen — OpenCode-Zen (future; not yet wired)

routing_chains:
  # strategy.failure_attribution — annotator hot path
  failure_attribution:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # narrative.rationale_translation_fallback
  rationale_generation:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # strategy.frame_summary
  strategy_summary:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # dev.prompt_lint
  prompt_lint:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # orchestrator.prism_cohort_insight
  scenario_simulation:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # spawning.gap_description_enrichment
  risk_surface_extraction:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # narrative.event_headline
  regime_explanation:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # risk.confidence_calibration_commentary
  performance_forensics:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # narrative.sentiment_explanation
  sentiment_explanation:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # dev.code_review_annotation — U-tier utility
  code_review_annotation:
    primary: minimax
    backup1: deepseek
    backup2: opencode_go
    last_resort: mock

  # strategy.contra_attribution — adversarial analysis
  contra_attribution:
