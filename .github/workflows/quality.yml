name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Code formatting check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Please run 'gofmt -w .' to fix formatting issues:"
          gofmt -l .
          exit 1
        fi

  # Vet
  vet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run go vet
      run: go vet ./...

  # File naming convention
  naming:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check naming conventions
      run: bash scripts/ci/check_case_conflicts.sh --strict

  # Static analysis
  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

  # Test coverage
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run tests with coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -n 1

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 40" | bc -l) )); then
          echo "Coverage is below 40% threshold"
          exit 1
        fi

  # License check
  license:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check repository licensing policy
      run: |
        if ls LICENSE* >/dev/null 2>&1; then
          echo "Repository license file found:"
          ls LICENSE*
        else
          echo "No repository LICENSE file found."
        fi

        echo "Per-file Go license headers are not enforced by this repository policy."
