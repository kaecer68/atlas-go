name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Code formatting check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Please run 'gofmt -w .' to fix formatting issues:"
          gofmt -l .
          exit 1
        fi

  # Lint — runs all 9 enabled linters (govet, staticcheck, errcheck, gosec, ineffassign, unused, misspell, unconvert, unparam)
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: v2.12.2
        args: --timeout=5m

  # File naming convention
  naming:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check naming conventions
      run: bash scripts/ci/check_case_conflicts.sh --strict

  # Go generate check — ensures generated files are up-to-date
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run go generate
      run: go generate .

    - name: Check for uncommitted generated changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "ERROR: go generate produced uncommitted changes."
          echo "Run 'go generate .' locally and commit the results."
          git diff --stat
          exit 1
        fi

  # Frontend-backend field contract check — validates JS field accesses
  # against Go JSON tags generated by cmd/gentags.
  field-contract:
    needs: generate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check frontend-backend field contract
      run: bash scripts/ci/check_field_contract.sh --strict

  # Test coverage
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run tests with coverage (exclude cmd/atlas — heavy integration, see ci-cd.yml:test-cmd-atlas)
      run: |
        go test -coverprofile=coverage.out $(go list ./... | grep -v '/cmd/atlas$')
        go tool cover -func=coverage.out | tail -n 1

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '\r' | sed 's/%//')
        echo "Total coverage: $COVERAGE%"
        if echo "$COVERAGE 40" | awk '{exit !($1 < $2)}'; then
          echo "Coverage is below 40% threshold"
          exit 1
        fi

  gitnexus-stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Verify GitNexus stats in documentation
      run: bash scripts/verify-gitnexus-stats.sh

  # Maturity label consistency — ensures all internal/ packages have
  # valid Maturity: tags in doc.go and MATURITY.md is consistent.
  maturity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check maturity label consistency
      run: bash scripts/ci/check_maturity.sh

  # Agent prompt files — ensures every enabled agent in agents.json
  # has a corresponding prompt file under prompts/agents/.
  agent-prompts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check agent prompt file integrity
      run: bash scripts/ci/check_agent_prompts.sh

  # Markdown link check — ensures internal documentation links are valid
  markdown-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check markdown links
      run: bash scripts/ci/check_markdown_links.sh

  # License check
  license:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check repository licensing policy
      run: |
        if ls LICENSE* >/dev/null 2>&1; then
          echo "Repository license file found:"
          ls LICENSE*
        else
          echo "No repository LICENSE file found."
        fi

        echo "Per-file Go license headers are not enforced by this repository policy."

  # Factor system integrity check (G1-G10)
  factor-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run factor integrity check
      run: bash scripts/ci/verify_factor_integrity.sh

  # Gate 1: Parameter data integrity — catches Save() silently dropping
  # calibration timestamps by checking evidence_quality vs timestamp consistency.
  validate-parameters:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Validate parameters.json integrity
      run: go run ./cmd/validate-parameters

  # Gate 2: Calibration evidence smoke — verifies the real parameters.json
  # has valid calibration timestamps when evidence_quality claims calibration.
  calibration-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Smoke test calibration evidence
      run: go test ./internal/config/ -run TestCalibrationEvidence_Smoke -v -count=1

  # Gate 3: LoadCalibrationEvidence unit tests — covered by the existing
  # coverage job (go test ./... includes ./internal/industry/...).

  # Data naming convention check — validates data/ files follow
  # docs/DATA_NAMING_CONVENTION.md (R1-R10). Blocking for R1/R2 violations,
  # warning for flat files pending P3.0 restructure.
  data-naming:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check data file naming conventions
      run: bash scripts/ci/check_data_naming.sh

  # JSON Schema validation — validates JSONL files against their schemas.
  # Graceful: skips if schemas/ doesn't exist yet, non-blocking warnings
  # for files without schemas.
  json-schema-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check JSON Schema validation
      run: bash scripts/ci/validate_json_schemas.sh --json

  # Data catalog freshness — ensures docs/DATA_CATALOG.md accurately reflects
  # data/ directory content. Graceful until catalog population (P1.3).
  data-catalog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check data catalog freshness
      run: bash scripts/ci/check_data_catalog.sh --warn-only

  # Orphan artifact detection — ensures no compiled binaries, PID files,
  # coverage reports, or graphify cache artifacts have been committed.
  check-orphan-artifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check for orphan artifacts in git index
      run: |
        orphans=""
        # Compiled Go binaries (Mach-O/ELF)
        for f in $(git ls-files); do
          if [ -f "$f" ]; then
            ft=$(file "$f" 2>/dev/null)
            case "$ft" in
              *"Mach-O"*|*"ELF"*)
                orphans="$orphans  [BINARY] $f ($(echo "$ft" | head -1))"
                ;;
            esac
          fi
        done
        # PID files
        for f in $(git ls-files '*.pid'); do
          orphans="$orphans  [PID] $f"
        done
        # Coverage output
        for f in $(git ls-files '*.out'); do
          orphans="$orphans  [COVERAGE] $f"
        done
        # Graphify cache at root
        for f in $(git ls-files '.graphify_*.json'); do
          orphans="$orphans  [GRAPHFIY] $f"
        done
        if [ -n "$orphans" ]; then
          echo "❌ Found orphan artifacts in git index:"
          echo "$orphans"
          echo ""
          echo "These files should be in .gitignore and removed from tracking."
          echo "Run: git rm --cached <file>  (keeps file on disk)"
          exit 1
        fi
        echo "✅ No orphan artifacts found"

  # Frontend smoke — Playwright-based UI check on key pages.
  # Derives target pages from PR diff; falls back to overview+narrative+live+portfolio.
  # Skips (exit 0) if diff doesn't touch any monitored path.
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install Playwright chromium
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Run frontend smoke
      run: bash scripts/ci/frontend_smoke.sh origin/${{ github.base_ref }}
