name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  # Path filter to skip heavy Go checks for documentation-only changes.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      id: filter
      with:
        filters: |
          # Code-only changes — trigger heavy Go/frontend checks.
          code:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - 'cmd/**'
            - 'internal/**'
            - 'pkg/**'
            - 'migrations/**'
            - '**/*.sql'
            - 'Dockerfile*'
            - 'docker-compose*'
          # CI/scripts changes — trigger the script-validating jobs (which
          # run unconditionally below) but NOT the heavy code checks.
          # Keeps a one-line script fix from paying for full lint+coverage.
          ci:
            - 'scripts/**'
            - 'Makefile'
            - '.github/workflows/**'

  # Frontend build (reusable) — builds admin_web + client_web once,
  # uploads dist artifacts. Downstream jobs download instead of rebuilding.
  # Skipped for documentation-only changes.
  frontend-build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_frontend-build.yml
    permissions:
      contents: read
      actions: write

  # Code formatting check
  fmt:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Please run 'gofmt -w .' to fix formatting issues:"
          gofmt -l .
          exit 1
        fi

  # Lint — runs all 9 enabled linters (govet, staticcheck, errcheck, gosec, ineffassign, unused, misspell, unconvert, unparam)
  lint:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: v2.12.2
        args: --timeout=5m

  # Standalone staticcheck — golangci-lint's staticcheck linter is a subset
  # of upstream rules. The validation drill on 2026-07-20 found 5 SA/U warnings
  # (SA1019 deprecation, U1000 unused, SA1012 nil context) that golangci-lint
  # missed. This step closes the gap.
  staticcheck:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Run staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  # File naming convention
  naming:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check naming conventions
      run: bash scripts/ci/check_case_conflicts.sh --strict

  # Jev usage contract — enforces docs/jev/JEV-USAGE-CONTRACT.md (C1-C5:
  # User-Agent / timeout / fail-open / choice criteria type / jevkit self-test).
  # This repo has no Jev (TypeSafe System One) caller today, so the check is a
  # guard: the first caller cannot land with a transport-level violation that
  # would fail silently (403) or break the caller (missing try/except).
  jev-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check Jev usage contract
      run: bash scripts/ci/check_jev_contract.sh

    # 2026-09-24 新增：C5 warn-only 回歸測試（網路失敗不阻擋、STRICT 才擋）。
    # 放在本 job 而非 ci-quick，因為 ci-quick 對每個腳本有 10s timeout，
    # 本自測會 spawn 3 次 python，容易踩到 timeout 偽失敗。
    - name: Jev contract C5 warn-only selftest
      run: bash tests/scripts/test-jev-contract-c5-selftest.sh

  # inert 閉環靜態檢查（issue #1944 建議 2）— 「有寫入、無消費」的靜態閘門：
  # (a) config 旗標有 reader、(b) writer 有 consumer、(c) 「已生效」欄位由證據推導／有 consumer。
  # 無 path filter：docs-或 scripts-only 的 PR 也要跑（檢查 <10s；回歸測試為 hermetic fixture）。
  # 既有歷史項由 scripts/ci/inert-baseline.json 覆蓋（每項 reason 必填；stale 只警告不紅燈）。
  # 規格：docs/specs/inert-static-check-spec.md
  inert-closure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check inert closures (config / writer / claim)
      run: bash scripts/ci/check_inert_closure.sh

    - name: Inert closure regression tests (hermetic fixtures)
      run: bash tests/scripts/test-inert-closure.sh

  # Frontend dynamic import consistency — verifies every admin_web/client_web
  # dynamic import('./pages/xxx.js') resolves to an existing shared_web page.
  # Catches the silent esbuild plugin fallback failure mode (PR #785 / script from PR #789).
  frontend-imports:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check frontend dynamic import consistency
      run: bash scripts/ci/check_frontend_imports.sh

  # Go generate check — ensures generated files are up-to-date
  generate:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run go generate
      run: go generate .

    - name: Check for uncommitted generated changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "ERROR: go generate produced uncommitted changes."
          echo "Run 'go generate .' locally and commit the results."
          git diff --stat
          exit 1
        fi

  # Frontend-backend field contract check — validates JS field accesses
  # against Go JSON tags generated by cmd/gentags.
  field-contract:
    needs: [generate, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check frontend-backend field contract
      run: bash scripts/ci/check_field_contract.sh --strict

  # Test coverage
  coverage:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Run tests with coverage (exclude cmd/atlas — heavy integration, see ci-cd.yml:test-cmd-atlas)
      run: |
        go test -coverprofile=coverage.out $(go list ./... | grep -v '/cmd/atlas$')
        go tool cover -func=coverage.out | tail -n 1

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '\r' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        if echo "$COVERAGE 60" | awk '{exit !($1 < $2)}'; then
          echo "Coverage is below 60% threshold"
          exit 1
        fi

  # Maturity label consistency — ensures all internal/ packages have
  # valid Maturity: tags in doc.go and MATURITY.md is consistent.
  maturity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check maturity label consistency
      run: bash scripts/ci/check_maturity.sh

  # Critical background tasks must exist in the atlas binary — guards
  # against silent compiler DCE removal (2026-08-10 template_detector_scan
  # incident: a `:=` shadowing bug made `if x != nil && y != nil` provably
  # false, so the whole registration block was dead-code-eliminated while
  # compile-only CI stayed green).
  critical-tasks:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Check critical tasks in binary
      run: bash scripts/ci/check_critical_tasks.sh

  # Version consistency — verifies VERSION file matches hardcoded
  # version strings in TARGETS files (AGENTS.md, AGENTS_INDEX.md,
  # MATURITY.md, fubonproxy/AGENTS.md, cmd/atlas-mcp/server/AGENTS.md).
  # Prevents the "multiple version numbers out of sync" problem.
  check-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check version consistency
      run: bash scripts/ci/check_versions.sh

  # Agent prompt files — ensures every enabled agent in agents.json
  # has a corresponding prompt file under prompts/agents/.
  agent-prompts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check agent prompt file integrity
      run: bash scripts/ci/check_agent_prompts.sh

  # Markdown link check — ensures internal documentation links are valid
  markdown-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check markdown links
      run: bash scripts/ci/check_markdown_links.sh

  # Secret scan — this repo is PUBLIC: a committed credential is leaked forever.
  # Precedent: scripts/alertmanager-webhook/*.plist carried a plaintext telegram bot token
  # from 2026-08-27 until 2026-09-25 (the alert chain was silent for ~42h because of it).
  # Runs the scanner + its negative self-test + the webhook install-mechanism regression test.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check no secrets in tracked files
      run: bash scripts/ci/check_secrets.sh

    # 負向證明：證明這個 job 在**真的 repo 內容**上仍然會擋 ✗（不是只會印 PASS）。
    # 造一個含合成（無效）憑證的 tracked 檔 → 掃描器必須 exit 1。
    # 為什麼要這步 ✗：2026-09-25 實測過一次「掃描器在 CI 環境因平台差異而假失敗／假通過」
    # （GNU `stat -f` 語意不同）；只靠 tempdir 自測不足以證明 repo 級路徑也有效 ✓。
    - name: Negative proof — a staged fake credential must be blocked
      run: |
        printf '%s\n' 'BOT_TOKEN=1234567890:'"FAKEfakeFAKEfakeFAKEfakeFAKEfake12345" > scripts/__negtest_secret__.py
        git add -f scripts/__negtest_secret__.py
        if bash scripts/secret-scan.sh; then
          echo "❌ 負向證明失敗：含假憑證的 tracked 檔竟未被擋下"
          exit 1
        fi
        echo "✅ 負向證明通過（掃描器確實會擋）"
        git reset -q scripts/__negtest_secret__.py && rm -f scripts/__negtest_secret__.py

  # MCP tool count doc-code alignment — prevents drift between
  # docs/reference/tool-catalog.md documents the expected tool count; actual AddTool registrations
  mcp-tool-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check MCP tool count doc-code alignment
        run: |
          # PR #911: tools go through countedAddTool wrapper (per tool registration = 1 call site).
          # Detect drift: any direct mcp.AddTool( outside the wrapper body = bypass.
          # Use --include/--exclude so test files are filtered natively (works with -r) and subdirectories are covered.
          CODE_COUNT=$(grep -rhF --include='*.go' --exclude='*_test.go' 'countedAddTool(' cmd/atlas-mcp/server | grep -v '^func countedAddTool' | wc -l | tr -d ' ')
          # The wrapper itself delegates to mcp.AddTool(mcpSrv, tool, handler). Allow exactly that single internal call.
          DIRECT_BYPASS=$(grep -rnF --include='*.go' --exclude='*_test.go' 'mcp.AddTool(' cmd/atlas-mcp/server | grep -vF 'mcp.AddTool(mcpSrv, tool, handler)' | wc -l | tr -d ' ')
          if [ "$DIRECT_BYPASS" -gt 0 ]; then
            echo "ERROR: $DIRECT_BYPASS direct mcp.AddTool( call(s) bypass countedAddTool wrapper."
            echo "Route every tool registration through countedAddTool so RegisteredToolCount stays accurate."
            grep -rnF --include='*.go' --exclude='*_test.go' 'mcp.AddTool(' cmd/atlas-mcp/server | grep -vF 'mcp.AddTool(mcpSrv, tool, handler)' || true
            exit 1
          fi
          DOC_MIN=$(grep -oP '基礎\s*\d+' docs/reference/tool-catalog.md | grep -oP '\d+' | head -1)
          # head -1: catalog prose may contain other "+2" substrings; only the
          # first match (the 工具數量 section) is authoritative.
          DOC_MAX=$(grep -oP '\+2' docs/reference/tool-catalog.md | sed 's/+//' | head -1)
          if [ -z "$DOC_MIN" ] || [ -z "$DOC_MAX" ]; then
            echo "ERROR: Could not parse tool count range from docs/reference/tool-catalog.md"
            exit 1
          fi
          DOC_MAX=$((DOC_MIN + DOC_MAX))
          if [ "$CODE_COUNT" -lt "$DOC_MIN" ] || [ "$CODE_COUNT" -gt "$DOC_MAX" ]; then
            echo "ERROR: docs/reference/tool-catalog.md says $DOC_MIN–$DOC_MAX tools, but code registers $CODE_COUNT tools."
            echo "Update tool-catalog.md, or fix tool registration drift."
            exit 1
          fi
          echo "OK: doc ($DOC_MIN–$DOC_MAX) matches code ($CODE_COUNT registered tools via countedAddTool wrapper)."

  # atlas-mcp docs consistency — authoritative MCP docs must use correct
  # env var names, keep AGENTS.md under the line cap, and propagate the
  # current tool count across README / quickstart / server README.
  atlas-mcp-docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check atlas-mcp docs consistency
        run: bash scripts/ci/check_atlas_mcp_docs_consistency.sh

  # AGENTS.md line count gate — prevents token bloat by enforcing
  # ≤ 180 lines of human-written content (before auto-injected blocks).
  # Warning at 175 lines, hard fail at 180.
  agents-md-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check AGENTS.md human-written line count
        run: |
          HUMAN_LINES=$(awk '/^<!-- gitnexus:start -->/,/^<!-- gitnexus:end -->/{next} {count++} END{print count}' AGENTS.md)
          echo "Human-written AGENTS.md lines: $HUMAN_LINES"
          if [ "$HUMAN_LINES" -gt 180 ]; then
            echo "ERROR: AGENTS.md has $HUMAN_LINES lines (hard limit: 180)."
            echo "Move content to internal/<mod>/AGENTS.md or docs/ before re-expansion."
            exit 1
          fi
          if [ "$HUMAN_LINES" -gt 175 ]; then
            echo "WARNING: AGENTS.md has $HUMAN_LINES lines (soft limit: 175, hard limit: 180)."
            echo "Consider moving content to internal/<mod>/AGENTS.md or docs/."
          fi
          echo "OK: AGENTS.md is within 180-line budget."

  # traps.md line count gate — prevents bloat in the detailed trap reference.
  traps-md-lines:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check docs/reference/traps.md line count
      run: |
        TRAP_LINES=$(wc -l < docs/reference/traps.md | tr -d ' ')
        echo "docs/reference/traps.md lines: $TRAP_LINES"
        if [ "$TRAP_LINES" -gt 330 ]; then
          echo "ERROR: docs/reference/traps.md has $TRAP_LINES lines (limit: 330)."
          echo "Split or consolidate trap entries."
          exit 1
        fi
        echo "OK: docs/reference/traps.md is within 330-line budget."

    - name: Check docs/reference/traps.md module attribution
      run: |
        echo "Checking traps.md module column..."
        # Count table rows that are missing module attribution
        # A valid row should have: | trap | module | description |
        MISSING=0
        # Extract table rows (lines starting with | but not the header separator |---|)
        while IFS= read -r line; do
          # Skip header separator lines
          if echo "$line" | grep -qE '^\|[-\s|]+\|$'; then
            continue
          fi
          # Count pipe-delimited fields
          FIELDS=$(echo "$line" | awk -F'|' '{print NF-1}')
          if [ "$FIELDS" -lt 3 ]; then
            echo "❌ Missing module column: $line"
            MISSING=$((MISSING + 1))
          fi
        done < <(grep '^|' docs/reference/traps.md)
        if [ "$MISSING" -gt 0 ]; then
          echo "ERROR: $MISSING trap row(s) missing module attribution."
          exit 1
        fi
        echo "OK: All traps have module attribution."

  # Agents consistency check — ensures all referenced AGENTS.md files exist
  # and the module routing table is synchronized with reality.
  agents-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify AGENTS.md references exist
        run: |
          echo "Checking AGENTS.md module references..."
          MISSING=0
          # Extract all internal/*/AGENTS.md and internal/*/CONSTITUTION.md paths
          for ref in $(grep -oE 'internal/[a-zA-Z0-9_-]+/(AGENTS|CONSTITUTION)\.md' AGENTS.md | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "❌ Missing: $ref (referenced in AGENTS.md but not found)"
              MISSING=$((MISSING + 1))
            else
              echo "✅ $ref"
            fi
          done
          # Also verify internal/AGENTS_INDEX.md exists
          if [ ! -f "internal/AGENTS_INDEX.md" ]; then
            echo "❌ Missing: internal/AGENTS_INDEX.md"
            MISSING=$((MISSING + 1))
          else
            echo "✅ internal/AGENTS_INDEX.md"
          fi
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING referenced file(s) missing."
            exit 1
          fi
          echo "All AGENTS.md references are consistent."

  # AGENTS_INDEX vs actual modules — prevents index drift when a new
  # internal/ module is added but not registered in AGENTS_INDEX.md.
  # Model reads the index to route work; a missing entry = hallucination source.
  agents-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check AGENTS_INDEX.md matches actual modules
        run: bash scripts/ci/check_agents_index.sh

  # License check
  license:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check repository licensing policy
      run: |
        if ls LICENSE* >/dev/null 2>&1; then
          echo "Repository license file found:"
          ls LICENSE*
        else
          echo "No repository LICENSE file found."
        fi

        echo "Per-file Go license headers are not enforced by this repository policy."

  # Factor system integrity check (G1-G10)
  factor-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run factor integrity check
      run: bash scripts/ci/verify_factor_integrity.sh

  # Gate 1: Parameter data integrity — catches Save() silently dropping
  # calibration timestamps by checking evidence_quality vs timestamp consistency.
  validate-parameters:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Validate parameters.json integrity
      run: go run ./cmd/validate-parameters

  # Gate 2: Calibration evidence smoke — verifies the real parameters.json
  # has valid calibration timestamps when evidence_quality claims calibration.
  calibration-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Smoke test calibration evidence
      run: go test ./internal/config/ -run TestCalibrationEvidence_Smoke -v -count=1

  # Gate 3: LoadCalibrationEvidence unit tests — covered by the existing
  # coverage job (go test ./... includes ./internal/industry/...).

  # Orphan artifact detection — ensures no compiled binaries, PID files,
  # or coverage reports have been committed.
  check-orphan-artifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check for orphan artifacts in git index
      run: |
        orphans=""
        # Compiled Go binaries (Mach-O/ELF)
        for f in $(git ls-files); do
          if [ -f "$f" ]; then
            ft=$(file "$f" 2>/dev/null)
            case "$ft" in
              *"Mach-O"*|*"ELF"*)
                orphans="$orphans  [BINARY] $f ($(echo "$ft" | head -1))"
                ;;
            esac
          fi
        done
        # PID files
        for f in $(git ls-files '*.pid'); do
          orphans="$orphans  [PID] $f"
        done
        # Coverage output
        for f in $(git ls-files '*.out'); do
          orphans="$orphans  [COVERAGE] $f"
        done
        if [ -n "$orphans" ]; then
          echo "❌ Found orphan artifacts in git index:"
          echo "$orphans"
          echo ""
          echo "These files should be in .gitignore and removed from tracking."
          echo "Run: git rm --cached <file>  (keeps file on disk)"
          exit 1
        fi
        echo "✅ No orphan artifacts found"

  # Frontend smoke — Playwright-based UI check on key pages.
  # Derives target pages from PR diff; falls back to overview+narrative+live+portfolio.
  # Skips (exit 0) if diff doesn't touch any monitored path.
  frontend-smoke:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Validate known-issues.json structure
      run: |
        set -e
        node -e "
        const fs = require('fs');
        const path = 'client_web/smoke/known-issues.json';
        if (!fs.existsSync(path)) { console.error('ERROR: ' + path + ' not found'); process.exit(1); }
        let data;
        try { data = JSON.parse(fs.readFileSync(path, 'utf-8')); } catch (e) { console.error('ERROR: ' + path + ' is not valid JSON: ' + e.message); process.exit(1); }
        const patterns = data.patterns;
        if (!Array.isArray(patterns) || patterns.length === 0) { console.error('ERROR: patterns must be non-empty array'); process.exit(1); }
        for (let i = 0; i < patterns.length; i++) {
          const p = patterns[i];
          if (!p.pattern || typeof p.pattern !== 'string') { console.error('ERROR: pattern[' + i + '] missing or invalid \"pattern\" field'); process.exit(1); }
          if (!p.reason || typeof p.reason !== 'string' || p.reason.trim() === '') { console.error('ERROR: pattern[' + i + '] missing or empty \"reason\" field'); process.exit(1); }
          if (!p.ticket || typeof p.ticket !== 'string' || p.ticket.trim() === '') { console.error('ERROR: pattern[' + i + '] missing or empty \"ticket\" field'); process.exit(1); }
        }
        console.log('OK — ' + patterns.length + ' pattern(s) validated');
        "

    - name: Install Playwright chromium
      working-directory: client_web
      run: npx playwright install --with-deps chromium

    - name: Run frontend smoke
      run: bash scripts/ci/frontend_smoke.sh origin/${{ github.base_ref }}

    - name: Upload atlas smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: atlas-smoke-log
        path: /tmp/atlas-smoke.log
        if-no-files-found: ignore

  # New frontend regression tests (unit + per-app Playwright) introduced with
  # the admin_web / client_web split. Kept separate from smoke so failures are
  # scoped to the new SPAs.
  frontend-tests:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Run shared JS unit tests
      run: node --test shared_web/static/js/__tests__/*.mjs

    # Install browsers from each project's Playwright version. Running
    # `npx playwright` from the repo root resolves to the latest published
    # version, which installs browser binaries incompatible with the pinned
    # @playwright/test versions in admin_web/client_web.
    - name: Install Playwright chromium (admin_web)
      working-directory: admin_web
      run: npm exec playwright install --with-deps chromium

    - name: Install Playwright chromium (client_web)
      working-directory: client_web
      run: npm exec playwright install --with-deps chromium

    - name: Run admin_web E2E tests
      working-directory: admin_web
      run: npm run test:e2e

    - name: Run client_web E2E tests
      working-directory: client_web
      run: npm run test:e2e

  # Data directory naming convention check — validates data/ files follow
  # data-naming-convention.md (R1 snake_case dirs, R2 daily file format,
  # R4 JSONL extension, R6 backup files). Previously only in Makefile;
  # activated in CI per 2026-07-03 pipeline audit.
  data-naming:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check data naming conventions
      run: bash scripts/ci/check_data_naming.sh

  # Data catalog freshness check — ensures data-catalog.md entries
  # match actual data/ files on disk. --warn-only during probation;
  # TODO(2026-07-17): escalate to hard fail after 2-week observation window.
  # Previously dead code; activated per 2026-07-03 pipeline audit.
  data-catalog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check data catalog freshness
      run: bash scripts/ci/check_data_catalog.sh --warn-only

  # Port reference consistency check — ensures no file references
  # legacy 8080/8081 ports that should be 18080/18081 (see
  # internal/constants/port.go). Promoted from --warn-only to
  # hard fail after PR #958 cleaned up all 31 remaining violations
  # (strict mode now passes on main; any future drift breaks CI).
  doc-ports:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check port references against constants/port.go
      run: bash scripts/ci/check_doc_ports.sh

