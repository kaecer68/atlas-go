  #     continue-on-error: true

  cleanup:
    runs-on: ubuntu-latest
    needs: [darwinian-adjust, prism-maintenance, reflexivity-analysis, swarm-simulation]
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: actions/delete-artifact@v4
      with:
        name: |
          darwinian-report
          prism-report
          reflexivity-report
          swarm-results
      continue-on-error: true
