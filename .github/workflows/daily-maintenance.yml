name: Daily Maintenance

on:
  schedule:
    # Run daily at 9 AM UTC+8 (1 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 2026-09-26（E21）：本 workflow 的三個 job 原本每天呼叫 7 個**不存在**的 atlas CLI 子命令
# （`weights adjust --apply`、`weights report`、`prism status/balance/report`、
# `reflexivity report/alert`）。CLI（cmd/atlas/main.go）當時只認位置子命令 `prism worker`，
# 其餘 positional args 一律**靜默丟棄**並落到預設的 one-shot simulation ⇒ 七個命令全部
# exit 0、三個 artifact 永遠是空的（「每天都綠、什麼都沒做」）。同一 PR 已在 CLI 端硬化：
# 無法識別的位置參數 ⇒ 印 usage 並以 exit 2 結束，因此那些呼叫現在會**大聲失敗**而不是 no-op。
#
# 語意修正（換成真實來源，而不是把紅燈關掉）：那些報告的真實生產者一直是 **daemon 內的背景
# 任務**（`prism_training` 6h、`prism_auto_balancer` 5m、`auto_daily_simulation`、
# `evolution_health`；見 internal/apigateway/background.go 與 cmd/atlas/main.go 的 BTM 註冊）。
# 三個 job 因此改為向 daemon **對外公開**的活性端點取得訊號
# （GET /api/dashboard/task-liveness；`/api/dashboard/` 在 public-read 白名單內 ⇒ 免 API key，
# 由 GitHub-hosted runner 直接查詢），並對「自己領域的必要任務」做真實斷言。
# 為什麼要外部 vantage point：daemon 自己的 staleness 告警（internal/liveness/staleness.go
# → alertmanager → Telegram）與被監控對象同生共死；GitHub runner 是唯一的局外觀察者，
# 「整台主機／tunnel／daemon 掛掉」時仍會留下紅燈與 artifact。
#
# fail-closed 不變：#2029 移除的 `|| true` 與 `if-no-files-found: error` 全部保留；
# 抓不到快照（連線失敗／非 200／JSON 壞／`status=degraded`／`tasks` 為空）一律 exit 2，
# 並且**不寫** artifact —— 看不到快照不得等於綠燈。
#
# 三個 job 不再需要 Node／Go toolchain（原本為了跑「什麼都沒做」的 CLI 而 build 前端＋binary）。

jobs:
  darwinian-adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # Darwinian 權重的真實來源 = 每日 auto simulation（internal/orchestrator/system.go 在
    # session 收盤時 RecordOutcomeAt → PerformDailyAdjustment → Save → AppendSnapshot）
    # 加上 evolution loop 的健康檢查（evolution_health，proposal/judge/promote/revert 四柱）。
    # CI 端**不再**自己「跑一次調整」——那條路徑（scripts/darwinian_adjust.sh）已於組態層退役。
    - name: "Darwinian maintenance tasks are alive (real source: daemon task-liveness)"
      env:
        # 可選覆蓋；空字串 ⇒ 檢查腳本回退到內建的生產端點常數。
        ATLAS_TASK_LIVENESS_URL: ${{ vars.ATLAS_TASK_LIVENESS_URL }}
      run: |
        bash scripts/ci/check_task_liveness.sh \
          --label darwinian \
          --tasks auto_daily_simulation,evolution_health \
          --artifact reports/darwinian_liveness.json \
          --summary-file "${GITHUB_STEP_SUMMARY:-}"

    - name: Upload weights report
      uses: actions/upload-artifact@v4
      with:
        name: darwinian-report
        path: reports/darwinian_*.json
        # 2026-09-26：原本沒有 if-no-files-found（預設 = warn）＋ 步驟層 continue-on-error: true
        # ⇒「報告產不出來」只是一個 warning，job 照樣綠。實測（真實 run 36222354977）該步每次都印
        #   `##[warning]No files were found with the provided path: reports/darwinian_*.json`
        # 現維持 fail-closed：if-no-files-found: error（用真的 actions/upload-artifact@v4 程式碼
        # 在本機 A/B 實測：warn ⇒ node exit 0；error ⇒ node exit 1），且沒有步驟層 continue-on-error。
        if-no-files-found: error

    # 2026-10-01（A 案，業主定案）：cron 任務的存活監控。daemon 自己的 staleness 告警對 cron row
    # **永遠不會響**：internal/liveness/staleness.go 的 CheckOnce 對「不在 BackgroundTaskManager
    # 的 row」直接 continue，且 cron row 沒有 interval ⇒ IsStale 的 `interval <= 0` 分支回 false。
    # 實測 2026-10-01（/api/dashboard/task-liveness：114 tasks、stale_count=0）：
    #   cron_quote_backfill → consecutive_failures=8（last_error: exit code 1）
    #   cron_c07_evaluate   → consecutive_failures=6（last_error: exit code 2）
    # 兩者在全站**0 告警**。A 案＝不改 Go、不加空轉的 Prometheus rule，改由本 job
    # （GitHub runner 是唯一的外部 vantage point）把「正確行為」釘死：
    #   (a) HTTP 200；(b) 頂層 stale_count == 0；
    #   (c) 任何 cron_* 任務 consecutive_failures > 0 ⇒ exit 1（補上缺失的那個告警）；
    #   (d) 任何 cron_* 任務出現 interval 欄位 ⇒ exit 1（＝它變成可判 stale 了）。
    # 為什麼 (d) 看的是「interval 這個鍵」：internal/monitoring/api/dashboard/handlers.go 的
    # `Interval string json:"interval,omitempty"` 只在該 row 被併入 BTM runtime 狀態時才有值
    # （cron-only row 不帶這個鍵）⇒ 鍵一出現，該任務就離開「ping-only」世界、開始受
    # interval×3（或 gate window）staleness 判定，必須先有 metric + rule 或明確排除。
    #
    # ⚠️ 本步驟刻意**不**呼叫 scripts/ci/check_task_liveness.sh：tests/scripts/test-check-task-liveness.sh
    #    以精確計數釘住「三個 job 各呼叫一次」。改在步驟內用 curl + python3 stdlib 斷言
    #    （不新增相依，也不動既有 gate 的參數）。
    # 放在第一個 job 的**最後**一步：artifact 先上傳（失敗不影響它），且只跑一次而非三個 job 各一次。
    - name: "Cron tasks: no consecutive failures and still staleness-ineligible"
      env:
        # 與上面三個 job 用同一個端點來源（空字串 ⇒ 回退內建生產常數，見 check_task_liveness.py）。
        ATLAS_TASK_LIVENESS_URL: ${{ vars.ATLAS_TASK_LIVENESS_URL }}
      run: |
        set -euo pipefail
        url="${ATLAS_TASK_LIVENESS_URL:-https://atlas.goluck.uk/api/dashboard/task-liveness}"
        snapshot="$(mktemp)"
        rc=0
        code="$(curl -fsS --max-time 30 -H 'Accept: application/json' -o "$snapshot" -w '%{http_code}' "$url")" || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::error::cron liveness: cannot fetch ${url} (curl rc=${rc}) — 看不到快照不得等於綠燈"
          exit 1
        fi
        export CRON_LIVENESS_URL="$url"
        export CRON_LIVENESS_HTTP_CODE="$code"
        export CRON_LIVENESS_SNAPSHOT="$snapshot"
        python3 - <<'PY'
        import json
        import os
        import sys

        url = os.environ["CRON_LIVENESS_URL"]


        def fail(message):
            print(f"::error::{message}")
            print(f"CRON LIVENESS CONTRACT FAILED: {message}", file=sys.stderr)
            sys.exit(1)


        http_code = os.environ["CRON_LIVENESS_HTTP_CODE"]
        if http_code != "200":
            fail(f"task-liveness returned HTTP {http_code} (expected 200) from {url}")

        try:
            with open(os.environ["CRON_LIVENESS_SNAPSHOT"], encoding="utf-8") as handle:
                snapshot = json.load(handle)
        except (OSError, ValueError) as exc:
            fail(f"cannot read/parse the task-liveness snapshot from {url}: {exc}")

        tasks = snapshot.get("tasks")
        if not isinstance(tasks, list) or not tasks:
            fail(f"snapshot from {url} contains no tasks — an empty snapshot must never be treated as healthy")

        stale_count = snapshot.get("stale_count")
        if stale_count != 0:
            fail(f"stale_count={stale_count!r} (expected 0) — at least one task is overdue")

        crons = [t for t in tasks if isinstance(t, dict) and str(t.get("name", "")).startswith("cron_")]
        if not crons:
            fail("no cron_* task in the snapshot — the cron liveness contract would be vacuous "
                 "(cron rows vanished, were renamed, or the store was wiped)")

        failing = []
        eligible = []
        for task in crons:
            name = task["name"]
            raw = task.get("consecutive_failures") or 0
            try:
                failures = int(raw)
            except (TypeError, ValueError):
                fail(f"{name}: consecutive_failures is not an integer: {raw!r}")
            if failures > 0:
                detail = f"{name}: consecutive_failures={failures}"
                if task.get("last_error"):
                    detail += f" (last_error: {task['last_error']})"
                failing.append(detail)
            # (d) 不變式：出現 interval 鍵 ⇒ 這個 cron row 已被併入 BTM runtime 狀態 ⇒ 可判 stale。
            if "interval" in task:
                eligible.append(f"{name}: interval={task['interval']!r}")

        print(f"cron liveness probe: source={url} generated_at={snapshot.get('generated_at', 'unknown')} "
              f"total={snapshot.get('total')} stale_count={stale_count} cron_tasks={len(crons)}")
        for task in crons:
            print(f"  [cron] {task['name']}: consecutive_failures={task.get('consecutive_failures', 0)} "
                  f"interval={task.get('interval', '-')} last_success_at={task.get('last_success_at', '-')}")

        if failing:
            for detail in failing:
                print(f"  FAIL {detail}")
            fail(f"{len(failing)} cron task(s) with consecutive_failures > 0 "
                 f"(the daemon-side staleness alert cannot flag these): " + "; ".join(failing))

        if eligible:
            fail("cron task is now staleness-eligible — add a metric+rule (or explicitly exclude) "
                 "before enabling; see liveness/staleness.go: " + "; ".join(eligible))

        print(f"PASS: {len(crons)} cron task(s) healthy and staleness-ineligible "
              f"(0 consecutive failures, no interval field)")
        PY

  prism-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # PRISM 的真實來源 = daemon 的 `prism_training`（6h，replay-backed executor 產 cohort 指標）
    # 與 `prism_auto_balancer`（5m，PRISM 佇列再平衡）。CI 端原本呼叫的
    # `prism status/balance/report` 子命令從未存在（`prism worker` 才是唯一支援的位置子命令）。
    - name: "PRISM maintenance tasks are alive (real source: daemon task-liveness)"
      env:
        ATLAS_TASK_LIVENESS_URL: ${{ vars.ATLAS_TASK_LIVENESS_URL }}
      run: |
        bash scripts/ci/check_task_liveness.sh \
          --label prism \
          --tasks prism_training,prism_auto_balancer \
          --artifact reports/prism_liveness.json \
          --summary-file "${GITHUB_STEP_SUMMARY:-}"

    - name: Upload PRISM report
      uses: actions/upload-artifact@v4
      with:
        name: prism-report
        path: reports/prism_*.json
        # 同上：維持 if-no-files-found: error（fail-closed），無步驟層 continue-on-error。
        if-no-files-found: error

  reflexivity-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # Reflexivity 的真實來源 = 每日 auto simulation：internal/orchestrator/composition.go
    # 的 buildSimEngine 掛上 5 條 reflexivity 規則（PriceToFundamentals / PnLBehavior /
    # NarrativeFlows / MarketPolicy / ReversalDetection），由 internal/sim/engine.go 在每次
    # 交易前套用。`reflexivity report/alert` 子命令從未存在；真正的分析在每日模擬內完成，
    # 所以本 job 斷言的是「產出該分析的那個任務還活著」。
    # （artifact 用 .md：本 job 的 upload glob 是 reports/reflexivity_*.md。）
    - name: "Reflexivity-producing simulation task is alive (real source: daemon task-liveness)"
      env:
        ATLAS_TASK_LIVENESS_URL: ${{ vars.ATLAS_TASK_LIVENESS_URL }}
      run: |
        bash scripts/ci/check_task_liveness.sh \
          --label reflexivity \
          --tasks auto_daily_simulation \
          --artifact reports/reflexivity_liveness.md \
          --summary-file "${GITHUB_STEP_SUMMARY:-}"

    - name: Upload Reflexivity report
      uses: actions/upload-artifact@v4
      with:
        name: reflexivity-report
        path: reports/reflexivity_*.md
        # 同上：維持 if-no-files-found: error（fail-closed），無步驟層 continue-on-error。
        if-no-files-found: error

  cleanup:
    runs-on: ubuntu-latest
    needs: [darwinian-adjust, prism-maintenance, reflexivity-analysis]
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifactNames = [
            'darwinian-report',
            'prism-report',
            'reflexivity-report',
          ];
          const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
            per_page: 100,
          });
          for (const artifact of artifacts) {
            if (artifactNames.includes(artifact.name)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (id=${artifact.id})`);
            }
          }
      continue-on-error: true
