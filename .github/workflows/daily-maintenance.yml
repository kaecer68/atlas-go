name: Daily Maintenance

on:
  schedule:
    # Run daily at 9 AM UTC+8 (1 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  darwinian-adjust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Darwinian Adjustment
      env:
        ATLAS_ENV: production
        ATLAS_DATA_DIR: ./data
      run: |
        # 2026-09-26: 原本每個維護命令都接 `|| true` ⇒ 任一失敗都不會讓 step/job 變紅
        # （同族「靜默失效」，見 #1944 / #2009）。實測：run 36222354977 的這一步是
        # success，但 3 個報告 artifact 全部沒產生
        # （log: `No files were found with the provided path: reports/darwinian_*.json`），
        # 且連續 3 次 run 的 artifacts total_count = 0 ⇒「每天都綠、什麼都沒做」。
        # 現改為 fail-closed：命令非 0 ⇒ 步驟紅燈（真實訊號，不再吞）。
        ./atlas-go weights adjust --apply
        ./atlas-go weights report

    - name: Upload weights report
      uses: actions/upload-artifact@v4
      with:
        name: darwinian-report
        path: reports/darwinian_*.json
      continue-on-error: true

  prism-maintenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: PRISM Daily Tasks
      env:
        ATLAS_ENV: production
      run: |
        # 同上：取消 `|| true`（fail-closed）。
        ./atlas-go prism status
        ./atlas-go prism balance
        ./atlas-go prism report

    - name: Upload PRISM report
      uses: actions/upload-artifact@v4
      with:
        name: prism-report
        path: reports/prism_*.json
      continue-on-error: true

  reflexivity-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Reflexivity Analysis
      env:
        ATLAS_ENV: production
      run: |
        # 同上：取消 `|| true`（fail-closed）。
        ./atlas-go reflexivity report
        ./atlas-go reflexivity alert

    - name: Upload Reflexivity report
      uses: actions/upload-artifact@v4
      with:
        name: reflexivity-report
        path: reports/reflexivity_*.md
      continue-on-error: true

  cleanup:
    runs-on: ubuntu-latest
    needs: [darwinian-adjust, prism-maintenance, reflexivity-analysis]
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifactNames = [
            'darwinian-report',
            'prism-report',
            'reflexivity-report',
          ];
          const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
            per_page: 100,
          });
          for (const artifact of artifacts) {
            if (artifactNames.includes(artifact.name)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (id=${artifact.id})`);
            }
          }
      continue-on-error: true
