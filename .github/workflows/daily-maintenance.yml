name: Daily Maintenance

on:
  schedule:
    # Run daily at 9 AM UTC+8 (1 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  GO_VERSION: '1.21'

jobs:
  # Darwinian Weights Adjustment
  darwinian-adjust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Darwinian Adjustment
      env:
        ATLAS_ENV: production
        ATLAS_DATA_DIR: ./data
      run: |
        ./atlas-go weights adjust --apply
        ./atlas-go weights report

    - name: Upload weights report
      uses: actions/upload-artifact@v4
      with:
        name: darwinian-report
        path: reports/darwinian_*.json

  # PRISM Queue Maintenance
  prism-maintenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: PRISM Daily Tasks
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go prism status
        ./atlas-go prism balance
        ./atlas-go prism report

    - name: Upload PRISM report
      uses: actions/upload-artifact@v4
      with:
        name: prism-report
        path: reports/prism_*.json

  # Reflexivity Analysis
  reflexivity-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Reflexivity Analysis
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go reflexivity report
        ./atlas-go reflexivity alert

    - name: Upload Reflexivity report
      uses: actions/upload-artifact@v4
      with:
        name: reflexivity-report
        path: reports/reflexivity_*.md

  # MiroFish Swarm Simulation
  swarm-simulation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Swarm Simulation
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go swarm init
        ./atlas-go swarm run --duration=30m
        ./atlas-go swarm report
        ./atlas-go swarm export

    - name: Upload Swarm results
      uses: actions/upload-artifact@v4
      with:
        name: swarm-results
        path: |
          reports/swarm_*.md
          data/swarm/*.json

  # Meta-Learning Adaptation
  meta-learning:
    runs-on: ubuntu-latest
    needs: [swarm-simulation]
    steps:
    - uses: actions/checkout@v4

    - name: Download Swarm Results
      uses: actions/download-artifact@v4
      with:
        name: swarm-results
        path: ./data/swarm

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Meta-Learning Adaptation
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go metalearning evolve
        ./atlas-go metalearning report

    - name: Upload Meta-Learning report
      uses: actions/upload-artifact@v4
      with:
        name: metalearning-report
        path: reports/metalearning_*.json

  # Cleanup Old Reports
  cleanup:
    runs-on: ubuntu-latest
    needs: [darwinian-adjust, prism-maintenance, reflexivity-analysis, swarm-simulation]
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: geekyeggo/delete-artifact@v2
      with:
        name: |
          darwinian-report
          prism-report
          reflexivity-report
          swarm-results
          metalearning-report
        failOnError: false
