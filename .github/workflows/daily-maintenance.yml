name: Daily Maintenance

on:
  schedule:
    # Run daily at 9 AM UTC+8 (1 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  darwinian-adjust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Darwinian Adjustment
      env:
        ATLAS_ENV: production
        ATLAS_DATA_DIR: ./data
      run: |
        ./atlas-go weights adjust --apply || true
        ./atlas-go weights report || true

    - name: Upload weights report
      uses: actions/upload-artifact@v4
      with:
        name: darwinian-report
        path: reports/darwinian_*.json
      continue-on-error: true

  prism-maintenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: PRISM Daily Tasks
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go prism status || true
        ./atlas-go prism balance || true
        ./atlas-go prism report || true

    - name: Upload PRISM report
      uses: actions/upload-artifact@v4
      with:
        name: prism-report
        path: reports/prism_*.json
      continue-on-error: true

  reflexivity-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -o atlas-go ./cmd/atlas

    - name: Run Reflexivity Analysis
      env:
        ATLAS_ENV: production
      run: |
        ./atlas-go reflexivity report || true
        ./atlas-go reflexivity alert || true

    - name: Upload Reflexivity report
      uses: actions/upload-artifact@v4
      with:
        name: reflexivity-report
        path: reports/reflexivity_*.md
      continue-on-error: true

  cleanup:
    runs-on: ubuntu-latest
    needs: [darwinian-adjust, prism-maintenance, reflexivity-analysis]
    if: always()
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifactNames = [
            'darwinian-report',
            'prism-report',
            'reflexivity-report',
          ];
          const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
            per_page: 100,
          });
          for (const artifact of artifacts) {
            if (artifactNames.includes(artifact.name)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (id=${artifact.id})`);
            }
          }
      continue-on-error: true
