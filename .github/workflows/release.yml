name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Create Release
  # 2026-07-10: 加上 permissions: contents: write — softprops/action-gh-release
  # 需要寫權限才能建立 release。前一版沒寫, 在新 repo 預設 GITHUB_TOKEN
  # 是 contents: read, 會 silently fail。詳見 PR #1067 (hermes onboarding)。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## Atlas-Go Release ${{ github.ref }}

          ### Features
          - Phase 2: Darwinian Weights, Superinvestor Layer
          - Phase 3: Agent Spawning, PRISM, Soros Reflexivity
          - Phase 4: Meta-Learning, Adversarial Training, Global Markets, Real-Time Adaptation

          ### Installation
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ```

          ### atlas-mcp (for AI agents like Hermes / OpenClaw / Claude Desktop)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-atlas-mcp-from-release.sh | bash
          ```

          ### Changelog
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.

  # Build atlas (main server) binaries
  # 2026-07-10: rename from build-binaries (加上 atlas 前綴, 與新加的
  # build-atlas-mcp-binaries job 區分); 加 permissions: contents: write
  build-atlas-binaries:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        output_name="atlas-go-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          output_name="${output_name}.exe"
        fi
        # main.version 保持向後相容;internal/buildinfo.* 為 §11.4 runtime
        # parity 主來源(CF-INV-12)。切勿移除 main.version。
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }} \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Version=${{ github.ref_name }} \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Commit=${{ github.sha }} \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o ${output_name} ./cmd/atlas
        tar czvf "${output_name}.tar.gz" ${output_name}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        files: |
          atlas-go-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  # Build atlas-mcp (MCP server for AI agents) binaries
  # 2026-07-10: NEW job (PR #1067). 投資人 hermes/openclaw agent 用,
  # 不需 Go toolchain 或 source tree。詳見 scripts/install-atlas-mcp-from-release.sh
  # 與 docs/mcp-integration-local.md。
  #
  # 為何不用 matrix: checksums.txt 必須包含所有平台的 binary, matrix 跑會
  # 各自產生一份 (覆蓋問題)。改用 sequential build 5 平台, 最後一次
  # sha256sum 產出完整 checksums.txt。
  build-atlas-mcp-binaries:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Build all platforms + generate checksums.txt
      run: |
        set -e
        PLATFORMS=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")
        for platform in "${PLATFORMS[@]}"; do
          goos="${platform%/*}"
          goarch="${platform#*/}"
          output="atlas-mcp-${goos}-${goarch}"
          if [ "$goos" = "windows" ]; then
            output="${output}.exe"
          fi
          echo "  building ${platform} -> ${output}.tar.gz"
          # main.version 保持向後相容;internal/buildinfo.* 為 §11.4 runtime
          # parity 主來源(CF-INV-12)。切勿移除 main.version。
          GOOS="$goos" GOARCH="$goarch" go build -ldflags="-s -w -X main.version=${{ github.ref_name }} \
            -X github.com/kaecer68/atlas-go/internal/buildinfo.Version=${{ github.ref_name }} \
            -X github.com/kaecer68/atlas-go/internal/buildinfo.Commit=${{ github.sha }} \
            -X github.com/kaecer68/atlas-go/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$output" ./cmd/atlas-mcp
          tar czvf "${output}.tar.gz" "$output"
          rm -f "$output"
        done
        echo ""
        echo "Generating checksums.txt..."
        sha256sum atlas-mcp-*.tar.gz > checksums.txt
        cat checksums.txt

    - name: Upload Release Assets (atlas-mcp binaries + checksums)
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        files: |
          atlas-mcp-*.tar.gz
          checksums.txt

  # Publish Docker Image
  publish-docker:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}:latest
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Update Documentation
  update-docs:
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Update version in README
      run: |
        sed -i "s/version-[0-9]\+.[0-9]\+.[0-9]\+/version-${{ github.ref_name }}/g" README.md

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "Update version badge to ${{ github.ref_name }}" || true
        git push || true
