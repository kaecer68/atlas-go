name: Nightly Calibration Refresh + Integrity Check

on:
  schedule:
    # 02:00 UTC+8 = 18:00 UTC (after US market close, before Asia open)
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 本 workflow 的判定性（issue #1944 Batch 4, item I31）：
#   舊寫法用 `set +e` + 非最終的 `cat` 取值，且 Slack 步驟在 SLACK_WEBHOOK_URL 未設時
#   `exit 0` ⇒ step 恆 success、零告警，失敗（含 cmd/calibration-validate 實跑 OK=false / exit 1）
#   永遠不會被看見。
#   現在：①step 的 exit code 就是 atlas-validate 的 exit code（不再被吞）；
#         ②觀測級發現（freshness + 已知 by-design）用 GitHub annotation 標成 warning；
#         ③錯誤級發現用 `::error::` annotation，且 exit 1 讓 job 真的紅 →
#           零設定（不用 Slack webhook）就有告警；
#         ④Slack 仍為選配，未設定時改發 annotation 而非靜默跳過。
#
#   freshness 政策（Batch 4 決定）：**CI 只驗結構**（--policy=configs/calibration-validation-policy.json，
#   scope=structure）。理由：CI 驗的是 checkout 帶進來的 configs/parameters.json，其 updated_at
#   結構上不可能落在 max-age 內（I30：backfill 在 runner 內寫入的結果會被丟棄）。freshness 必須在
#   檔案真的被刷新的地方檢查，即 production 主機：
#       atlas-validate --path=configs/parameters.json --max-age=48h --format=json
#   該命令的 exit 1 必須被 production 監控接到（見 docs/specs/industry-allocation-inert-audit-20260924.md §10）。

jobs:
  backfill-and-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
      with:
        node-version: '22'

    - name: Build frontends
      run: bash scripts/ci/build_all_frontends.sh

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build backfill binary
      run: go build -o atlas-backfill ./cmd/backfill-industry-tree

    - name: Run industry-tree backfill (best-effort)
      id: backfill
      env:
        ATLAS_ENV: production
        ATLAS_DATA_DIR: ./data
      # No `|| echo`: swallowing the failure here made steps.backfill.outcome
      # permanently 'success'. `continue-on-error` already keeps the job going,
      # and the outcome is now truthful (annotated in the next step).
      run: ./atlas-backfill
      continue-on-error: true

    - name: Annotate backfill outcome
      if: always() && steps.backfill.outcome != 'success'
      run: |
        echo "::warning::industry-tree backfill did not succeed (outcome=${{ steps.backfill.outcome }}); the integrity check below therefore reads the checked-out configs/parameters.json unchanged (see issue #1944 I30 — this job cannot persist a refresh)."

    - name: Build validation binary
      run: go build -o atlas-validate ./cmd/calibration-validate

    - name: Run post-backfill integrity check
      id: validate
      run: |
        # Capture the real exit code of atlas-validate. Never read `$?` after a
        # pipeline: that reports the last command's status and turns a failure
        # into a false green.
        status=0
        ./atlas-validate \
          --path=configs/parameters.json \
          --policy=configs/calibration-validation-policy.json \
          --format=json > validate-result.json || status=$?

        cat validate-result.json || true

        # A missing/unparsable verdict must fail the step: the `?` below would
        # otherwise degrade to "no annotations".
        if ! jq -e '.Findings' validate-result.json > /dev/null 2>&1; then
          echo "::error::validate-result.json has no Findings — atlas-validate did not produce a usable verdict (exit=$status)"
          exit 1
        fi

        # Accepted/observational findings stay visible in the Actions UI without
        # a configured webhook. NOTE the key is `Findings` (capital F): that field
        # carries no json tag, unlike the lowercase `scope` / `error_count` /
        # `observation_count` siblings.
        jq -r '.Findings[]? | select(.severity=="observation")
               | "::warning::[" + .code + "]" + (if .segment then " segment=" + .segment else "" end) + " " + .message' \
          validate-result.json || true
        jq -r '.Findings[]? | select(.severity=="error")
               | "::error::[" + .code + "]" + (if .segment then " segment=" + .segment else "" end) + " " + .message' \
          validate-result.json || true

        if [ "$(jq -r '.OK' validate-result.json 2>/dev/null)" != "true" ]; then
          echo "::error::calibration validation failed with unexpected findings (scope=$(jq -r '.scope' validate-result.json 2>/dev/null), errors=$(jq -r '.error_count' validate-result.json 2>/dev/null)); full result is attached as the nightly-calibration-validation artifact"
        fi

        exit "$status"

    - name: Upload validation result artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-calibration-validation
        path: validate-result.json
        retention-days: 30

    # Slack is optional. When SLACK_WEBHOOK_URL is unset the failure is still
    # visible: the failing step above turns the job red and the ::error::
    # annotation is rendered on the run summary. Previously this step `exit 0`d
    # silently, which is why a failing validate produced zero alerts.
    - name: Slack alert on failure
      if: always() && (steps.validate.outcome != 'success' || steps.backfill.outcome != 'success')
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "::warning::SLACK_WEBHOOK_URL not configured; nightly alert delivered as GitHub annotations only (validate=${{ steps.validate.outcome }}, backfill=${{ steps.backfill.outcome }})"
          exit 0
        fi
        payload=$(jq -nc \
          --arg text ":warning: Nightly calibration validation failed" \
          --argjson details "$(cat validate-result.json 2>/dev/null || echo '{}')" \
          '{text: $text, attachments: [{color: "warning", fields: [{title: "Details", value: ($details | tostring), short: false}]}]}')
        curl -sf -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || echo "Slack POST failed (non-blocking)"
