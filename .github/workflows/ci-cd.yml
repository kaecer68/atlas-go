name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  merge_group:
    types: [ checks_requested ]
  release:
    types: [ created ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  # Frontend build (reusable) — builds admin_web + client_web once,
  # uploads dist artifacts. Downstream jobs download instead of rebuilding.
  # Skipped for documentation-only changes.
  frontend-build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_frontend-build.yml
    permissions:
      contents: read
      actions: write

  # Build and Test
  build:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Persistence format check
      run: go run ./cmd/check-persistence-format -dir data/state

    - name: Test (excluding cmd/atlas — heavy integration, separate job)
      run: go test -v -race -coverprofile=coverage.out -coverpkg=./... $(go list ./... | grep -v '/cmd/atlas$')

    - name: Check coverage threshold (≥ 60%)
      run: |
        # 空值/非數字必須明確 FAIL（不依賴 awk 對空字串的比較語意）— issue #2009
        set -euo pipefail
        COV_TMP="${RUNNER_TEMP:-/tmp}"
        if [ ! -s coverage.out ]; then
          echo "::error::取不到覆蓋率：coverprofile 缺失或為空（coverage.out）— 測試失敗或未產生覆蓋率"
          exit 1
        fi
        if ! go tool cover -func=coverage.out > "${COV_TMP}/coverage-func.log" 2>&1; then
          echo "::error::取不到覆蓋率：go tool cover 解析失敗（log: ${COV_TMP}/coverage-func.log）"
          tail -n 20 "${COV_TMP}/coverage-func.log"
          exit 1
        fi
        COVERAGE=$(awk '/^total:/ {print $3}' "${COV_TMP}/coverage-func.log" | tr -d '\r' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        case "${COVERAGE}" in
          ''|*[!0-9.]*)
            echo "::error::取不到覆蓋率：COVERAGE 非數字（${COVERAGE}）"
            exit 1
            ;;
        esac
        if awk -v c="${COVERAGE}" 'BEGIN{exit !(c+0 < 60)}'; then
          echo "::error::Coverage ${COVERAGE}% is below 60% threshold"
          exit 1
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # cmd/atlas tests spin up full SystemCore with real providers (TWSE, GDELT, etc.)
  # — needs 20min timeout, no -race (race detector makes goroutine cleanup stall)
  test-cmd-atlas:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build cmd/atlas
      run: go build ./cmd/atlas/...

    - name: Test cmd/atlas (20min timeout, no -race)
      run: go test -v -timeout=20m ./cmd/atlas/...

    - name: Test cmd/atlas-mcp-setup integration (mock backend)
      # 2026-07-10: PR #1066 (Finding #4 follow-up). Build tag `integration`
      # gates this so regular `go test ./...` does not spawn subprocesses.
      # Uses newline-delimited JSON-RPC (the go-mcp SDK's stdio framing);
      # mock backend via httptest.NewServer (no external services needed).
      run: go test -v -tags=integration -timeout=60s ./cmd/atlas-mcp-setup/

  # Lint
  lint:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: v2.12.2
        args: --timeout=5m
        # PR diff for this branch is >20k lines, which breaks the action's
        # only-new-issues patch fetch. Run the full linter instead.
        only-new-issues: false

  # Generate — Verify auto-generated files are up-to-date.
  # Runs go generate for both gentags (field_types.ts / valid_fields.json)
  # and atlas-mcp descgen (auto-desc.gen.json / auto-desc.gen.go).
  # If generation produces a diff, the job fails to signal drift.
  # Skipped for documentation-only changes.
  generate:
    needs: [frontend-build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Generate field_types.ts and valid_fields.json
      run: go generate ./...

    - name: Generate MCP auto-desc
      run: go generate ./cmd/atlas-mcp/...

    - name: Check for drift
      run: |
        if ! git diff --exit-code; then
          echo "::error:: Generated files are out of date. Run 'go generate ./...' and commit the changes."
          git diff --stat
          exit 1
        fi

  # AGENTS.md doc drift check — verifies all internal/*/AGENTS.md file:line
  # references point to real files/lines. Catches drift introduced by code
  # refactors without updating the corresponding AGENTS.md documentation.
  agents-md-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run agents.md drift check
      run: bash scripts/ci/check_agents_md_drift.sh

  # PG migration SQL static gate — catches unquoted PostgreSQL reserved words
  # (window/user/order/...) and bare REAL column types before they reach
  # production. No database service needed; always runs (never skipped).
  db-migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check migration SQL for reserved words and bare REAL
      run: bash scripts/ci/check-migration-sql.sh

  # Security Scan
  security:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run Gosec Security Scanner
      uses: securego/gosec@de65614d10a6b84029e3e1215567b8ce7e490f23 # master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
      continue-on-error: true
      with:
        sarif_file: results.sarif

  # Docs-only gate — aggregates the CI checks that must pass for documentation
  # and manifest-only PRs where heavy build/test/lint jobs are skipped.
  # Branch protection should require this job instead of (or in addition to)
  # the individual heavy jobs.
  docs-only-gate:
    runs-on: ubuntu-latest
    needs: [release-check, commitlint, governance, operations, agents-md-drift, security, routes, contracts]
    if: always()
    steps:
    - name: Gate decision
      run: |
        # Skipped is acceptable for docs-only PRs; only failure/cancelled blocks.
        RESULTS=(
          "release-check:${{ needs.release-check.result }}"
          "commitlint:${{ needs.commitlint.result }}"
          "governance:${{ needs.governance.result }}"
          "operations:${{ needs.operations.result }}"
          "agents-md-drift:${{ needs.agents-md-drift.result }}"
          "security:${{ needs.security.result }}"
          "routes:${{ needs.routes.result }}"
          "contracts:${{ needs.contracts.result }}"
        )
        FAILED=0
        for entry in "${RESULTS[@]}"; do
          job="${entry%%:*}"
          result="${entry##*:}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::$job result=$result"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "❌ Docs-only gate: BLOCKED"
          exit 1
        fi
        echo "✅ Docs-only gate: PASSED"

  # Build Docker Image
  docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build, lint]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short

    - name: Set build metadata
      id: build_meta
      run: |
        echo "version=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "buildtime=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
        echo "gitcommit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.build_meta.outputs.version }}
          BUILDTIME=${{ steps.build_meta.outputs.buildtime }}
          GIT_COMMIT=${{ steps.build_meta.outputs.gitcommit }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/

  # Integration Tests
  # Use paths-filter to skip heavy service containers (postgres+redis) for
  # PRs that don't touch the database layer, and to skip heavy build/test/lint
  # jobs for PRs that only touch documentation/markdown.
  #
  # Scope contract (2026-08-23, CI quality fix — PR #1666 regression):
  # the `integration` filter decides WHEN this job runs (db-layer changes),
  # while the run step executes the full suite with `-tags=integration`.
  # Real-data tests must therefore be deterministic in BOTH worlds:
  #   - real-data tests (e.g. internal/marketdata sector_index RealFixture)
  #     are gated behind `//go:build integration` so normal `go test ./...`
  #     never compiles them, and they SKIP (never fail) when the repo-root
  #     fixture is absent — no parent-of-checkout probing, which is what
  #     made the old test pick up CI workspace leftovers and fail PRs that
  #     only touched internal/repository.
  #   - any new environment-dependent test must either carry the integration
  #     build tag or skip deterministically; never probe outside the repo
  #     root for gitignored runtime data.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      id: filter
      with:
        filters: |
          code:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - 'cmd/**'
            - 'internal/**'
            - 'pkg/**'
            - 'migrations/**'
            - '**/*.sql'
            - 'Dockerfile*'
            - 'docker-compose*'
            - 'Makefile'
            - 'scripts/**'
            - '.github/workflows/**'
          docs_only:
            - 'docs/**'
            - '*.md'
            - '.github/**/*.md'
          integration:
            - 'internal/db/**'
            - 'internal/repository/**'
            # `internal/storage/**` 於 2026-10-16（FU-20261015-01 反向清理）移除：該目錄**沒有任何** gated 測試檔，
            # 且以 `go list -deps -test -tags=integration` 對 25 個 gated 套件量測 ⇒ **0/25** 個依賴閉包
            # 內含它（相對：`internal/testdb` 19/25、`internal/config` 17/25 ⇒ 兩者保留）。
            # 留著只是讓 storage-only PR 多跑一趟 ~14 分鐘（實測 806s）的 integration suite。
            - 'internal/ledger/**'
            - 'internal/liveness/**'
            - 'internal/testdb/**'
            - 'internal/config/**'
            # C6b：HTTP win-rate 四端點的 PG 讀取路徑在 2026-10-13 同 PR 附上
            # internal/stocktools/win_rate_pg_integration_test.go（PG/SQLite 逐位元組一致 + 唯讀釘子）。
            - 'internal/stocktools/**'
            # C7：stockpicker 每日更新的「主寫入」改為 PG（SQLite 改為 opt-in 鏡射）時，
            # 同 PR 附上 internal/stockpicker/pg_primary_integration_test.go（真 PG：PG 有列／
            # atlas.db 未建立／同日重跑 skip／乾跑不寫）。此前該套件的 integration 測試
            # （dual_write_integration_test.go）不在過濾器內 ⇒ 從未被執行。
            - 'internal/stockpicker/**'
            # C6c：第三個 win-rate 讀取端（orchestrator 的 stockpicker executor）
            # 在 2026-10-14 同 PR 附上
            # internal/orchestrator/stockpicker_winrate_backend_integration_test.go
            # （真 PG：方向、空≠故障、PG 不可用回退）。
            - 'internal/orchestrator/**'
            # Q2 batch 2 單元 1：live 監控 API 的 outcome/session-summary 讀取
            # 改走 backend-aware store（PG 優先、JSONL 回退）時，同 PR 附上
            # internal/monitoring/api/live/outcomes_store_integration_test.go
            # （真 PG：方向／空≠故障／PG 不可用回退）。此前 internal/monitoring
            # 不在過濾器內 ⇒ 該目錄的 integration 測試從未被執行。
            - 'internal/monitoring/**'
            # 只在該 cmd 已有 PG integration 測試時才加進來（否則只是空跑 13 分鐘）；新增測試後同 PR 一併補上。
            # cmd/atlas-mcp：C6 的 win-rate PG 讀取路徑在 2026-10-13 同 PR 附上
            # tools_stock_winrate_pg_integration_test.go（PG/SQLite 逐列一致 + 唯讀釘子）。
            - 'cmd/atlas-mcp/**'
            - 'cmd/migrate-data/**'
            # `cmd/run-stockpicker-backtest/**` 於 2026-10-16（FU-20261015-01 反向清理）移除：無 gated 測試檔，
            # 且以 `grep -rn '<該路徑>' --include=*.go` 查證 ⇒ **沒有任何 Go 檔 import 它**（CLI；
            # 面板邏輯已於 PR 2e 移到 `internal/stockpicker`，後者已在白名單內）。符合本段註解
            # 「只在該 cmd 已有 PG integration 測試時才加進來（否則只是空跑）」的規則。
            - 'cmd/backfill-futures-bars/**'
            # 同規則：#2126 的 quotes range 回補 CLI（PG integration 測試同 PR 一併附上）。
            - 'cmd/backfill-quotes-range/**'
            # #2107：這四支 backfill CLI 於 2026-09-29 起具備 postgres 後端決策
            # （宣告 ATLAS_STORE_BACKEND），並在同 PR 加上 PG integration 測試。
            - 'cmd/backfill-period-history/**'
            - 'cmd/backfill-period-history-range/**'
            - 'cmd/backfill-outcome-period/**'
            - 'cmd/backfill-event-calendar/**'
            # FU-20261015-01（2026-10-16 盤查）：以下目錄**有** `//go:build integration` 測試檔卻不在
            # 白名單內 ⇒ 只改這些目錄的 PR 會讓本 job 變成 **skipping（不是 pass）**，那些測試因此
            # 從未被觸發（本機跑得到 ⇒ 假安全）。守門：scripts/ci/check_integration_filter_sync.py
            # （契約測試 tests/scripts/test-integration-filter-sync.sh），註冊於 `governance` job
            # （無 paths filter）與 `make ci-gate`。
            # repo 根目錄的 integration_test.go（Darwinian Weights／Superinvestor／PRISM 家族）。
            # 注意 picomatch 無 matchBase ⇒ 裸樣式只匹配**根目錄**那一支，不是任何同名檔。
            - 'integration_test.go'
            # internal/apigateway/channel_status_integration_test.go（channel status store 契約）
            - 'internal/apigateway/**'
            # internal/calibration/pg_reader_integration_test.go（#2123：分數必須來自 PostgresHistoricalStore，
            # 不是 job-local sqlite artifact）。
            - 'internal/calibration/**'
            # internal/fubonproxy/e2e_test.go（-fubon-port／preflight zombie reclaim 的 binary e2e）。
            - 'internal/fubonproxy/**'
            # internal/marketdata/sector_index_reader_real_test.go（sector_index 讀取路徑：來源優先、
            # 8 產業 legacy 折疊平均、視窗過濾、缺日不補 0、壞檔忽略）。
            # 2026-10-16（FU-20261016-17）之前是**豁免**：該測試讀 repo 根的
            # data/state/sector_index（gitignored）⇒ 在 CI 確定性 SKIP（run 38831941034：
            # `--- SKIP: TestSectorIndexReader_ReadRange_RealFixture (0.00s)`），補白名單只買到
            # ~14 分鐘的空跑。同票改成**合成 fixture**（t.TempDir()：18 產業 batch ＋ 8 產業 legacy
            # 單日 ＋ 壞檔／異名檔）後，該測試在乾淨 checkout 上**真的斷言**（全檔已無 t.Skip）
            # ⇒ 依「不再 SKIP 就補白名單」的判準改回白名單。代價：每個 marketdata PR 多跑一趟
            # integration suite（實測 806s／820s／864s），換到的是 sector_index 讀取路徑的真覆蓋。
            - 'internal/marketdata/**'
            # 例外（豁免，理由必填；格式：`# integration-filter-exempt: <dir> — <理由>`，由守門解析）：
            # cmd/atlas-mcp-setup/integration_test.go 已由 test-cmd-atlas job（無 paths filter）以
            # `go test -tags=integration ./cmd/atlas-mcp-setup/` 在每個 code 變更上執行
            # ⇒ 不必再觸發整個 integration suite。
            # integration-filter-exempt: cmd/atlas-mcp-setup — 已由 test-cmd-atlas job 逐 PR 執行該套件，不需再觸發整個 integration suite
            # `migrations/**` 於 2026-10-16（FU-20261015-01 反向清理）移除：**repo 內不存在 top-level
            # `migrations/`**（真目錄是 `sql/migrations/`，56 個檔全是 `.sql`，由下面的 `**/*.sql` 涵蓋）
            # ⇒ 此 glob 匹配不到任何路徑（死條目）。注意它與 `sql/migrations/**` 是**不同路徑**，
            # 從來沒有保護過真的 migrations 目錄（「名稱相似 ≠ 有保護」）。
            # 同一條 glob 在 `code` filter **保留**：該 filter 沒有 `**/*.sh`、也沒有萬用 fallback ⇒
            # 移除會讓「未來有人建 `migrations/foo.sh`／`migrations/*.py`」不再觸發 `code`（真盲區）。
            - '**/*.sql'

  integration:
    runs-on: ubuntu-latest
    needs: [build, frontend-build, changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.integration == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run integration tests
      env:
        REDIS_URL: redis://localhost:6379
        DATABASE_URL: postgres://atlas:atlas_test@localhost:5432/atlas_test?sslmode=disable
        # Hermeticity (M7): point ATLAS_ENV_FILE at /dev/null so any spawned
        # binary never reads a stray .env. In-process tests are additionally
        # guarded by testing.Testing() in config.Load(). Integration tests
        # must read DATABASE_URL/REDIS_URL only.
        ATLAS_ENV_FILE: /dev/null
      run: |
        # -p 1 serializes packages: repository and ledger integration tests
        # share the postgres tables (recommendation_outcomes, ...), and
        # running them in parallel makes one package's TRUNCATE/full cleanup
        # wipe the other's in-flight rows (M8 shared-DB cross-test pollution).
        go test -v -tags=integration -p 1 ./...

  # Semantic commit message validation (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  commitlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
    - name: Check semantic commit messages
      # `github.base_ref` is EMPTY on push events (and `github.event.before` is
      # all-zeros on a fresh branch), so the range used to be "origin/..HEAD":
      # git could not resolve it, the gate swallowed the failure and printed
      # ✅ rc=0 (FU-20261016-27; visible in every push run's log). Pick a range
      # that resolves, and let the script exit 2 (fail loud) if none does.
      env:
        BASE_REF: ${{ github.base_ref }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        base="origin/${BASE_REF}"
        if [ -z "${BASE_REF}" ]; then
          base="${BEFORE_SHA}"
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            base="HEAD~1"
          fi
        fi
        bash ./scripts/ci/check_commit_messages.sh "${base}" "HEAD"

  # Governance gate (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  governance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Verify Governance Gates
      run: bash ./scripts/openclaw/verify_governance_gates.sh

    # Script contract tests for the governance/first-line scripts themselves.
    # Both are hermetic (no GitHub access, no Go run, no repo writes): the
    # branch-protection test stubs `gh` on PATH, the generate-drift test only
    # reads workflow YAML. Keep them here, next to the gates they protect.
    - name: Verify branch-protection and generate-drift script contracts
      run: |
        bash tests/scripts/test-branch-protection-known-checks.sh
        bash tests/scripts/test-generate-drift-coverage.sh

    # integration 路徑過濾器同步守門（FU-20261015-01）。放在這個**無 paths filter** 的 job
    # 是刻意的：若放進 `integration` job 自己，就等於「漏列目錄時守門也不會跑」。
    # 兩者皆 hermetic（不連網、不跑 Go、不寫 repo），契約測試只讀 workflow YAML 與自帶 fixture。
    - name: Verify integration path-filter sync (guard + hermetic contract test)
      run: |
        bash tests/scripts/test-integration-filter-sync.sh
        bash scripts/ci/check_integration_filter_sync.sh

    # 測試不得用固定相對層數定位 repo 根（FU-20261016-20）。與上面同一個**無 paths filter**
    # 的 job：這個缺陷是「lane 本機假綠、CI 紅」，只在 pre-push（`make ci-gate`）不夠，
    # 因為不跑 hook 的人照樣能推。兩者皆 hermetic（只讀 git ls-files 與自帶 fixture、
    # 不跑 Go、不連網、不寫 repo）。
    - name: Verify test repo-root guard (Tier A ban + Tier B ratchet + hermetic contract test)
      run: |
        bash tests/scripts/test-test-repo-root-guard.sh
        bash scripts/ci/check_test_repo_root.sh

  # Operations gate (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  operations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Verify Operations Gate
      run: bash ./scripts/openclaw/verify_operations_gate.sh

  # Route uniqueness check — catches stale/conflicting HTTP paths
  routes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Verify route uniqueness
      run: bash ./scripts/check-routes.sh


  # Contract validation — ensures MCP tool paths match route table
  contracts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Validate MCP tool contracts
      run: python3 scripts/gen-contracts.py --validate
  # Release gate — aggregates all CI-safe checks into one pass/fail signal.
  # Treats skipped jobs as acceptable, which happens for documentation-only PRs.
  release-check:
    runs-on: ubuntu-latest
    needs: [routes, contracts, build, lint, test-cmd-atlas, db-migration-check]
    if: always()
    steps:
    - name: Gate decision
      run: |
        # Any needed job that failed or was cancelled blocks the gate.
        # Skipped is allowed (e.g., docs-only PRs where build/lint/test do not run).
        RESULTS=(
          "routes:${{ needs.routes.result }}"
          "contracts:${{ needs.contracts.result }}"
          "build:${{ needs.build.result }}"
          "lint:${{ needs.lint.result }}"
          "test-cmd-atlas:${{ needs.test-cmd-atlas.result }}"
          "db-migration-check:${{ needs.db-migration-check.result }}"
        )
        FAILED=0
        for entry in "${RESULTS[@]}"; do
          job="${entry%%:*}"
          result="${entry##*:}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::$job result=$result"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "❌ Release gate: BLOCKED"
          exit 1
        fi
        echo "✅ Release gate: PASSED"

  # Consumer smoke test — runs against live docker-compose on main pushes
  hermes-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    needs: [release-check, changes, frontend-build]
    env:
      ATLAS_GIT_COMMIT: ${{ github.sha }}
      # Warmup-grace window (seconds) for the runtime canary: a fresh
      # container reports healthy while background RunWarmup is still running,
      # so 503/connection-refused inside this window are tolerated; after it,
      # any 503 still FAILs. See cmd/atlas-mcp/server/canary_tolerance_test.go.
      CANARY_WARMUP_GRACE: "120"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    # Dockerfile.atlas.local COPYs these 4 host-built binaries from .build-atlas/.
    # CI runners are linux/amd64 (unlike the arm64 production host's `make rebuild-atlas-bins`;
    # production = Mac Mini, 2026-09-22 起取代 iMac),
    # so build with GOARCH=amd64 here.
    - name: Build atlas binaries for Dockerfile.atlas.local (linux/amd64)
      env:
        GOOS: linux
        GOARCH: amd64
        # CGO_ENABLED=0 is REQUIRED: Dockerfile.atlas.local is alpine (musl).
        # A native build on the runner has cgo ON by default and produces a
        # glibc-dynamic binary whose loader is absent in alpine — the
        # container then crash-loops with "exec /app/atlas-go: no such file
        # or directory" (kernel ENOENT on missing PT_INTERP).
        CGO_ENABLED: "0"
        GIT_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        mkdir -p .build-atlas
        # Transient proxy.golang.org 403s (observed on 2026-08-17) can fail
        # cold module downloads on a fresh runner; retry before building.
        for i in 1 2 3; do
          go mod download && break || sleep 5
        done
        ldflags="-w -s \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Version=dev \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Commit=${GIT_COMMIT} \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/atlas-go ./cmd/atlas
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/atlas-mcp ./cmd/atlas-mcp
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/daily-replay-sync ./cmd/daily-replay-sync
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/calibrate-parameters ./cmd/calibrate-parameters
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/calibrate-seasonal ./cmd/calibrate-seasonal
        # Guard: alpine cannot exec glibc-dynamic binaries. Catch regressions
        # here instead of a 3-minute invisible crash loop in the container.
        file .build-atlas/atlas-go | grep -q "statically linked" || { echo "::error::atlas-go is not statically linked — CGO_ENABLED=0 required for the alpine image"; file .build-atlas/atlas-go; exit 1; }
        ls -la .build-atlas
    - name: Create .env for docker compose
      run: mkdir -p ${HOME}/.config/atlas-go && touch ${HOME}/.config/atlas-go/.env
    - name: Prepare data mounts for container user (uid 1000)
      # The alpine image runs as atlas (uid 1000). On a fresh checkout the
      # data/reports/logs bind mounts are owned by the runner user (uid
      # 1001), so the app's file-backed stores (alerts, macro snapshot
      # cache, ...) fail to initialize → /api/alerts/*, macro endpoints
      # return 404/500 and the container never passes a meaningful canary.
      run: |
        mkdir -p data reports logs
        chmod -R a+rwX data reports logs
    - name: Validate docker-compose
      run: docker compose config -q
    - name: Start atlas-go
      run: docker compose up -d atlas
    - name: Wait for healthy (fail-fast with diagnostics)
      run: bash scripts/ci-wait-healthy.sh atlas 240
    - name: Run consumer smoke
      run: bash scripts/hermes-smoke.sh
    - name: Teardown
      if: always()
      run: docker compose down -v
  # CI summary notification — posts pass/fail comment on PR

  # Runtime canary — exercises all read-only MCP tools against live atlas-go
  canary-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    needs: [release-check, changes, frontend-build]
    env:
      ATLAS_GIT_COMMIT: ${{ github.sha }}
      # Warmup-grace window (seconds) for the runtime canary: a fresh
      # container reports healthy while background RunWarmup is still running,
      # so 503/connection-refused inside this window are tolerated; after it,
      # any 503 still FAILs. See cmd/atlas-mcp/server/canary_tolerance_test.go.
      CANARY_WARMUP_GRACE: "120"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    # Dockerfile.atlas.local COPYs these 4 host-built binaries from .build-atlas/.
    # CI runners are linux/amd64 (unlike the arm64 production host's `make rebuild-atlas-bins`;
    # production = Mac Mini, 2026-09-22 起取代 iMac),
    # so build with GOARCH=amd64 here.
    - name: Build atlas binaries for Dockerfile.atlas.local (linux/amd64)
      env:
        GOOS: linux
        GOARCH: amd64
        # CGO_ENABLED=0 is REQUIRED: Dockerfile.atlas.local is alpine (musl).
        # A native build on the runner has cgo ON by default and produces a
        # glibc-dynamic binary whose loader is absent in alpine — the
        # container then crash-loops with "exec /app/atlas-go: no such file
        # or directory" (kernel ENOENT on missing PT_INTERP).
        CGO_ENABLED: "0"
        GIT_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        mkdir -p .build-atlas
        # Transient proxy.golang.org 403s (observed on 2026-08-17) can fail
        # cold module downloads on a fresh runner; retry before building.
        for i in 1 2 3; do
          go mod download && break || sleep 5
        done
        ldflags="-w -s \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Version=dev \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.Commit=${GIT_COMMIT} \
          -X github.com/kaecer68/atlas-go/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/atlas-go ./cmd/atlas
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/atlas-mcp ./cmd/atlas-mcp
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/daily-replay-sync ./cmd/daily-replay-sync
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/calibrate-parameters ./cmd/calibrate-parameters
        go build -mod=mod -ldflags="$ldflags" -o .build-atlas/calibrate-seasonal ./cmd/calibrate-seasonal
        # Guard: alpine cannot exec glibc-dynamic binaries. Catch regressions
        # here instead of a 3-minute invisible crash loop in the container.
        file .build-atlas/atlas-go | grep -q "statically linked" || { echo "::error::atlas-go is not statically linked — CGO_ENABLED=0 required for the alpine image"; file .build-atlas/atlas-go; exit 1; }
        ls -la .build-atlas
    - name: Create .env for docker compose
      run: mkdir -p ${HOME}/.config/atlas-go && touch ${HOME}/.config/atlas-go/.env
    - name: Prepare data mounts for container user (uid 1000)
      # The alpine image runs as atlas (uid 1000). On a fresh checkout the
      # data/reports/logs bind mounts are owned by the runner user (uid
      # 1001), so the app's file-backed stores (alerts, macro snapshot
      # cache, ...) fail to initialize → /api/alerts/*, macro endpoints
      # return 404/500 and the container never passes a meaningful canary.
      run: |
        mkdir -p data reports logs
        chmod -R a+rwX data reports logs
    - name: Start atlas-go
      run: docker compose up -d atlas
    - name: Wait for healthy (fail-fast with diagnostics)
      run: bash scripts/ci-wait-healthy.sh atlas 300
    - name: Run runtime canary
      run: ATLAS_BASE_URL=http://localhost:18080 go test -run TestCanary_Runtime -tags=canary -count=1 -v ./cmd/atlas-mcp/server/
    - name: Teardown
      if: always()
      run: docker compose down -v
  notify:
    runs-on: ubuntu-latest
    needs: [build, test-cmd-atlas, lint, security, integration, generate, agents-md-drift, db-migration-check, commitlint, governance, operations, routes, contracts, release-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
    - name: Post CI summary comment
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Skipped is acceptable for docs-only PRs; only failure/cancelled is red.
        is_bad() {
          case "$1" in
            failure|cancelled) return 0 ;;
            *) return 1 ;;
          esac
        }
        STATUS_FLAG=":white_check_mark:"
        if is_bad "${{ needs.build.result }}" || \
           is_bad "${{ needs.test-cmd-atlas.result }}" || \
           is_bad "${{ needs.lint.result }}" || \
           is_bad "${{ needs.generate.result }}" || \
           is_bad "${{ needs.agents-md-drift.result }}"; then
          STATUS_FLAG=":x:"
        fi
        cat <<EOF | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file -
        ## ${STATUS_FLAG} CI Summary

        | Job | Result |
        |-----|--------|
        | build | ${{ needs.build.result }} |
        | test-cmd-atlas | ${{ needs.test-cmd-atlas.result }} |
        | lint | ${{ needs.lint.result }} |
        | security | ${{ needs.security.result }} |
        | integration | ${{ needs.integration.result }} |
        | generate | ${{ needs.generate.result }} |
        | agents-md-drift | ${{ needs.agents-md-drift.result }} |
        | db-migration-check | ${{ needs.db-migration-check.result }} |
        | commitlint | ${{ needs.commitlint.result }} |
        | governance | ${{ needs.governance.result }} |
        | operations | ${{ needs.operations.result }} |

        \`\`\`
        Triggered by: ${{ github.event_name }} on ${{ github.ref }}
        \`\`\`
        EOF
