name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  merge_group:
    types: [ checks_requested ]
  release:
    types: [ created ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  # Frontend build (reusable) — builds admin_web + client_web once,
  # uploads dist artifacts. Downstream jobs download instead of rebuilding.
  frontend-build:
    uses: ./.github/workflows/_frontend-build.yml
    permissions:
      contents: read
      actions: write

  # Build and Test
  build:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Persistence format check
      run: go run ./cmd/check-persistence-format -dir data/state

    - name: Test (excluding cmd/atlas — heavy integration, separate job)
      run: go test -v -race -coverprofile=coverage.out -coverpkg=./... $(go list ./... | grep -v '/cmd/atlas$')

    - name: Check coverage threshold (≥ 60%)
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '\r' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        if echo "$COVERAGE 60" | awk '{exit !($1 < $2)}'; then
          echo "::error::Coverage ${COVERAGE}% is below 60% threshold"
          exit 1
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # cmd/atlas tests spin up full SystemCore with real providers (TWSE, GDELT, etc.)
  # — needs 20min timeout, no -race (race detector makes goroutine cleanup stall)
  test-cmd-atlas:
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build cmd/atlas
      run: go build ./cmd/atlas/...

    - name: Test cmd/atlas (20min timeout, no -race)
      run: go test -v -timeout=20m ./cmd/atlas/...

    - name: Test cmd/atlas-mcp-setup integration (mock backend)
      # 2026-07-10: PR #1066 (Finding #4 follow-up). Build tag `integration`
      # gates this so regular `go test ./...` does not spawn subprocesses.
      # Uses newline-delimited JSON-RPC (the go-mcp SDK's stdio framing);
      # mock backend via httptest.NewServer (no external services needed).
      run: go test -v -tags=integration -timeout=60s ./cmd/atlas-mcp-setup/

  # Lint
  lint:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: v2.12.2
        args: --timeout=5m
        # PR diff for this branch is >20k lines, which breaks the action's
        # only-new-issues patch fetch. Run the full linter instead.
        only-new-issues: false

  # Generate — Verify auto-generated files are up-to-date.
  # Runs go generate for both gentags (field_types.ts / valid_fields.json)
  # and atlas-mcp descgen (auto-desc.gen.json / auto-desc.gen.go).
  # If generation produces a diff, the job fails to signal drift.
  generate:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Generate field_types.ts and valid_fields.json
      run: go generate ./...

    - name: Generate MCP auto-desc
      run: go generate ./cmd/atlas-mcp/...

    - name: Check for drift
      run: |
        if ! git diff --exit-code; then
          echo "::error:: Generated files are out of date. Run 'go generate ./...' and commit the changes."
          git diff --stat
          exit 1
        fi

  # AGENTS.md doc drift check — verifies all internal/*/AGENTS.md file:line
  # references point to real files/lines. Catches drift introduced by code
  # refactors without updating the corresponding AGENTS.md documentation.
  agents-md-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run agents.md drift check
      run: bash scripts/ci/check_agents_md_drift.sh

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run Gosec Security Scanner
      uses: securego/gosec@de65614d10a6b84029e3e1215567b8ce7e490f23 # master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
      continue-on-error: true
      with:
        sarif_file: results.sarif

  # Build Docker Image
  docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build, lint]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short

    - name: Set build metadata
      id: build_meta
      run: |
        echo "version=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "buildtime=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
        echo "gitcommit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.build_meta.outputs.version }}
          BUILDTIME=${{ steps.build_meta.outputs.buildtime }}
          GIT_COMMIT=${{ steps.build_meta.outputs.gitcommit }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/

  # Integration Tests
  # Use paths-filter to skip heavy service containers (postgres+redis) for
  # PRs that don't touch the database layer.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      id: filter
      with:
        filters: |
          integration:
            - 'internal/db/**'
            - 'internal/repository/**'
            - 'internal/storage/**'
            - 'migrations/**'
            - '**/*.sql'

  integration:
    runs-on: ubuntu-latest
    needs: [build, frontend-build, changes]
    if: needs.changes.outputs.integration == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/download-artifact@v4 # v4
      with:
        name: admin-web-dist
        path: admin_web/dist

    - uses: actions/download-artifact@v4 # v4
      with:
        name: client-web-dist
        path: client_web/dist

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run integration tests
      env:
        REDIS_URL: redis://localhost:6379
        DATABASE_URL: postgres://atlas:atlas_test@localhost:5432/atlas_test?sslmode=disable
      run: |
        go test -v -tags=integration ./...

  # Semantic commit message validation (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  commitlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
    - name: Check semantic commit messages
      run: bash ./scripts/ci/check_commit_messages.sh "origin/${{ github.base_ref }}" "HEAD"

  # Governance gate (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  governance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Verify Governance Gates
      run: bash ./scripts/openclaw/verify_governance_gates.sh

  # Operations gate (migrated from ci.yml per 2026-07-03 pipeline audit Phase 2)
  operations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Verify Operations Gate
      run: bash ./scripts/openclaw/verify_operations_gate.sh

  # Route uniqueness check — catches stale/conflicting HTTP paths
  routes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Verify route uniqueness
      run: bash ./scripts/check-routes.sh


  # Contract validation — ensures MCP tool paths match route table
  contracts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Validate MCP tool contracts
      run: python3 scripts/gen-contracts.py --validate
  # Release gate — aggregates all CI-safe checks into one pass/fail signal
  release-check:
    runs-on: ubuntu-latest
    needs: [routes, contracts, build, lint, test-cmd-atlas]
    if: always()
    steps:
    - name: Gate decision
      run: |
        if [ "${{ needs.routes.result }}" = "success" ] && \
           [ "${{ needs.contracts.result }}" = "success" ] && \
           [ "${{ needs.build.result }}" = "success" ] && \
           [ "${{ needs.lint.result }}" = "success" ] && \
           [ "${{ needs.test-cmd-atlas.result }}" = "success" ]; then
          echo "✅ Release gate: ALL PASSED"
        else
          echo "❌ Release gate: BLOCKED"
          echo "  routes:       ${{ needs.routes.result }}"
          echo "  contracts:    ${{ needs.contracts.result }}"
          echo "  build:        ${{ needs.build.result }}"
          echo "  lint:         ${{ needs.lint.result }}"
          echo "  test:         ${{ needs.test-cmd-atlas.result }}"
          exit 1
        fi

  # Consumer smoke test — runs against live docker-compose on main pushes
  hermes-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [release-check]
    env:
      ATLAS_GIT_COMMIT: ${{ github.sha }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Create .env for docker compose
      run: mkdir -p ${HOME}/.config/atlas-go && touch ${HOME}/.config/atlas-go/.env
    - name: Validate docker-compose
      run: docker compose config -q
    - name: Start atlas-go
      run: docker compose up -d atlas
    - name: Wait for healthy
      run: |
        for i in $(seq 1 60); do
          if docker compose ps atlas | grep -q healthy; then break; fi
          sleep 2
        done
    - name: Run consumer smoke
      run: bash scripts/hermes-smoke.sh
    - name: Teardown
      if: always()
      run: docker compose down -v
  # CI summary notification — posts pass/fail comment on PR

  # Runtime canary — exercises all read-only MCP tools against live atlas-go
  canary-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [release-check]
    env:
      ATLAS_GIT_COMMIT: ${{ github.sha }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Create .env for docker compose
      run: mkdir -p ${HOME}/.config/atlas-go && touch ${HOME}/.config/atlas-go/.env
    - name: Start atlas-go
      run: docker compose up -d atlas
    - name: Wait for healthy
      run: |
        for i in $(seq 1 90); do
          if docker compose ps atlas | grep -q healthy; then break; fi
          sleep 2
        done
    - name: Run runtime canary
      run: ATLAS_BASE_URL=http://localhost:18080 go test -run TestCanary_Runtime -tags=canary -count=1 -v ./cmd/atlas-mcp/server/
    - name: Teardown
      if: always()
      run: docker compose down -v
  notify:
    runs-on: ubuntu-latest
    needs: [build, test-cmd-atlas, lint, security, integration, generate, agents-md-drift, commitlint, governance, operations, routes, contracts, release-check]
    permissions:
      pull-requests: write
    steps:
    - name: Post CI summary comment
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        STATUS_FLAG=":white_check_mark:"
        if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.test-cmd-atlas.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.generate.result }}" != "success" ] || [ "${{ needs.agents-md-drift.result }}" != "success" ]; then
          STATUS_FLAG=":x:"
        fi
        cat <<EOF | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file -
        ## ${STATUS_FLAG} CI Summary

        | Job | Result |
        |-----|--------|
        | build | ${{ needs.build.result }} |
        | test-cmd-atlas | ${{ needs.test-cmd-atlas.result }} |
        | lint | ${{ needs.lint.result }} |
        | security | ${{ needs.security.result }} |
        | integration | ${{ needs.integration.result }} |
        | generate | ${{ needs.generate.result }} |
        | agents-md-drift | ${{ needs.agents-md-drift.result }} |
        | commitlint | ${{ needs.commitlint.result }} |
        | governance | ${{ needs.governance.result }} |
        | operations | ${{ needs.operations.result }} |

        \`\`\`
        Triggered by: ${{ github.event_name }} on ${{ github.ref }}
        \`\`\`
        EOF
