name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build and Test
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Persistence format check
      run: go run ./cmd/check-persistence-format -dir data/state

    - name: Test (excluding cmd/atlas — heavy integration, separate job)
      run: go test -v -race -coverprofile=coverage.out -coverpkg=./... $(go list ./... | grep -v '/cmd/atlas$')

    - name: Upload coverage
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # cmd/atlas tests spin up full SystemCore with real providers (TWSE, GDELT, etc.)
  # — needs 20min timeout, no -race (race detector makes goroutine cleanup stall)
  test-cmd-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build cmd/atlas
      run: go build ./cmd/atlas/...

    - name: Test cmd/atlas (20min timeout, no -race)
      run: go test -v -timeout=20m ./cmd/atlas/...

  # Lint
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: v2.12.2
        args: --timeout=5m
        only-new-issues: true

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Run Gosec Security Scanner
      uses: securego/gosec@de65614d10a6b84029e3e1215567b8ce7e490f23 # master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
      continue-on-error: true
      with:
        sarif_file: results.sarif

  # Build Docker Image
  docker:
    runs-on: ubuntu-latest
    needs: [build, lint]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/

  # Integration Tests
  integration:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Run integration tests
      env:
        REDIS_URL: redis://localhost:6379
        DATABASE_URL: postgres://atlas:atlas_test@localhost:5432/atlas_test?sslmode=disable
      run: |
        go test -v -tags=integration ./...

  # CI summary notification — posts pass/fail comment on PR
  notify:
    runs-on: ubuntu-latest
    needs: [build, test-cmd-atlas, lint, security, integration]
    if: github.event_name == 'pull_request' && always()
    steps:
    - name: Post CI summary comment
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        STATUS_FLAG=":white_check_mark:"
        if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.test-cmd-atlas.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
          STATUS_FLAG=":x:"
        fi
        cat <<EOF | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file -
        ## ${STATUS_FLAG} CI Summary

        | Job | Result |
        |-----|--------|
        | build | ${{ needs.build.result }} |
        | test-cmd-atlas | ${{ needs.test-cmd-atlas.result }} |
        | lint | ${{ needs.lint.result }} |
        | security | ${{ needs.security.result }} |
        | integration | ${{ needs.integration.result }} |

        \`\`\`
        Triggered by: ${{ github.event_name }} on ${{ github.ref }}
        \`\`\`
        EOF
